<!DOCTYPE html>

</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased overflow-hidden">
    <div id="app" class="flex h-full w-full">
        
        <!-- SIDEBAR (Dark Teal Theme) -->
        <aside id="sidebar" class="w-64 bg-teal-950 text-slate-200 flex flex-col h-full flex-shrink-0 transition-all duration-300 z-20 shadow-xl">
            <!-- Sidebar Header -->
            <div class="p-5 flex items-center justify-between border-b border-teal-800/60">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-teal-950 font-bold shadow-lg">

                    </div>
                    <div>
                        <h1 class="font-bold text-base tracking-wide text-white">MeuSistema</h1>
                        <p class="text-xs text-teal-300">Gestão Pessoal</p>

                </div>
                <button onclick="toggleSidebarMobile()" class="md:hidden text-teal-300 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>

            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1.5">
                <a href="#" onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all group hover:bg-teal-900/80 text-slate-300 hover:text-white">

                    <i class="fa-solid fa-heart-pulse w-5 text-center text-teal-400 group-hover:scale-110 transition-transform"></i>

                </a>
                <a href="#" onclick="switchTab('financeiro')" id="nav-financeiro" class="nav-item flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all group hover:bg-teal-900/80 text-slate-300 hover:text-white">
                    <i class="fa-solid fa-wallet w-5 text-center text-teal-400 group-hover:scale-110 transition-transform"></i>

                    <i class="fa-solid fa-calendar-days w-5 text-center text-teal-400 group-hover:scale-110 transition-transform"></i>

                <a href="#" onclick="switchTab('lembretes')" id="nav-lembretes" class="nav-item flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all group hover:bg-teal-900/80 text-slate-300 hover:text-white">
                    <i class="fa-solid fa-bell w-5 text-center text-teal-400 group-hover:scale-110 transition-transform"></i>
                    <span>Lembretes</span>

                <a href="#" onclick="switchTab('hobbies')" id="nav-hobbies" class="nav-item flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all group hover:bg-teal-900/80 text-slate-300 hover:text-white">
                    <i class="fa-solid fa-puzzle-piece w-5 text-center text-teal-400 group-hover:scale-110 transition-transform"></i>
                    <span>Hobbies</span>

                <a href="#" onclick="switchTab('habitacao')" id="nav-habitacao" class="nav-item flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all group hover:bg-teal-900/80 text-slate-300 hover:text-white">
                    <i class="fa-solid fa-hammer w-5 text-center text-amber-400 group-hover:scale-110 transition-transform"></i>
                    <span>Habitação (Obra)</span>

                <a href="#" onclick="switchTab('configuracoes')" id="nav-configuracoes" class="nav-item flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all group hover:bg-teal-900/80 text-slate-300 hover:text-white">
                    <i class="fa-solid fa-gear w-5 text-center text-teal-400 group-hover:scale-110 transition-transform"></i>
                    <span>Configurações</span>
                </a>
                <a href="#" onclick="switchTab('backup')" id="nav-backup" class="nav-item flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all group hover:bg-teal-900/80 text-slate-300 hover:text-white">
                    <i class="fa-solid fa-cloud-arrow-down w-5 text-center text-teal-400 group-hover:scale-110 transition-transform"></i>
                    <span>Backup & Pasta</span>

            </nav>

            <!-- Sidebar Footer / Sync Status -->
            <div class="p-4 border-t border-teal-800/60 bg-teal-950/60">
                <div class="flex items-center justify-between text-xs text-teal-300 mb-2">
                    <span id="sync-status-text" class="flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>Pronto para uso</span>
                    </span>
                    <button onclick="triggerManualSave()" class="hover:text-white underline">Salvar</button>
                </div>
                <div class="text-[10px] text-teal-400/70 truncate" id="current-folder-label">Armazenamento Local Ativo</div>
            </div>
        </aside>

        <!-- MAIN CONTENT WRAPPER -->
        <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 dark:bg-slate-900">
            <!-- Top Header -->
            <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6 flex-shrink-0 shadow-sm">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleSidebarMobile()" class="md:hidden text-slate-600 dark:text-slate-300 hover:text-teal-600">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h2 id="current-page-title" class="text-xl font-bold text-slate-800 dark:text-white">Meu Dia</h2>
                </div>
                <div class="flex items-center space-x-3">
                    <span id="current-date-badge" class="hidden sm:inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium bg-teal-50 dark:bg-teal-950/50 text-teal-700 dark:text-teal-300 border border-teal-200 dark:border-teal-800">
                        <i class="fa-regular fa-calendar mr-2"></i> <span id="header-date-text">--/--/----</span>
                    </span>
                    <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                        <i class="fa-solid fa-moon dark:hidden"></i>

                    </button>
                </div>
            </header>

            <!-- Scrollable Content Area -->
            <main id="main-content-container" class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8">
                <!-- Content injected dynamically via JavaScript -->
            </main>
        </div>
    </div>

    <!-- LOGIN GOOGLE DRIVE -->
    <div id="login-gate" class="hidden fixed inset-0 z-[60] bg-slate-900/95 items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 text-center">
            <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-teal-600 text-white flex items-center justify-center text-2xl"><i class="fa-solid fa-house-chimney"></i></div>
            <h2 class="text-lg font-bold text-slate-800 mb-1">Meu Sistema</h2>
            <p class="text-sm text-slate-500 mb-5">Entre com a conta Google do Drive para carregar suas informações.</p>
            <button onclick="driveSignIn()" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3 rounded-xl font-bold text-sm shadow flex items-center justify-center space-x-2"><i class="fa-brands fa-google"></i><span>Entrar com Google</span></button>
            <p id="login-gate-msg" class="text-xs text-rose-500 mt-3 min-h-[1rem]"></p>
            <button onclick="showLoginGate(false)" class="text-[11px] text-slate-400 hover:text-slate-600 underline mt-2">Continuar sem entrar (dados só deste navegador)</button>
        </div>
    </div>

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="global-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="modal-content" class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-100 dark:border-slate-700 transform transition-all max-h-[90vh] overflow-y-auto">
            <!-- Modal header & form injected dynamically -->
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        // --- CORE DATA STORE & INITIALIZATION ---
        let appData = {
            profile: {
                name: "Samuel & Tayná",
                theme: "light"
            },
            saude: {
                waterGoal: 3000,
                waterLog: {}, // { 'YYYY-MM-DD': ml }
                meds: [],     // { id, name, time }
                medLog: {}    // { 'YYYY-MM-DD': [medId, ...] }
            },
            financeiro: {
                transactions: []
            },
            agenda: [], // { id, date, time, address, title, desc, status }
            lembretes: [], // { id, title, date, priority, completed }
            hobbies: [], // { id, title, category, status, obs }
            habitacao: {
                people: [
                    { id: '1', name: 'Samuel', initialBalance: 0 },
                    { id: '2', name: 'Tayná', initialBalance: 0 }
                ],
                contributions: [],
                budgets: [], // { id, title, supplier, amount, date, status, fileName, fileData }
                suppliers: [], // { id, name, contact, phone, obs }
                docFolders: [] // { id, name, files: [{ id, name, size, type, date }] }
            },
            atalhos: [],
            metas: []
        };

        let currentActiveTab = 'dashboard';
        let directoryHandle = null;

        // --- FILTERS STATE ---
        let agendaFilter = 'ativos'; // 'todos', 'ativos', 'finalizados'
        let lembreteFilter = 'ativos'; // 'todos', 'ativos', 'finalizados'
        let hobbyFilter = 'ativos'; // 'todos', 'ativos', 'finalizados'
        let financeFilterDate = ''; // '' for all, or YYYY-MM
        let obraFilterStatus = 'todos';
        let obraSortOrder = 'date-desc';
        let budgetFilterStatus = 'todos';
        let financeFilterStatus = 'todos'; // 'todos', 'pago', 'pendente'
        let waterDate = localDateStr();
        let medSelectedDate = localDateStr();
        let medCalMonth = localDateStr().slice(0, 7); // YYYY-MM
        let habDocsOpen = false;
        let habDocsFolderId = null;


        // --- HELPERS: DATAS ---
        function localDateStr(d = new Date()) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${dd}`;
        }
        function fmtBR(dateStr) {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        }
        function addMonthsToDate(dateStr, n) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const lastDay = new Date(y, m - 1 + n + 1, 0).getDate();
            return localDateStr(new Date(y, m - 1 + n, Math.min(d, lastDay)));
        }
        function esc(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
        function money(v) { return Number(v).toLocaleString('pt-BR', {minimumFractionDigits: 2}); }

        // --- HELPERS: ARQUIVOS (IndexedDB) ---
        // Os arquivos ficam no IndexedDB (suporta muito mais espaço que o localStorage);
        // em appData ficam apenas os metadados (nome, tamanho, tipo, data).
        let _filesDBPromise = null;
        function filesDB() {
            if (!_filesDBPromise) {
                _filesDBPromise = new Promise((resolve, reject) => {
                    const req = indexedDB.open('meusistema_files', 1);
                    req.onupgradeneeded = () => req.result.createObjectStore('files');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }
            return _filesDBPromise;
        }
        async function putFile(id, blob) {
            const db = await filesDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('files', 'readwrite');
                tx.objectStore('files').put(blob, id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }
        async function getFile(id) {
            const db = await filesDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction('files').objectStore('files').get(id);
                req.onsuccess = () => { if (req.result) resolve(req.result); else driveFetchAttachment(id).then(resolve); };
                req.onerror = () => reject(req.error);
            });
        }
        async function deleteStoredFile(id) {
            try {
                const db = await filesDB();
                db.transaction('files', 'readwrite').objectStore('files').delete(id);
            } catch (e) { console.error(e); }
        }
        async function storeFiles(fileList) {
            const metas = [];
            for (const file of Array.from(fileList || [])) {
                const id = uid();
                try {
                    await putFile(id, file);
                    driveUploadAttachment(id, file).catch(console.error);
                    metas.push({ id, name: file.name, size: file.size, type: file.type || '', date: localDateStr() });
                } catch (e) {
                    console.error(e);
                    showToast(`Não foi possível guardar "${file.name}".`, 'error');
                }
            }
            return metas;
        }
        async function openStoredFile(id) {
            const blob = await getFile(id);
            if (!blob) { showToast('Arquivo não encontrado neste navegador.', 'error'); return; }
            const url = URL.createObjectURL(blob);
            const w = window.open(url, '_blank');
            if (!w) { await downloadStoredFile(id); return; }
            setTimeout(() => URL.revokeObjectURL(url), 120000);
        }
        async function downloadStoredFile(id, name) {
            const blob = await getFile(id);
            if (!blob) { showToast('Arquivo não encontrado neste navegador.', 'error'); return; }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name || blob.name || 'arquivo';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }
        function downloadMeta(id) {
            // procura o nome do arquivo nos anexos / documentos
            let name = '';
            appData.financeiro.transactions.forEach(t => (t.attachments || []).forEach(a => { if (a.id === id) name = a.name; }));
            appData.habitacao.docFolders.forEach(f => f.files.forEach(a => { if (a.id === id) name = a.name; }));
            downloadStoredFile(id, name);
        }
        function fmtSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(0) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }
        function fileIcon(f) {
            const t = (f.type || '').toLowerCase(), n = (f.name || '').toLowerCase();
            if (t.startsWith('image/')) return 'fa-file-image text-sky-500';
            if (t === 'application/pdf' || n.endsWith('.pdf')) return 'fa-file-pdf text-rose-500';
            if (n.match(/\.(xls|xlsx|csv)$/)) return 'fa-file-excel text-emerald-600';
            if (n.match(/\.(doc|docx)$/)) return 'fa-file-word text-blue-600';
            return 'fa-file text-slate-400';
        }

        function loadAppData() {
            const saved = localStorage.getItem('meusistema_pessoal_data');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch (e) {
                    console.error("Erro ao carregar dados salvos:", e);
                }
            }
            if (!appData.habitacao) {
                appData.habitacao = {
                    people: [{ id: '1', name: 'Samuel', initialBalance: 0 }, { id: '2', name: 'Tayná', initialBalance: 0 }],
                    contributions: [],
                    budgets: [],
                    suppliers: []
                };
            }
            if (!appData.habitacao.suppliers) appData.habitacao.suppliers = [];
            if (!appData.habitacao.budgets) appData.habitacao.budgets = [];
            if (!appData.habitacao.docFolders) appData.habitacao.docFolders = [];

            // Saúde: migração para registro de água por dia e histórico de remédios
            if (!appData.saude) appData.saude = {};
            if (!appData.saude.waterGoal) appData.saude.waterGoal = 3000;
            if (!appData.saude.waterLog) appData.saude.waterLog = {};
            if (!appData.saude.medLog) appData.saude.medLog = {};
            if (!appData.saude.meds) appData.saude.meds = [];
            if (appData.saude.water && Object.keys(appData.saude.waterLog).length === 0) {
                appData.saude.waterLog[localDateStr()] = Number(appData.saude.water);
            }
            delete appData.saude.water;
            delete appData.saude.sleep;

            // Financeiro: lançamentos antigos passam a constar como "pago"
            if (!appData.financeiro) appData.financeiro = { transactions: [] };
            appData.financeiro.transactions.forEach(t => {
                if (!t.status) t.status = 'pago';
                if (!t.attachments) t.attachments = [];
            });
        }

        function saveAppData() {
            try {
                appData._savedAt = new Date().toISOString();
                localStorage.setItem('meusistema_pessoal_data', JSON.stringify(appData));
                updateSyncStatus("Salvo localmente", "emerald");
            } catch (e) {
                console.error(e);
                updateSyncStatus("Erro ao salvar", "rose");
                showToast("Armazenamento do navegador cheio. Remova anexos de orçamentos antigos.", "error");
            }
            if (directoryHandle) {
                scheduleFolderSave();
            }
            scheduleDriveSave();
        }

        function updateSyncStatus(text, color) {
            const statusEl = document.getElementById('sync-status-text');
            if (!statusEl) return;
            let colorClass = "bg-emerald-400";
            if (color === 'amber') colorClass = "bg-amber-400";
            if (color === 'rose') colorClass = "bg-rose-400";
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full ${colorClass} animate-pulse"></span><span>${text}</span>`;
        }

        // =====================================================
        // BACKUP EM PASTA (vínculo persistente) + RESTAURAÇÃO
        // =====================================================
        const STORAGE_KEY = 'meusistema_pessoal_data';
        const BACKUP_FILE = 'meusistema_backup.json';
        const BACKUP_PREV = 'meusistema_backup_anterior.json';
        let folderNeedsPermission = false;
        let folderBackedUpOnce = false;
        let folderSaveTimer = null;
        let lastFolderSync = null;
        let _pendingRestore = null; // { obj, label, onKeep }

        // --- guarda o vínculo da pasta no IndexedDB (sobrevive ao recarregar) ---
        function handlesDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('meusistema_handles', 1);
                req.onupgradeneeded = () => req.result.createObjectStore('handles');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }
        async function persistHandle(h) {
            try {
                const db = await handlesDB();
                await new Promise((res, rej) => {
                    const tx = db.transaction('handles', 'readwrite');
                    if (h) tx.objectStore('handles').put(h, 'backupDir');
                    else tx.objectStore('handles').delete('backupDir');
                    tx.oncomplete = res;
                    tx.onerror = () => rej(tx.error);
                });
            } catch (e) { console.error('Não foi possível guardar o vínculo da pasta:', e); }
        }
        async function recoverHandle() {
            try {
                const db = await handlesDB();
                return await new Promise((res, rej) => {
                    const r = db.transaction('handles').objectStore('handles').get('backupDir');
                    r.onsuccess = () => res(r.result || null);
                    r.onerror = () => rej(r.error);
                });
            } catch (e) { return null; }
        }

        // --- utilidades ---
        function dataCount(d) {
            if (!d || typeof d !== 'object') return 0;
            const h = d.habitacao || {};
            const lists = [d.financeiro && d.financeiro.transactions, d.agenda, d.lembretes, d.hobbies, d.atalhos, d.metas,
                           h.contributions, h.budgets, h.suppliers, h.docFolders, d.saude && d.saude.meds];
            let n = lists.reduce((s, a) => s + (Array.isArray(a) ? a.length : 0), 0);
            n += Object.keys((d.saude && d.saude.waterLog) || {}).length;
            n += Object.keys((d.saude && d.saude.medLog) || {}).length;
            return n;
        }
        function looksLikeBackup(obj) {
            return obj && typeof obj === 'object' && !Array.isArray(obj) &&
                   (obj.profile || obj.financeiro || obj.habitacao || obj.saude || obj.agenda);
        }
        async function readFolderBackup() {
            if (!directoryHandle) return null;
            try {
                const fh = await directoryHandle.getFileHandle(BACKUP_FILE);
                const txt = await (await fh.getFile()).text();
                return JSON.parse(txt);
            } catch (e) { return null; }
        }
        async function hasFolderPermission(request = false) {
            if (!directoryHandle) return false;
            const opts = { mode: 'readwrite' };

            if (request && (await directoryHandle.requestPermission(opts)) === 'granted') return true;
            return false;

        function updateFolderLabel() {

            } else if (!directoryHandle) {
                el.innerText = driveAvailable() ? 'Drive desconectado' : 'Armazenamento Local Ativo';
                el.onclick = null; el.style.cursor = '';
            } else if (folderNeedsPermission) {
                el.innerText = `Pasta: ${directoryHandle.name} — clique para reconectar`;
                el.onclick = reconnectFolder; el.style.cursor = 'pointer';

        async function writeJsonFile(name, obj) {
            const fh = await directoryHandle.getFileHandle(name, { create: true });
            const w = await fh.createWritable();
            await w.write(JSON.stringify(obj, null, 2));
            await w.close();
        }
        async function saveToFolderHandle() {
            if (!directoryHandle || folderNeedsPermission) return;
            try {
                const existing = await readFolderBackup();
                // PROTEÇÃO: nunca troca um backup com dados por um estado vazio
                if (existing && dataCount(existing) > 0 && dataCount(appData) === 0) {
                    updateSyncStatus('Pasta tem dados: restaure antes', 'amber');
                    return;
                }
                // guarda uma cópia do backup anterior (uma vez por sessão)
                if (existing && !folderBackedUpOnce) {
                    await writeJsonFile(BACKUP_PREV, existing);
                    folderBackedUpOnce = true;
                }
                await writeJsonFile(BACKUP_FILE, appData);
                lastFolderSync = new Date();
                updateSyncStatus('Sincronizado na Pasta', 'emerald');
                refreshBackupTab();
            } catch (err) {
                console.error(err);
                if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
                    folderNeedsPermission = true;
                    updateFolderLabel();
                    updateSyncStatus('Reconectar pasta de backup', 'amber');
                } else {
                    updateSyncStatus('Erro ao gravar na pasta', 'rose');

        }

        function restoreFromObject(obj) {
            if (!looksLikeBackup(obj)) throw new Error('Arquivo de backup inválido');
            const clean = JSON.parse(JSON.stringify(obj));
            if (!clean.profile) clean.profile = { name: 'Samuel & Tayná', theme: 'light' };
            ['agenda', 'lembretes', 'hobbies', 'atalhos', 'metas'].forEach(k => { if (!Array.isArray(clean[k])) clean[k] = []; });

        function downloadCurrentData(prefix) {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${prefix}_${localDateStr()}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }
        function exportBackupDownload() {
            downloadCurrentData('meusistema_backup');
            showToast('Backup baixado!', 'success');
        }
        function showRestoreModal(obj, label, onKeep, keepText) {
            _pendingRestore = { obj, label, onKeep };
            const incoming = dataCount(obj), current = dataCount(appData);
            const warn = incoming === 0
                ? `<div class="p-3 rounded-xl bg-amber-50 text-amber-700 text-xs font-semibold mb-4">Atenção: este backup está vazio (0 registros). Restaurar vai apagar os dados atuais.</div>` : '';
            showModal('Restaurar backup', `
                <p class="text-sm text-slate-600 dark:text-slate-300 mb-3">Backup ${esc(label)}: <b>${incoming}</b> registros.<br>Dados atuais neste navegador: <b>${current}</b> registros.</p>
                ${warn}
                <p class="text-xs text-slate-500 mb-4">Antes de substituir, uma cópia dos dados atuais é baixada automaticamente.</p>
                <div class="space-y-2">
                    <button onclick="confirmPendingRestore()" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Carregar este backup</button>
                    <button onclick="cancelPendingRestore()" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 py-3 rounded-xl font-bold text-sm">${esc(keepText || 'Cancelar')}</button>
                </div>
            `);
        }
        function confirmPendingRestore() {
            if (!_pendingRestore) return;
            const { obj } = _pendingRestore;
            _pendingRestore = null;
            try {
                if (dataCount(appData) > 0) downloadCurrentData('meusistema_antes_de_restaurar');
                restoreFromObject(obj);
                closeModal();
                showToast('Backup restaurado com sucesso!', 'success');
            } catch (e) {
                console.error(e);
                showToast('Não foi possível restaurar: ' + e.message, 'error');
            }
        }
        function cancelPendingRestore() {
            const p = _pendingRestore;
            _pendingRestore = null;

        function importBackupFile(input) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const obj = JSON.parse(reader.result);
                    if (!looksLikeBackup(obj)) throw new Error('formato não reconhecido');
                    showRestoreModal(obj, `do arquivo "${f.name}"`, null, 'Cancelar');
                } catch (e) {
                    showToast('Arquivo inválido: ' + e.message, 'error');
                }
            };
            reader.readAsText(f);
        }
        async function loadFromFolderManual() {
            if (!directoryHandle) return;
            if (!(await hasFolderPermission(true))) { showToast('Permissão da pasta negada.', 'warning'); return; }
            folderNeedsPermission = false; updateFolderLabel();
            const existing = await readFolderBackup();

            showRestoreModal(existing, 'da pasta vinculada', null, 'Cancelar');
        }

        // --- vínculo / reconexão ---
        async function reconcileWithFolder() {
            const existing = await readFolderBackup();
            const localN = dataCount(appData), folderN = dataCount(existing);
            if (existing && folderN > 0 && localN === 0) {
                restoreFromObject(existing);
                showToast('Dados restaurados da pasta de backup!', 'success');
                return;
            }
            if (existing && folderN > localN) {
                showRestoreModal(existing, 'da pasta vinculada (tem mais dados que este navegador)',
                    () => saveToFolderHandle(), 'Manter os dados atuais');
                return;
            }
            await saveToFolderHandle();
        }
        async function selectFolderForBackup() {
            try {
                if (!window.showDirectoryPicker) {
                    showToast('Seu navegador não suporta a API de Pastas. Use o Chrome/Edge ou baixe o backup manualmente.', 'warning');
                    return;
                }
                const h = await window.showDirectoryPicker({ mode: 'readwrite' });
                directoryHandle = h;
                await persistHandle(h);
                folderNeedsPermission = false;
                folderBackedUpOnce = false;
                updateFolderLabel();
                showToast(`Pasta "${h.name}" vinculada!`, 'success');
                await reconcileWithFolder();
                refreshBackupTab();
            } catch (err) {
                if (err.name !== 'AbortError') { console.error(err); showToast('Erro ao vincular a pasta.', 'error'); }
            }
        }
        async function reconnectFolder() {
            if (!directoryHandle) return selectFolderForBackup();
            try {
                if (await hasFolderPermission(true)) {
                    folderNeedsPermission = false;
                    updateFolderLabel();
                    showToast('Pasta reconectada!', 'success');
                    await reconcileWithFolder();
                    refreshBackupTab();
                } else {
                    showToast('Permissão negada. A pasta continua desconectada.', 'warning');
                }
            } catch (e) {
                console.error(e);
                await selectFolderForBackup();
            }
        }
        async function initBackupFolder() {
            if (!window.showDirectoryPicker) return;
            const h = await recoverHandle();
            if (!h) return;
            directoryHandle = h;
            try {
                if (await hasFolderPermission(false)) {
                    folderNeedsPermission = false;
                    updateFolderLabel();
                    await reconcileWithFolder();
                } else {
                    folderNeedsPermission = true;
                    updateFolderLabel();
                    updateSyncStatus('Reconectar pasta de backup', 'amber');
                    showToast('Clique em "Salvar" para reconectar a pasta de backup.', 'warning');
                }
            } catch (e) { console.error(e); }
            refreshBackupTab();
        }

            appData.saude.waterLog[date] = mode === 'set' ? qty : getWater(date) + qty;

            renderCurrentTabContent();

        function renderAgendaCard(item, isFinalized) {
            return `

            let totalAportes = 0;
            let totalRetiradas = 0;
            appData.habitacao.contributions.forEach(c => {
                if (!balances[c.personId]) balances[c.personId] = 0;
                if (c.type === 'aporte') {
                    balances[c.personId] += Number(c.amount);
                    totalAportes += Number(c.amount);
                } else {
                    balances[c.personId] -= Number(c.amount);
                    totalRetiradas += Number(c.amount);

            const saldoCaixaObra = totalAportes - totalRetiradas;

            // Filtro e Ordenação de Movimentações

                contributionsList = contributionsList.filter(c => c.type === obraFilterStatus);

                if (obraSortOrder === 'date-desc') return new Date(b.date) - new Date(a.date);
                return new Date(a.date) - new Date(b.date);

        function saveFolder(e, id) {
            e.preventDefault();
            const name = document.getElementById('folder-name').value.trim();
            if (!name) return;
            if (id) {
                const f = appData.habitacao.docFolders.find(x => x.id === id);
                if (f) f.name = name;
            } else {
                appData.habitacao.docFolders.push({ id: uid(), name, files: [] });
            }
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast('Pasta salva!', 'success');
        }
        function createQuickFolder(name) {
            appData.habitacao.docFolders.push({ id: uid(), name, files: [] });
            saveAppData(); renderCurrentTabContent(); showToast(`Pasta "${name}" criada!`, 'success');
        }
        function deleteFolder(id) {
            const f = appData.habitacao.docFolders.find(x => x.id === id);
            if (!f) return;
            const msg = f.files.length
                ? `Excluir a pasta "${f.name}" e os ${f.files.length} arquivo(s) dentro dela? Essa ação não pode ser desfeita.`
                : `Excluir a pasta "${f.name}"?`;
            if (!confirm(msg)) return;
            f.files.forEach(file => deleteStoredFile(file.id));
            appData.habitacao.docFolders = appData.habitacao.docFolders.filter(x => x.id !== id);
            saveAppData(); renderCurrentTabContent(); showToast('Pasta excluída.', 'info');
        }
        async function uploadDocFiles(files) {
            const f = appData.habitacao.docFolders.find(x => x.id === habDocsFolderId);
            if (!f || !files || !files.length) return;
            const metas = await storeFiles(files);
            if (!metas.length) return;
            f.files = f.files.concat(metas);
            saveAppData(); renderCurrentTabContent();
            showToast(`${metas.length} arquivo(s) anexado(s)!`, 'success');
        }
        function deleteDocFile(folderId, fileId) {
            const f = appData.habitacao.docFolders.find(x => x.id === folderId);
            if (!f) return;
            const file = f.files.find(x => x.id === fileId);
            if (!file || !confirm(`Excluir "${file.name}"?`)) return;
            deleteStoredFile(fileId);
            f.files = f.files.filter(x => x.id !== fileId);
            saveAppData(); renderCurrentTabContent();

        function saveBudget(e, id) {
            e.preventDefault();
            const title = document.getElementById('budget-title').value;
            const supplier = document.getElementById('budget-supplier').value || 'Geral';
            const status = document.getElementById('budget-status').value;
            const amount = document.getElementById('budget-amount').value;
            const date = document.getElementById('budget-date').value;
            const fileInput = document.getElementById('budget-file');

            let existingBudget = null;
            if (id && appData.habitacao.budgets) {
                existingBudget = appData.habitacao.budgets.find(x => x.id === id);
            }

            let fileName = existingBudget ? existingBudget.fileName : '';
            let fileData = existingBudget ? existingBudget.fileData : '';

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                fileName = file.name;
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    fileData = uploadEvent.target.result;
                    finishSaveBudget(id, title, supplier, status, amount, date, fileName, fileData);
                };
                reader.readAsDataURL(file);
            } else {
                finishSaveBudget(id, title, supplier, status, amount, date, fileName, fileData);
            }
        }

        function finishSaveBudget(id, title, supplier, status, amount, date, fileName, fileData) {
            if (!appData.habitacao.budgets) appData.habitacao.budgets = [];
            if (id) {
                const b = appData.habitacao.budgets.find(x => x.id === id);
                if (b) {
                    b.title = title;
                    b.supplier = supplier;
                    b.status = status;
                    b.amount = amount;
                    b.date = date;
                    b.fileName = fileName;
                    b.fileData = fileData;
                }
            } else {
                appData.habitacao.budgets.push({
                    id: Date.now().toString(),
                    title,
                    supplier,
                    status,
                    amount,
                    date,
                    fileName,
                    fileData
                });
            }
            saveAppData();
            closeModal();
            renderCurrentTabContent();
            showToast("Orçamento salvo com sucesso!", "success");
        }

        function editBudget(id) {
            openBudgetModal(id);
        }

        function deleteBudget(id) {
            if (appData.habitacao.budgets) {
                appData.habitacao.budgets = appData.habitacao.budgets.filter(b => b.id !== id);
                saveAppData();
                renderCurrentTabContent();
                showToast("Orçamento removido.", "info");
            }
        }

        function downloadBudgetFile(id) {
            const b = appData.habitacao.budgets.find(x => x.id === id);
            if (!b || !b.fileData) return;
            const a = document.createElement('a');
            a.href = b.fileData;
            a.download = b.fileName || 'arquivo_orcamento';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("Baixando arquivo...", "success");
        }

        async function saveFinance(e, id) {
            e.preventDefault();
            const type = document.getElementById('fin-type').value;
            const status = document.getElementById('fin-status').value;
            const desc = document.getElementById('fin-desc').value;
            const amount = document.getElementById('fin-amount').value;
            const category = document.getElementById('fin-category').value;
            const date = document.getElementById('fin-date').value;
            const newAtts = await storeFiles(document.getElementById('fin-files').files);

            if (id) {
                const tr = appData.financeiro.transactions.find(x => x.id === id);
                if (tr) {
                    tr.type = type; tr.status = status; tr.desc = desc; tr.amount = amount; tr.category = category; tr.date = date;
                    const toRemove = Array.from(document.querySelectorAll('.fin-remove-att:checked')).map(c => c.value);
                    toRemove.forEach(rid => deleteStoredFile(rid));
                    tr.attachments = (tr.attachments || []).filter(a => !toRemove.includes(a.id)).concat(newAtts);
                }
            } else {
                const n = Math.max(1, Math.min(60, parseInt(document.getElementById('fin-installments').value) || 1));
                if (n === 1) {
                    appData.financeiro.transactions.push({ id: uid(), type, status, desc, amount, category, date, attachments: newAtts });
                } else {
                    const totalCents = Math.round(Number(amount) * 100);
                    const base = Math.floor(totalCents / n);
                    const group = uid();
                    for (let i = 0; i < n; i++) {
                        const cents = i === n - 1 ? totalCents - base * (n - 1) : base;
                        appData.financeiro.transactions.push({
                            id: uid(), type, desc, category,
                            amount: (cents / 100).toFixed(2),
                            date: addMonthsToDate(date, i),
                            status: i === 0 ? status : 'pendente',
                            installment: { group, n: i + 1, total: n },
                            attachments: i === 0 ? newAtts : []
                        });
                    }
                }
            }
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast("Salvo!", "success");
        }

        function removeFinance(id, wholeGroup) {

        // =====================================================
        // RELATÓRIOS (XLSX) — exportar / importar
        // =====================================================
        function normKey(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
        function parseDateAny(v) {
            if (v instanceof Date && !isNaN(v)) return localDateStr(new Date(v.getTime() + 12 * 3600 * 1000));
            if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`; }
            const s = String(v == null ? '' : v).trim();
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
            m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
            if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
            return '';
        }
        function parseAmount(v) {
            if (typeof v === 'number') return v;
            let s = String(v == null ? '' : v).replace(/R\$|\s/g, '');
            if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
            const n = Number(s);
            return isNaN(n) ? 0 : n;
        }
        function rowGet(row, ...aliases) {
            for (const k of Object.keys(row)) { if (aliases.includes(normKey(k))) return row[k]; }
            return '';
        }
        const REPORT_DEFS = {
            financas: { label: 'Finanças', sheet: 'Finanças', alias: ['financas', 'financeiro'],
                head: ['Tipo', 'Status', 'Descrição', 'Valor', 'Categoria', 'Data'],
                example: ['despesa', 'pago', 'Mercado', 150.5, 'Alimentação', '10/10/2026'],
                rows: () => appData.financeiro.transactions.map(t => [t.type === 'receita' ? 'receita' : 'despesa', t.status || 'pago', t.desc, Number(t.amount), t.category, fmtBR(t.date)]) },
            hobbies: { label: 'Hobbies', sheet: 'Hobbies', alias: ['hobbies', 'hobby'],
                head: ['Título', 'Categoria', 'Status', 'Observações'],
                example: ['Aprender violão', 'Música', 'Em Andamento', ''],
                rows: () => appData.hobbies.map(h => [h.title, h.category, h.status, h.obs || '']) },
            orcamentos: { label: 'Orçamentos', sheet: 'Orçamentos', alias: ['orcamentos', 'orcamento'],
                head: ['Título', 'Fornecedor', 'Valor', 'Data', 'Status'],
                example: ['Piso da sala', 'Casa do Piso', 4200, '15/10/2026', 'Pendente'],
                rows: () => appData.habitacao.budgets.map(b => [b.title, b.supplier, Number(b.amount), fmtBR(b.date), b.status]) },
            habitacao: { label: 'Movimentações Habitação', sheet: 'Habitação', alias: ['habitacao', 'movimentacoes', 'movimentacoes habitacao'],
                head: ['Pessoa', 'Tipo', 'Valor', 'Descrição', 'Data'],
                example: ['Samuel', 'aporte', 1000, 'Entrada do mês', '05/10/2026'],
                rows: () => appData.habitacao.contributions.map(c => {
                    const pe = appData.habitacao.people.find(x => x.id === c.personId);
                    return [pe ? pe.name : '', c.type === 'retirada' ? 'retirada' : 'aporte', Number(c.amount), c.desc || '', fmtBR(c.date)];
                }) }
        };
        function buildWorkbook(keys, template) {
            const wb = XLSX.utils.book_new();
            keys.forEach(k => {
                const d = REPORT_DEFS[k];
                const data = [d.head].concat(template ? [d.example] : d.rows());
                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = d.head.map(() => ({ wch: 20 }));
                XLSX.utils.book_append_sheet(wb, ws, d.sheet);
            });
            return wb;
        }
        function exportReports(keys, template) {
            if (typeof XLSX === 'undefined') { showToast('Biblioteca de planilhas não carregou (verifique a internet).', 'error'); return; }
            const list = keys || Object.keys(REPORT_DEFS);
            XLSX.writeFile(buildWorkbook(list, !!template), `${template ? 'Modelo' : 'Relatorio'}_MeuSistema_${localDateStr()}.xlsx`);
            showToast(template ? 'Modelo baixado!' : 'Relatório exportado!', 'success');
        }
        function importReport(kind, input) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f) return;
            if (typeof XLSX === 'undefined') { showToast('Biblioteca de planilhas não carregou (verifique a internet).', 'error'); return; }
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const wb = XLSX.read(new Uint8Array(reader.result), { type: 'array', cellDates: true });
                    const d = REPORT_DEFS[kind];
                    let name = wb.SheetNames.find(n => d.alias.includes(normKey(n)));
                    if (!name && wb.SheetNames.length === 1) name = wb.SheetNames[0];
                    if (!name) throw new Error(`não achei a aba "${d.sheet}" na planilha`);
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '', raw: true });
                    const res = applyImport(kind, rows);
                    if (res.added === 0 && res.skipped === 0) { showToast('Nenhuma linha válida encontrada.', 'warning'); return; }
                    saveAppData(); renderCurrentTabContent();
                    showToast(`${d.label}: ${res.added} importados${res.skipped ? `, ${res.skipped} ignorados (repetidos ou incompletos)` : ''}.`, res.added ? 'success' : 'warning');
                } catch (e) { console.error(e); showToast('Erro ao importar: ' + e.message, 'error'); }
            };
            reader.readAsArrayBuffer(f);
        }
        function applyImport(kind, rows) {
            let added = 0, skipped = 0;
            const today = localDateStr();
            rows.forEach(r => {
                if (kind === 'financas') {
                    const desc = String(rowGet(r, 'descricao', 'desc')).trim();
                    const amount = parseAmount(rowGet(r, 'valor'));
                    if (!desc || !(amount > 0)) { skipped++; return; }
                    const type = normKey(rowGet(r, 'tipo')).startsWith('rec') ? 'receita' : 'despesa';
                    const status = normKey(rowGet(r, 'status')).startsWith('pend') ? 'pendente' : 'pago';
                    const category = String(rowGet(r, 'categoria')).trim() || 'Geral';
                    const date = parseDateAny(rowGet(r, 'data')) || today;
                    if (appData.financeiro.transactions.some(t => t.desc === desc && Number(t.amount) === amount && t.date === date && t.type === type)) { skipped++; return; }
                    appData.financeiro.transactions.push({ id: uid(), type, status, desc, amount, category, date, attachments: [] }); added++;
                } else if (kind === 'hobbies') {
                    const title = String(rowGet(r, 'titulo', 'hobby', 'nome')).trim();
                    if (!title) { skipped++; return; }
                    const category = String(rowGet(r, 'categoria')).trim() || 'Geral';
                    const status = normKey(rowGet(r, 'status')).startsWith('fin') ? 'Finalizado' : 'Em Andamento';
                    const obs = String(rowGet(r, 'observacoes', 'obs')).trim();
                    if (appData.hobbies.some(h => h.title === title && h.category === category)) { skipped++; return; }
                    appData.hobbies.push({ id: uid(), title, category, status, obs }); added++;
                } else if (kind === 'orcamentos') {
                    const title = String(rowGet(r, 'titulo', 'descricao')).trim();
                    if (!title) { skipped++; return; }
                    const supplier = String(rowGet(r, 'fornecedor')).trim() || 'Geral';
                    const amount = parseAmount(rowGet(r, 'valor'));
                    const date = parseDateAny(rowGet(r, 'data')) || today;
                    const status = normKey(rowGet(r, 'status')).startsWith('aprov') ? 'Aprovado' : 'Pendente';
                    if (appData.habitacao.budgets.some(b => b.title === title && b.supplier === supplier && Number(b.amount) === amount && b.date === date)) { skipped++; return; }
                    appData.habitacao.budgets.push({ id: uid(), title, supplier, amount, date, status, fileName: '', fileData: '' }); added++;
                } else if (kind === 'habitacao') {
                    const amount = parseAmount(rowGet(r, 'valor'));
                    if (!(amount > 0)) { skipped++; return; }
                    const pname = normKey(rowGet(r, 'pessoa', 'nome'));
                    const person = appData.habitacao.people.find(x => normKey(x.name) === pname) || appData.habitacao.people[0];
                    const type = normKey(rowGet(r, 'tipo')).startsWith('ret') ? 'retirada' : 'aporte';
                    const desc = String(rowGet(r, 'descricao', 'desc')).trim();
                    const date = parseDateAny(rowGet(r, 'data')) || today;
                    if (!person) { skipped++; return; }
                    if (appData.habitacao.contributions.some(c => c.personId === person.id && c.type === type && Number(c.amount) === amount && c.date === date && (c.desc || '') === desc)) { skipped++; return; }
                    appData.habitacao.contributions.push({ id: uid(), personId: person.id, type, amount, desc, date }); added++;
                }
            });
            return { added, skipped };
        }

        function isisTips() {
            const tips = [];
            const R = v => 'R$ ' + money(v);
            const today = localDateStr(), month = today.slice(0, 7);
            const add = (icon, area, text, tone) => tips.push({ icon, area, text, tone: tone || 'info' });

            // Finanças
            const tx = appData.financeiro.transactions;
            const mtx = tx.filter(t => (t.date || '').startsWith(month));
            const rec = mtx.filter(t => t.type === 'receita').reduce((s, t) => s + Number(t.amount), 0);
            const des = mtx.filter(t => t.type !== 'receita').reduce((s, t) => s + Number(t.amount), 0);
            if (!tx.length) add('fa-wallet', 'Finanças', 'Ainda não há lançamentos. Registre receitas e despesas do mês para eu conseguir analisar para onde o dinheiro vai.');
            else if (!mtx.length) add('fa-wallet', 'Finanças', 'Nenhum lançamento neste mês até agora. Manter o registro em dia é a base de qualquer planejamento.');
            else {
                if (des > rec) add('fa-triangle-exclamation', 'Finanças', `Neste mês as despesas (${R(des)}) passam das receitas (${R(rec)}). Vale rever os maiores gastos e adiar o que não for essencial.`, 'warn');
                else if (rec > 0 && des / rec > 0.8) add('fa-triangle-exclamation', 'Finanças', `Os gastos já consomem ${Math.round(des / rec * 100)}% da receita do mês. Uma referência comum é 50% necessidades, 30% desejos e 20% reserva/objetivos.`, 'warn');
                else if (rec > 0) add('fa-circle-check', 'Finanças', `Sobraram ${R(rec - des)} neste mês. Que tal separar uma parte para a reserva de emergência ou para o fundo da casa?`, 'good');
                const cat = {};
                mtx.filter(t => t.type !== 'receita').forEach(t => { cat[t.category] = (cat[t.category] || 0) + Number(t.amount); });
                const top = Object.entries(cat).sort((a, b) => b[1] - a[1])[0];
                if (top) add('fa-chart-pie', 'Finanças', `Maior categoria de gasto no mês: ${esc(top[0])} (${R(top[1])}). É um bom ponto para buscar economia.`);
            }
            const pend = tx.filter(t => t.type !== 'receita' && t.status === 'pendente');
            if (pend.length) add('fa-hourglass-half', 'Finanças', `${pend.length} despesa(s) pendente(s) somando ${R(pend.reduce((s, t) => s + Number(t.amount), 0))}. Priorize as que têm vencimento mais próximo para evitar juros e multas.`, 'warn');

            // Habitação
            const h = appData.habitacao;
            const fundo = h.contributions.reduce((s, c) => s + (c.type === 'aporte' ? 1 : -1) * Number(c.amount), 0);
            const aprov = h.budgets.filter(b => b.status === 'Aprovado').reduce((s, b) => s + Number(b.amount), 0);
            const bPend = h.budgets.filter(b => b.status !== 'Aprovado');
            if (aprov > 0 && aprov > fundo) add('fa-house-circle-exclamation', 'Habitação', `Os orçamentos aprovados somam ${R(aprov)}, acima do saldo do fundo (${R(fundo)}). Faltam ${R(aprov - fundo)}: combine aportes extras ou renegocie prazos.`, 'warn');
            else if (aprov > 0) add('fa-house-circle-check', 'Habitação', `O fundo (${R(fundo)}) cobre os orçamentos aprovados (${R(aprov)}).`, 'good');
            if (bPend.length) add('fa-file-invoice-dollar', 'Habitação', `${bPend.length} orçamento(s) pendente(s). Compare pelo menos 3 fornecedores e confira o que está incluso (material, mão de obra, prazo) antes de aprovar.`);
            if (h.people.length >= 2) {
                const tot = h.people.map(pe => ({ n: pe.name, v: Number(pe.initialBalance || 0) + h.contributions.filter(c => c.personId === pe.id).reduce((s, c) => s + (c.type === 'aporte' ? 1 : -1) * Number(c.amount), 0) }));
                const s = tot.slice().sort((a, b) => b.v - a.v);
                if (s[0].v - s[s.length - 1].v > 0) add('fa-scale-balanced', 'Habitação', `Aportes líquidos: ${tot.map(t => `${esc(t.n)} ${R(t.v)}`).join(' · ')}. Acompanhar a diferença ajuda a manter a divisão combinada em dia.`);
            }

            // Saúde
            const goal = Number(appData.saude.waterGoal || 3000), w = getWater(today);
            if (w < goal) add('fa-droplet', 'Saúde', `Água hoje: ${w} ml de ${goal} ml. Faltam ${goal - w} ml, que tal um copo agora?`, w < goal / 2 ? 'warn' : 'info');
            else add('fa-droplet', 'Saúde', 'Meta de água de hoje batida. Parabéns!', 'good');
            const taken = (appData.saude.medLog[today] || []);
            const missing = appData.saude.meds.filter(m => !taken.includes(m.id));
            if (appData.saude.meds.length && missing.length) add('fa-pills', 'Saúde', `Remédio(s) ainda não marcado(s) hoje: ${missing.map(m => esc(m.name) + ' (' + esc(m.time) + ')').join(', ')}.`, 'warn');

            // Agenda / lembretes / hobbies
            const late = appData.lembretes.filter(l => !l.completed && l.date && l.date < today);
            if (late.length) add('fa-bell', 'Lembretes', `${late.length} lembrete(s) atrasado(s). Resolva ou reagende para não acumular.`, 'warn');
            const ag = appData.agenda.filter(a => a.date === today && a.status !== 'Finalizado');
            if (ag.length) add('fa-calendar-day', 'Agenda', `Você tem ${ag.length} compromisso(s) hoje.`);
            const hb = appData.hobbies.filter(x => x.status !== 'Finalizado');
            if (hb.length) add('fa-heart', 'Hobbies', `${hb.length} hobby(s) em andamento. Reservar um horário fixo na semana ajuda a tirá-los do papel.`);
            return tips;
        }
        function openIsis() {
            const tones = { warn: 'bg-amber-50 text-amber-800 border-amber-200', good: 'bg-emerald-50 text-emerald-800 border-emerald-200', info: 'bg-slate-50 text-slate-700 border-slate-200' };
            const html = isisTips().map(t => `
                <div class="flex items-start space-x-3 p-3 rounded-xl border ${tones[t.tone]}">
                    <i class="fa-solid ${t.icon} mt-0.5"></i>
                    <div><p class="text-[10px] font-bold uppercase opacity-70">${t.area}</p><p class="text-sm">${t.text}</p></div>
                </div>`).join('');
            showModal('ISIS · dicas e sugestões', `
                <div class="space-y-2">${html}</div>
                <p class="text-[10px] text-slate-400 mt-4">Sugestões automáticas baseadas nos seus registros. São orientações gerais e não substituem profissionais de finanças, engenharia ou saúde.</p>`);
        }

        // =====================================================
        // GOOGLE DRIVE — login + sincronização automática
        // =====================================================
        const GOOGLE_CLIENT_ID = '737517508578-oh51pl1lmnav4c14cjqt3ptfikltjnm7.apps.googleusercontent.com';
        const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
        const DRIVE_FOLDER = 'MeuSistema';
        const DRIVE_DATA = 'meusistema_dados.json';
        const DRIVE_LINK_KEY = 'meusistema_drive_linked';
        const DRIVE_SYNC_KEY = 'meusistema_drive_sync';
        let driveClient = null, driveToken = null, driveTokenExp = 0;
        let driveFolderId = null, driveFileId = null, driveReconciled = false, driveHadData = false;
        let driveSaveTimer = null, driveLastSync = null, driveErr = '';
        let _tokRes = null, _tokRej = null;

        function driveAvailable() { return location.protocol.indexOf('http') === 0; }
        function showLoginGate(show, msg) {
            const g = document.getElementById('login-gate');
            if (!g) return;
            g.classList.toggle('hidden', !show); g.classList.toggle('flex', !!show);
            const m = document.getElementById('login-gate-msg'); if (m) m.innerText = msg || '';
        }
        function loadGis() {
            return new Promise(res => {
                let n = 0;
                const t = setInterval(() => {
                    if (window.google && google.accounts && google.accounts.oauth2) { clearInterval(t); res(true); }
                    else if (++n > 50) { clearInterval(t); res(false); }
                }, 200);
            });
        }
        function driveRequestToken(prompt) {
            return new Promise((resolve, reject) => {
                const to = setTimeout(() => reject(new Error('tempo esgotado')), 20000);
                _tokRes = v => { clearTimeout(to); resolve(v); };
                _tokRej = e => { clearTimeout(to); reject(e); };
                driveClient.requestAccessToken({ prompt });
            });
        }
        async function driveFetch(url, opts = {}, retry = true) {
            if (!driveToken || Date.now() > driveTokenExp) await driveRequestToken('none');
            const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({}, opts.headers || {}, { Authorization: 'Bearer ' + driveToken }) }));
            if (r.status === 401 && retry) { driveToken = null; return driveFetch(url, opts, false); }
            if (!r.ok) throw new Error('Drive ' + r.status);
            return r;
        }
        const DRIVE_API = 'https://www.googleapis.com/drive/v3/files';
        const DRIVE_UP = 'https://www.googleapis.com/upload/drive/v3/files';
        async function driveList(q, fields) {
            const r = await driveFetch(`${DRIVE_API}?q=${encodeURIComponent(q)}&fields=${encodeURIComponent('files(' + fields + ')')}&pageSize=1000`);
            return (await r.json()).files || [];
        }
        async function driveEnsureFolder() {
            if (driveFolderId) return;
            const f = await driveList(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`, 'id');
            if (f.length) { driveFolderId = f[0].id; return; }
            const r = await driveFetch(DRIVE_API + '?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: DRIVE_FOLDER, mimeType: 'application/vnd.google-apps.folder' }) });
            driveFolderId = (await r.json()).id;
        }
        async function driveCreateFile(name, blob, type) {
            const b = 'ms' + uid();
            const meta = JSON.stringify({ name, parents: [driveFolderId] });
            const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: ${type}\r\n\r\n`, blob, `\r\n--${b}--`]);
            const r = await driveFetch(`${DRIVE_UP}?uploadType=multipart&fields=id`, { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body });
            return (await r.json()).id;
        }
        function dataBlob() { return new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' }); }
        async function driveUpload() {
            if (!driveReconciled || !driveToken && !driveClient) return;
            if (dataCount(appData) === 0 && driveHadData) { updateSyncStatus('Drive tem dados: não sobrescrevi', 'amber'); return; }
            try {
                if (driveFileId) {
                    await driveFetch(`${DRIVE_UP}/${driveFileId}?uploadType=media&fields=id`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: dataBlob() });
                } else {
                    await driveEnsureFolder();
                    driveFileId = await driveCreateFile(DRIVE_DATA, dataBlob(), 'application/json');
                }
                driveHadData = dataCount(appData) > 0;
                localStorage.setItem(DRIVE_SYNC_KEY, appData._savedAt || '');
                driveLastSync = new Date(); driveErr = '';
                updateSyncStatus('Sincronizado no Drive', 'emerald');
                updateFolderLabel(); refreshBackupTab();
            } catch (e) {
                console.error(e); driveErr = e.message;
                updateSyncStatus('Drive: falha ao salvar', 'rose');
            }
        }
        function scheduleDriveSave() {
            if (!driveReconciled) return;
            clearTimeout(driveSaveTimer);
            driveSaveTimer = setTimeout(driveUpload, 1500);
        }
        async function driveReconcile() {
            await driveEnsureFolder();
            const f = await driveList(`name='${DRIVE_DATA}' and '${driveFolderId}' in parents and trashed=false`, 'id,modifiedTime');
            if (!f.length) { driveFileId = null; driveReconciled = true; await driveUpload(); await driveSyncAttachments(); return; }
            driveFileId = f[0].id;
            const cloud = await (await driveFetch(`${DRIVE_API}/${driveFileId}?alt=media`)).json();
            const cN = dataCount(cloud), lN = dataCount(appData);
            const cT = cloud._savedAt || '', lT = appData._savedAt || '';
            driveHadData = cN > 0;
            const localUnchanged = localStorage.getItem(DRIVE_SYNC_KEY) === lT;
            if (cN > 0 && (lN === 0 || (cT > lT && localUnchanged))) {
                restoreFromObject(cloud);
                driveReconciled = true;
                showToast('Dados carregados do Drive!', 'success');
            } else if (cN > 0 && cT > lT) {
                driveReconciled = false;
                showRestoreModal(cloud, 'do Drive (mais recente que este navegador)', () => { driveReconciled = true; driveUpload(); }, 'Manter os dados deste navegador');
                return;
            } else {
                driveReconciled = true;
                if (cT !== lT) await driveUpload(); else { localStorage.setItem(DRIVE_SYNC_KEY, lT); updateSyncStatus('Sincronizado no Drive', 'emerald'); }
            }
            driveLastSync = new Date();
            await driveSyncAttachments();
            updateFolderLabel(); refreshBackupTab();
        }

        // --- anexos (arquivos) no Drive ---
        function attachmentIds() {
            const ids = [];
            appData.financeiro.transactions.forEach(t => (t.attachments || []).forEach(a => ids.push(a.id)));
            appData.habitacao.docFolders.forEach(fo => (fo.files || []).forEach(a => ids.push(a.id)));
            return ids;
        }
        async function driveUploadAttachment(id, blob) {
            if (!driveToken || !driveFolderId) return;
            await driveCreateFile('anexo_' + id, blob, blob.type || 'application/octet-stream');
        }
        async function driveSyncAttachments() {
            try {
                const remote = new Set((await driveList(`name contains 'anexo_' and '${driveFolderId}' in parents and trashed=false`, 'name')).map(x => x.name));
                for (const id of attachmentIds()) {
                    if (remote.has('anexo_' + id)) continue;
                    const blob = await getFile(id);
                    if (blob) await driveUploadAttachment(id, blob);
                }
            } catch (e) { console.error('Anexos:', e); }
        }
        async function driveFetchAttachment(id) {
            if (!driveToken || !driveFolderId) return null;
            try {
                const f = await driveList(`name='anexo_${id}' and '${driveFolderId}' in parents and trashed=false`, 'id');
                if (!f.length) return null;
                const blob = await (await driveFetch(`${DRIVE_API}/${f[0].id}?alt=media`)).blob();
                await putFile(id, blob);
                return blob;
            } catch (e) { console.error(e); return null; }
        }

        // --- login / logout ---
        async function driveSignIn() {
            if (!driveAvailable()) { showLoginGate(true, 'Abra o sistema pelo endereço hospedado (https://...) para entrar com o Google.'); return; }
            try {
                if (!driveClient) throw new Error('Google não carregou. Verifique a internet.');
                await driveRequestToken('');
                localStorage.setItem(DRIVE_LINK_KEY, '1');
                showLoginGate(false);
                updateSyncStatus('Conectando ao Drive...', 'amber');
                await driveReconcile();
            } catch (e) {
                console.error(e);
                showLoginGate(true, 'Não foi possível entrar: ' + e.message);
                updateSyncStatus('Drive desconectado', 'amber');
            }
        }
        function driveSignOut() {
            if (driveToken && window.google) google.accounts.oauth2.revoke(driveToken, () => {});
            driveToken = null; driveFolderId = null; driveFileId = null; driveReconciled = false;
            localStorage.removeItem(DRIVE_LINK_KEY);
            updateSyncStatus('Drive desconectado', 'amber');
            updateFolderLabel(); refreshBackupTab();
        }
        async function driveSyncManual() {
            if (!driveToken) { await driveSignIn(); return; }
            try { await driveReconcile(); showToast('Drive sincronizado!', 'success'); }
            catch (e) { console.error(e); showToast('Falha ao sincronizar: ' + e.message, 'error'); }
        }
        async function initDrive() {
            if (!driveAvailable()) return;
            if (!(await loadGis())) { showLoginGate(true, 'Google não carregou. Verifique a internet.'); return; }
            driveClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE,
                callback: r => {
                    if (r.error) { _tokRej && _tokRej(new Error(r.error)); return; }
                    driveToken = r.access_token; driveTokenExp = Date.now() + (Number(r.expires_in) - 60) * 1000;
                    _tokRes && _tokRes(driveToken);
                },
                error_callback: e => { _tokRej && _tokRej(new Error(e.type || 'erro de login')); }
            });
            if (localStorage.getItem(DRIVE_LINK_KEY) === '1') {
                try { await driveRequestToken('none'); await driveReconcile(); return; }
                catch (e) { console.warn('Login automático falhou:', e); }
            }
            showLoginGate(true);
        }
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && driveToken && driveReconciled && Date.now() < driveTokenExp) driveReconcile().catch(console.error);
        });
        function driveCardHtml() {
            const btn = 'w-full sm:w-auto px-6 py-3 rounded-2xl text-sm font-bold shadow flex items-center justify-center space-x-2';
            let st, actions;
            if (!driveAvailable()) { st = '<span class="text-amber-600">Disponível só quando o sistema é aberto por um endereço web (https://...), não pelo arquivo no computador.</span>'; actions = ''; }
            else if (driveToken) {
                st = `<span class="text-emerald-600">Conectado ao Drive (pasta "${DRIVE_FOLDER}")${driveLastSync ? ' · última sincronização ' + driveLastSync.toLocaleTimeString('pt-BR') : ''}.${driveErr ? ' <b class="text-rose-500">Erro: ' + esc(driveErr) + '</b>' : ''}</span>`;
                actions = `<button onclick="driveSyncManual()" class="${btn} bg-teal-600 hover:bg-teal-700 text-white"><i class="fa-solid fa-rotate"></i><span>Sincronizar agora</span></button>
                           <button onclick="driveSignOut()" class="${btn} bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200"><i class="fa-solid fa-right-from-bracket"></i><span>Sair do Drive</span></button>`;
            } else { st = '<span class="text-slate-500">Não conectado.</span>'; actions = `<button onclick="driveSignIn()" class="${btn} bg-teal-600 hover:bg-teal-700 text-white"><i class="fa-brands fa-google"></i><span>Entrar com Google</span></button>`; }
            return `<div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
                <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-2 flex items-center space-x-2"><i class="fa-brands fa-google-drive text-teal-500"></i><span>Google Drive</span></h3>
                <p class="text-sm text-slate-500 mb-2">Salva automaticamente dados e anexos no seu Drive, na pasta <b>${DRIVE_FOLDER}</b>, e carrega em qualquer computador ao entrar com a mesma conta.</p>
                <p class="text-sm mb-5">${st}</p>
                <div class="flex flex-col sm:flex-row gap-3">${actions}</div></div>`;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = "bg-emerald-600 text-white";
            if (type === 'error') bgClass = "bg-rose-600 text-white";
            if (type === 'warning') bgClass = "bg-amber-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl text-xs font-bold flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.onload = async function() {
            loadAppData();
            if (appData.profile.theme === 'dark') document.documentElement.classList.add('dark');
            switchTab('dashboard');
            await initBackupFolder();
            initDrive();
        };
    </script>
</body>
</html>
