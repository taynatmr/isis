        // =====================================================
        // ISIS — dicas e sugestões (regras locais, sem internet)
        // =====================================================
        function isisTips() {
            const tips = [];
            const R = v => 'R$ ' + money(v);
            const today = localDateStr(), month = today.slice(0, 7);
            const add = (icon, area, text, tone) => tips.push({ icon, area, text, tone: tone || 'info' });

            // Finanças
            const tx = appData.financeiro.transactions;
            const mtx = tx.filter(t => (t.date || '').startsWith(month));
            const rec = mtx.filter(t => t.type === 'receita').reduce((s, t) => s + Number(t.amount), 0);
            const des = mtx.filter(t => t.type === 'despesa').reduce((s, t) => s + Number(t.amount), 0);
            if (!tx.length) add('fa-wallet', 'Finanças', 'Ainda não há lançamentos. Registre receitas e despesas do mês para eu conseguir analisar para onde o dinheiro vai.');
            else if (!mtx.length) add('fa-wallet', 'Finanças', 'Nenhum lançamento neste mês até agora. Manter o registro em dia é a base de qualquer planejamento.');
            else {
                if (des > rec) add('fa-triangle-exclamation', 'Finanças', `Neste mês as despesas (${R(des)}) passam das receitas (${R(rec)}). Vale rever os maiores gastos e adiar o que não for essencial.`, 'warn');
                else if (rec > 0 && des / rec > 0.8) add('fa-triangle-exclamation', 'Finanças', `Os gastos já consomem ${Math.round(des / rec * 100)}% da receita do mês. Uma referência comum é 50% necessidades, 30% desejos e 20% reserva/objetivos.`, 'warn');
                else if (rec > 0) add('fa-circle-check', 'Finanças', `Sobraram ${R(rec - des)} neste mês. Que tal separar uma parte para a reserva de emergência ou para o fundo da casa?`, 'good');
                const cat = {};
                mtx.filter(t => t.type === 'despesa').forEach(t => { cat[t.category] = (cat[t.category] || 0) + Number(t.amount); });
                const top = Object.entries(cat).sort((a, b) => b[1] - a[1])[0];
                if (top) add('fa-chart-pie', 'Finanças', `Maior categoria de gasto no mês: ${esc(top[0])} (${R(top[1])}). É um bom ponto para buscar economia.`);
            }
            const pend = tx.filter(t => t.type === 'despesa' && t.status === 'pendente');
            if (pend.length) add('fa-hourglass-half', 'Finanças', `${pend.length} despesa(s) pendente(s) somando ${R(pend.reduce((s, t) => s + Number(t.amount), 0))}. Priorize as que têm vencimento mais próximo para evitar juros e multas.`, 'warn');

            // Habitação
            const h = appData.habitacao;
            const fundo = h.contributions.reduce((s, c) => s + (c.type === 'aporte' ? 1 : c.type === 'pendente' ? 0 : -1) * Number(c.amount), 0);
            const aprov = h.budgets.filter(b => b.status === 'Aprovado').reduce((s, b) => s + Number(b.amount), 0);
            const bPend = h.budgets.filter(b => b.status !== 'Aprovado');
            if (aprov > 0 && aprov > fundo) add('fa-house-circle-exclamation', 'Habitação', `Os orçamentos aprovados somam ${R(aprov)}, acima do saldo do fundo (${R(fundo)}). Faltam ${R(aprov - fundo)}: combine aportes extras ou renegocie prazos.`, 'warn');
            else if (aprov > 0) add('fa-house-circle-check', 'Habitação', `O fundo (${R(fundo)}) cobre os orçamentos aprovados (${R(aprov)}).`, 'good');
            if (bPend.length) add('fa-file-invoice-dollar', 'Habitação', `${bPend.length} orçamento(s) pendente(s). Compare pelo menos 3 fornecedores e confira o que está incluso (material, mão de obra, prazo) antes de aprovar.`);
            if (h.people.length >= 2) {
                const tot = h.people.map(pe => ({ n: pe.name, v: Number(pe.initialBalance || 0) + h.contributions.filter(c => c.personId === pe.id).reduce((s, c) => s + (c.type === 'aporte' ? 1 : c.type === 'pendente' ? 0 : -1) * Number(c.amount), 0) }));
                const s = tot.slice().sort((a, b) => b.v - a.v);
                if (s[0].v - s[s.length - 1].v > 0) add('fa-scale-balanced', 'Habitação', `Aportes líquidos: ${tot.map(t => `${esc(t.n)} ${R(t.v)}`).join(' · ')}. Acompanhar a diferença ajuda a manter a divisão combinada em dia.`);
            }

            // Saúde
            try {
                const A = avisosCalc(), RD = Math.max(0, Number(plano().remindDays) || 0);
                const its = [].concat(A.faturasAtr, A.contasAtr, A.contasHoje, A.faturasProx.filter(i => i.dias <= RD), A.contasProx).sort((x, y) => x.dias - y.dias);
                const lb = i => i.dias < 0 ? `venceu há ${-i.dias}d` : i.dias === 0 ? 'vence hoje' : `em ${i.dias}d`;
                if (its.length) add('fa-file-invoice-dollar', 'Contas', `Contas vencidas / a vencer (${RD} dia${RD === 1 ? '' : 's'}): ` + its.slice(0, 6).map(i => `${esc(i.nome)} (${lb(i)}, ${R(i.valor || 0)})`).join('; ') + (its.length > 6 ? ` e mais ${its.length - 6}` : '') + '.', its.some(i => i.dias < 0) ? 'warn' : 'info');
                else add('fa-file-invoice-dollar', 'Contas', `Nenhuma conta vencida nem a vencer em ${RD} dia(s).`, 'good');
            } catch (e) {}
            const taken = (appData.saude.medLog[today] || []);
            const missing = appData.saude.meds.filter(m => !taken.includes(m.id) && medActiveToday(m) && !((Number(m.cadN) > 1 && m.cadUn !== 'horas') || (m.cadUn === 'horas' && Number(m.cadN) > 24)));
            if (missing.length) add('fa-pills', 'Saúde', `Remédio(s) ainda não marcado(s) hoje: ${missing.map(m => esc(m.name) + (medInfo(m, today).dose ? ' ' + esc(medInfo(m, today).dose) : '') + ' (' + esc(m.time) + ')').join(', ')}.`, 'warn');

            // Agenda / lembretes / hobbies
            const late = appData.lembretes.filter(l => !l.completed && l.date && l.date < today);
            if (late.length) add('fa-bell', 'Lembretes', `${late.length} lembrete(s) atrasado(s). Resolva ou reagende para não acumular.`, 'warn');
            const ag = appData.agenda.filter(a => a.status !== 'Finalizado' && agOcc(a, today));
            if (ag.length) add('fa-calendar-day', 'Agenda', `Você tem ${ag.length} compromisso(s) hoje.`);
            const hb = appData.hobbies.filter(x => x.status !== 'Finalizado');
            if (hb.length) add('fa-heart', 'Hobbies', `${hb.length} hobby(s) em andamento. Reservar um horário fixo na semana ajuda a tirá-los do papel.`);
            return tips;
        }

        function kvDB() { return new Promise((res, rej) => { const r = indexedDB.open('isis_kv', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

        // ---- mescla de 3 vias: base (última sincronizada) × local × nuvem ----
        // Itens com "id" são mesclados um a um; quem apagou ou editou em um aparelho vale; se os dois editaram o mesmo campo, vale o local.
        function _eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
        function _isObj(x) { return x && typeof x === 'object' && !Array.isArray(x); }
        function _idArr(a) { return Array.isArray(a) && a.every(x => _isObj(x) && x.id !== undefined); }
        function merge3(B, L, R) {
            if (_eq(L, R)) return L;
            if (_eq(L, B)) return R;
            if (_eq(R, B)) return L;
            if (_isObj(L) && _isObj(R)) {
                const b = _isObj(B) ? B : {}, out = {};
                new Set([...Object.keys(R), ...Object.keys(L)]).forEach(k => {
                    if (k === '_savedAt') return;
                    const inL = k in L, inR = k in R;
                    if (inL && inR) out[k] = merge3(b[k], L[k], R[k]);
                    else if (inL) { if (!(k in b) || !_eq(L[k], b[k])) out[k] = L[k]; }      // só no local: novo (ou editado)
                    else { if (!(k in b) || !_eq(R[k], b[k])) out[k] = R[k]; }                // só na nuvem: novo (ou editado)
                });
                return out;
            }
            if (_idArr(L) && _idArr(R)) {
                const b = _idArr(B) ? B : [], bm = new Map(b.map(x => [x.id, x]));
                const lm = new Map(L.map(x => [x.id, x])), rm = new Map(R.map(x => [x.id, x]));
                const out = [];
                R.forEach(r => {
                    const l = lm.get(r.id), bb = bm.get(r.id);
                    if (l) out.push(merge3(bb, l, r));
                    else if (!bb || !_eq(r, bb)) out.push(r);          // apagado no local, mas a nuvem editou: mantém
                });
                L.forEach(l => { if (!rm.has(l.id)) { const bb = bm.get(l.id); if (!bb || !_eq(l, bb)) out.push(l); } });
                return out;
            }
            return L;
        }

        function cloudMsg(e) {

            if (/already registered|already been registered/i.test(m)) return 'Este e-mail já tem conta. Use "Entrar" (ou "Esqueci a senha").';
            if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
            if (/at least \d+ characters|weak/i.test(m)) return 'A senha é fraca. Use pelo menos 8 caracteres.';
            if (/rate limit|too many|security purposes/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
            if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Sem conexão com a internet.';
            if (/invalid.*email|Unable to validate email/i.test(m)) return 'E-mail inválido.';
            if (/same password|different from the old/i.test(m)) return 'A nova senha precisa ser diferente da anterior.';
            if (/Could not find the function|schema cache|relation .* does not exist|PGRST20[2-5]|42P01|42883/i.test(m + ' ' + ((e && e.code) || ''))) return 'O banco ainda não tem as tabelas deste app. Rode o arquivo supabase_setup_isis.sql no SQL Editor do Supabase (projeto correto).';
            if (/JWT|not authenticated/i.test(m)) return 'Sessão expirada. Saia e entre de novo.';
            if (/EntityTooLarge|exceeded the maximum/i.test(m)) return 'Um anexo é maior que o limite de tamanho do Storage.';
            const extra = e && typeof e === 'object' ? [e.code, e.details, e.hint].filter(Boolean).join(' · ') : '';

        async function startSession(session, force, offlineUser) {

                                        <button onclick="deleteFinance('${t.id}')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-lg text-xs hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>

                            }).join('')}

            const pendRows = list.filter(t => finSt(t) === 'pendente'), resRows = list.filter(t => finSt(t) !== 'pendente');
            const secHead = (ic, cor, title, n, extra) => `<h3 class="font-bold text-base ${cor} mb-3 flex items-center gap-2"><i class="fa-solid ${ic}"></i><span>${title}</span><span class="text-xs font-normal text-slate-400">(${n})${extra || ''}</span></h3>`;
            const finBody = list.length === 0 ? `<div class="text-center py-12 text-slate-400"><i class="fa-solid fa-receipt text-4xl mb-2"></i><p class="text-sm">Nenhuma transação encontrada para este filtro.</p></div>`
                : `<div id="fin-sel-bar">${finSelBar()}</div>` + (pendRows.length === 0 ? finTbl(list, 'all') : `
                    <div class="mb-8 p-3 sm:p-4 rounded-2xl bg-amber-50/60 dark:bg-amber-950/20 border border-amber-100 dark:border-amber-900/40">
                        ${secHead('fa-clock', 'text-amber-700 dark:text-amber-400', 'PENDENTES', pendRows.length, ' · R$ ' + money(pendRows.reduce((s, t) => { const e = finEffect(t, finF.acc); return s + Math.abs(e.r - e.d); }, 0)))}
                        ${finTbl(pendRows, 'pend')}
                    </div>
                    <div>
                        ${secHead('fa-circle-check', 'text-emerald-700 dark:text-emerald-400', 'RESOLVIDOS', resRows.length)}
                        ${resRows.length ? finTbl(resRows, 'res') : '<p class="text-sm text-slate-400 text-center py-6">Nada resolvido neste período ainda.</p>'}
                    </div>`);
            container.innerHTML = `
                <div class="space-y-6 max-w-7xl mx-auto">
                    <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            ${perBarHtml('fin')}
                            <div class="flex flex-wrap items-center gap-2">
                                <button onclick="openFinCols()" title="Reordenar / esconder colunas" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700"><i class="fa-solid fa-table-columns mr-1"></i>Colunas</button>
                                <button onclick="finToggleFilter()" class="px-3 py-2 rounded-xl text-xs font-bold ${finFilterOpen || nAct ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}"><i class="fa-solid fa-filter mr-1"></i>Filtro${nAct ? ' (' + nAct + ')' : ''}<i class="fa-solid fa-chevron-${finFilterOpen ? 'up' : 'down'} ml-1.5 text-[9px]"></i></button>
                                <button onclick="finSet('hab', !finF.hab)" title="${finF.hab ? 'Mostrando só movimentações Habitacional (toque para ver tudo)' : 'Ver só movimentações Habitacional'}" class="w-9 h-9 rounded-xl flex items-center justify-center ${finF.hab ? 'bg-amber-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-700 text-amber-600'}"><i class="fa-solid fa-hammer"></i></button>
                                
                                <button onclick="openFinanceModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow flex items-center space-x-2"><i class="fa-solid fa-plus"></i><span>Inserir Transação</span></button>
                                <button onclick="openExtratoImport()" class="bg-slate-100 dark:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5"><i class="fa-solid fa-file-import"></i><span>Extrato</span></button>
                            </div>
                        </div>
                        ${finFilterOpen ? `<div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700 flex flex-wrap items-center gap-2">
                            <select onchange="finSet('acc',this.value)" class="${S}"><option value="">Todos os bancos/cartões</option>${contasData().map(a => o(a.id, accLabel(a), finF.acc)).join('')}</select>
                            <select onchange="finSet('cat',this.value)" class="${S}"><option value="">Todas as categorias</option>${cats.map(c => o(c, c, finF.cat)).join('')}</select>
                            <select onchange="finSet('owner',this.value)" class="${S}"><option value="">De quem: todos</option>${[['casa', 'Casa (conjunta)'], ['p1', plano().people[0].name], ['p2', plano().people[1].name]].map(([k, l]) => o(k, l, finF.owner || '')).join('')}</select>
                            <select onchange="finSet('type',this.value)" class="${S}">${o('', 'Receitas e despesas', finF.type)}${o('receita', 'Só receitas', finF.type)}${o('despesa', 'Só despesas', finF.type)}${o('transferencia', 'Só transferências', finF.type)}</select>
                            <select onchange="changeFinanceStatusFilter(this.value)" class="${S}">${o('todos', 'Todos os status', financeFilterStatus)}${o('pago', 'Pagos', financeFilterStatus)}${o('recebido', 'Recebidos', financeFilterStatus)}${o('pendente', 'Pendentes', financeFilterStatus)}</select>
                            <input type="number" step="0.01" min="0" placeholder="Valor mín." value="${finF.min}" onchange="finSet('min',this.value)" class="${S} w-28">
                            <input type="number" step="0.01" min="0" placeholder="Valor máx." value="${finF.max}" onchange="finSet('max',this.value)" class="${S} w-28">
                            <input type="text" placeholder="Buscar descrição..." value="${esc(finF.q)}" onchange="finSet('q',this.value)" class="${S} w-44">
                            <button onclick="openCatMerge()" class="text-xs text-slate-500 font-semibold underline"><i class="fa-solid fa-code-merge mr-1"></i>Unificar categorias</button>
                            <button onclick="finClear()" class="text-xs text-teal-600 dark:text-teal-400 font-semibold underline">Limpar filtros</button>
                        </div>` : ''}
                    </div>
                    <div class="grid grid-cols-2 lg:grid-cols-5 gap-2 sm:gap-4">
                        ${card('Receitas', tr, 'text-emerald-600')}${card('Despesas', td, 'text-rose-600')}${card('Saldo do Período', saldo, saldo >= 0 ? 'text-teal-600' : 'text-rose-600')}${card('Pendente', tp, 'text-amber-600')}<div class="col-span-2 lg:col-span-1 bg-white dark:bg-slate-800 p-3 sm:p-5 rounded-xl sm:rounded-2xl shadow-sm border-2 ${saldoTotal >= 0 ? 'border-teal-200 dark:border-teal-900' : 'border-rose-200 dark:border-rose-900'} min-w-0" title="Saldo do período + sobra ou falta dos períodos anteriores (respeita os filtros)"><p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase truncate">Saldo Total</p><h3 class="text-base sm:text-2xl font-bold ${saldoTotal >= 0 ? 'text-teal-600' : 'text-rose-600'} mt-0.5 sm:mt-1 truncate">${saldoTotal < 0 ? '− ' : ''}R$ ${money(Math.abs(saldoTotal))}</h3>${pfx ? `<p class="text-[10px] text-slate-400 mt-0.5 truncate">${antes >= 0 ? 'sobra' : 'falta'} anterior: R$ ${money(Math.abs(antes))}</p>` : ''}</div>
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
                        <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-4 flex items-center space-x-2"><i class="fa-solid fa-wallet text-teal-500"></i><span>Lançamentos Financeiros</span><span class="text-xs font-normal text-slate-400">(${list.length}) · ${perLabel('fin')}</span></h3>
                        ${finBody}
                    </div>
                </div>`;
        }
        // ---------- Soma dos lançamentos selecionados ----------
        function finSelBar() {
            let n = 0, r = 0, d = 0;
            finFiltered().forEach(t => { if (!finSel.has(t.id)) return; n++; const v = Number(t.amount) || 0;
                // soma pelo TIPO (receita soma, despesa subtrai), qualquer conta ou categoria; só transferências dependem da conta
                if (t.type === 'receita') r += v; else if (t.type === 'despesa') d += v; else { const e = finEffect(t, finF.acc); r += e.r; d += e.d; } });
            if (!n) return `<p class="text-[11px] text-slate-400 mb-3"><i class="fa-regular fa-square-check mr-1"></i>Marque os lançamentos na lista para ver a soma.</p>`;
            const net = r - d;
            return `<div class="flex flex-wrap items-center gap-x-6 gap-y-1 p-3.5 mb-3 rounded-2xl bg-teal-50 dark:bg-teal-950/40 text-sm text-slate-700 dark:text-slate-200">
                <b>${n} selecionado${n > 1 ? 's' : ''}</b>
                <span>Receitas: <b class="text-emerald-600">R$ ${money(r)}</b></span>
                <span>Despesas: <b class="text-rose-600">R$ ${money(d)}</b></span>
                <span>Soma (receitas − despesas): <b class="${net >= 0 ? 'text-teal-600' : 'text-rose-600'}">R$ ${money(net)}</b></span>
                <span class="ml-auto flex items-center gap-3"><button onclick="openBulkEdit('fin')" class="px-3 py-1.5 rounded-lg bg-teal-600 text-white text-xs font-bold shadow"><i class="fa-solid fa-pen-to-square mr-1"></i>Editar mais</button>
                <button onclick="finSelClear()" class="text-xs font-semibold underline text-teal-700 dark:text-teal-300">Limpar seleção</button></span>
            </div>`;
        }
        // ---- Editar mais: altera campos de todos os itens selecionados ----
        function bulkRow(k, label, html) {
            return `<div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40"><label class="flex items-center gap-2 text-[11px] font-bold uppercase text-slate-500 mb-1.5"><input type="checkbox" id="bk-on-${k}"> ${label}</label><div oninput="document.getElementById('bk-on-${k}').checked=true" onchange="document.getElementById('bk-on-${k}').checked=true">${html}</div></div>`;
        }
        function openBulkEdit(kind) {
            let ids;
            if (kind === 'fin') ids = finFiltered().filter(t => finSel.has(t.id)).map(t => t.id);
            else ids = Array.from(document.querySelectorAll('.card-sel:checked')).map(b => b.dataset.id);
            if (ids.length < 1) { showToast('Selecione ao menos um item.', 'warning'); return; }
            window._bulk = { kind, ids };
            const owners = `<option value="">Casa (conjunta)</option>${plano().people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}`;
            const ded = `<option value="">Não</option>${Object.entries(PL_IR).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}`;
            const cats = kind === 'card' ? appData.cartao.categories.concat(catAllNames().filter(c => !appData.cartao.categories.includes(c))) : catAllNames();
            showModal(`Editar mais · ${ids.length} selecionado${ids.length > 1 ? 's' : ''}`, `
                <p class="text-xs text-slate-500 mb-3">Mexa só nos campos que quer mudar (eles ficam marcados). O valor escolhido é aplicado em <b>todos</b> os selecionados.</p>
                <datalist id="bk-cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
                <form onsubmit="applyBulkEdit(event)" class="space-y-2.5">
                    ${bulkRow('name', 'Nome', `<input id="bk-name" class="${INP}" placeholder="Novo nome">`)}
                    ${bulkRow('cat', 'Categoria', `${catSelect('bk-cat', '', { blank: '— escolha —' })}`)}
                    ${bulkRow('date', 'Data', `<input id="bk-date" type="date" class="${INP}">`)}
                    ${bulkRow('owner', 'De quem', `<select id="bk-owner" class="${INP}">${owners}</select>`)}
                    ${bulkRow('ded', 'Dedutível no IR', `<select id="bk-ded" class="${INP}">${ded}</select>`)}
                    ${kind === 'fin' ? bulkRow('status', 'Situação', `<select id="bk-status" class="${INP}"><option value="pago">Pago / Recebido</option><option value="pendente">Pendente</option></select>`)
                        + bulkRow('type', 'Tipo', `<select id="bk-type" class="${INP}"><option value="despesa">Despesa</option><option value="receita">Receita</option><option value="transferencia">Transf. entre contas</option></select>`)
                        + bulkRow('acc', 'Cartão / Conta (origem)', `<select id="bk-acc" class="${INP}">${finAccOpts('', true)}</select>`)
                        + bulkRow('to', 'Conta de destino (transferências)', `<select id="bk-to" class="${INP}">${finAccOpts('', true)}</select>`)
                        + bulkRow('amount', 'Valor (R$) — igual em todos', `<input id="bk-amount" type="number" step="0.01" min="0" class="${INP}">`)
                        + bulkRow('payer', 'Quem pagou (despesas da Casa)', `<select id="bk-payer" class="${INP}"><option value="">—</option>${plano().people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`)
                        + ((plano().debts || []).length ? bulkRow('debt', 'Pagamento de dívida (despesas)', `<select id="bk-debt" class="${INP}"><option value="">Não é pagamento de dívida</option>${plano().debts.map(x => `<option value="${x.id}">${esc(x.name)} · falta ${R$(x.saldo)}</option>`).join('')}</select>`) : '')
                        + bulkRow('hab', 'Habitação (despesas)', `<select id="bk-hab" class="${INP}"><option value="">Não é de Habitação</option><option value="__none">Habitação sem nome (previsão)</option>${(appData.habitacao.people || []).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`) : ''}
                    <button type="submit" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Aplicar aos ${ids.length}</button>
                </form>`);
        }
        function applyBulkEdit(ev) {
            ev.preventDefault();
            const B = window._bulk, on = k => { const c = document.getElementById('bk-on-' + k); return c && c.checked; }, v = k => document.getElementById('bk-' + k).value;
            const f = { name: on('name') ? v('name').trim() : null, cat: on('cat') ? v('cat').trim() : null, date: on('date') ? v('date') : null, owner: on('owner') ? v('owner') : null, ded: on('ded') ? v('ded') : null, status: on('status') ? v('status') : null,
                type: on('type') ? v('type') : null, acc: on('acc') ? v('acc') : null, to: on('to') ? v('to') : null, amount: on('amount') ? v('amount') : null, payer: on('payer') ? v('payer') : null, hab: on('hab') ? v('hab') : null, debt: on('debt') ? v('debt') : null };
            if (f.amount !== null && !(Number(f.amount) >= 0 && f.amount !== '')) { showToast('Informe um valor válido.', 'warning'); return; }
            if (Object.values(f).every(x => x === null)) { showToast('Marque ou altere ao menos um campo.', 'warning'); return; }
            if (f.name === '' || (f.date !== null && !f.date)) { showToast('Preencha o valor dos campos marcados.', 'warning'); return; }
            if (f.cat !== null) { if (!f.cat) { showToast('Informe a categoria.', 'warning'); return; } f.cat = catResolveNew(f.cat); }
            let n = 0;
            if (B.kind === 'fin') {
                const sel = appData.financeiro.transactions.filter(t => B.ids.includes(t.id) && !t.cardInvoice);
                for (const t of sel) {
                    const ty = f.type !== null ? f.type : t.type, a = f.acc !== null ? f.acc : t.accId, to = ty === 'transferencia' ? (f.to !== null ? f.to : t.toAccId) : '';
                    if (ty === 'transferencia' && (!a || !to || a === to)) { showToast(`Transferência "${t.desc}": escolha duas contas diferentes (origem e destino).`, 'warning'); return; }
                }
                appData.financeiro.transactions.forEach(t => {
                    if (!B.ids.includes(t.id)) return;
                    if (f.status !== null) t.status = f.status === 'pendente' ? 'pendente' : (f.type !== null && !t.cardInvoice ? f.type : t.type) === 'receita' ? 'recebido' : 'pago';
                    if (f.acc !== null) t.accId = f.acc;
                    if (!t.cardInvoice) {
                        if (f.type !== null) { t.type = f.type; if (f.type !== 'transferencia') t.toAccId = ''; }
                        if (f.to !== null && t.type === 'transferencia') t.toAccId = f.to;
                        if (f.amount !== null) t.amount = Number(f.amount).toFixed(2);
                        if (f.payer !== null && !t.owner) { if (f.payer) t.payer = f.payer; else delete t.payer; }
                        if (f.debt !== null) { if (f.debt && t.type === 'despesa') t.debtId = f.debt; else delete t.debtId; }
                        if (f.hab !== null && t.type === 'despesa') { if (f.hab === '') { delete t.habitacional; delete t.habPerson; } else { t.habitacional = true; t.habPerson = f.hab === '__none' ? '' : f.hab; } }
                        if (f.name !== null) t.desc = f.name;
                        if (f.cat !== null) t.category = f.cat;
                        if (f.date !== null) t.date = f.date;
                        if (f.owner !== null) { if (f.owner) t.owner = f.owner; else delete t.owner; if (f.owner) delete t.payer; }
                        if (f.ded !== null) { if (f.ded) t.dedutivel = f.ded; else delete t.dedutivel; }
                    }
                    n++;
                });
                finSel.clear();
            } else {
                appData.cartao.entries.forEach(e => {
                    if (!B.ids.includes(e.id)) return;
                    if (f.name !== null) e.name = f.name;
                    if (f.cat !== null) { e.category = f.cat; if (!appData.cartao.categories.some(c => normKey(c) === normKey(f.cat))) appData.cartao.categories.push(f.cat); }
                    if (f.date !== null) { e.date = f.date; const c = cardById(e.cardId); if (c) e.invoice = cardInvoiceKey(c, f.date); }
                    if (f.owner !== null) { e.owner = f.owner || 'casa'; }
                    if (f.ded !== null) { if (f.ded && Number(e.amount) > 0) e.dedutivel = f.ded; else delete e.dedutivel; }
                    n++;
                });
            }
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast(`${n} item(ns) alterado(s).`, 'success');
        }
        function finSelToggle(id, on) {
            if (on) finSel.add(id); else finSel.delete(id);
            const bar = document.getElementById('fin-sel-bar'); if (bar) bar.innerHTML = finSelBar();
            finSelSyncAll();
        }
        function finSelSyncAll() {
            const L = finFiltered(), g = { all: L, pend: L.filter(t => finSt(t) === 'pendente'), res: L.filter(t => finSt(t) !== 'pendente') };
            Object.keys(g).forEach(k => { const el = document.getElementById('fin-sel-all-' + k); if (el) el.checked = g[k].length > 0 && g[k].every(t => finSel.has(t.id)); });
        }
        function finSelGroup(on, grp) {
            finFiltered().filter(t => grp === 'all' || (grp === 'pend') === (finSt(t) === 'pendente')).forEach(t => { if (on) finSel.add(t.id); else finSel.delete(t.id); });
            renderCurrentTabContent();
        }
        function finSelAll(on) { finFiltered().forEach(t => { if (on) finSel.add(t.id); else finSel.delete(t.id); }); renderCurrentTabContent(); }
        function finSelClear() { finSel.clear(); renderCurrentTabContent(); }
        function toggleFinanceStatus(id) {
            const t = appData.financeiro.transactions.find(x => x.id === id);
            if (!t) return;
            t.status = finSt(t) === 'pendente' ? (t.type === 'receita' ? 'recebido' : 'pago') : 'pendente';
            saveAppData(); renderCurrentTabContent();
        }

        // ---------- Menu "Cartão" (débito e poupança) ----------
        function renderContas(container) {
            const cs = contasData();
            if (!cs.find(a => a.id === contaSel)) contaSel = cs[0] ? cs[0].id : null;
            const a = accById(contaSel);
            let body = '';
            if (!cs.length) {
                body = `<div class="text-center py-16 text-slate-400"><i class="fa-regular fa-credit-card text-5xl mb-3"></i><p class="text-sm">Nenhum cartão cadastrado. Cadastre um cartão de débito ou poupança para ligá-lo ao Financeiro.</p></div>`;
            } else {
                const allTx = appData.financeiro.transactions.filter(t => t.accId === a.id || t.toAccId === a.id);
                const pfx = perPrefix('ct');
                const txs = allTx.filter(t => !pfx || (t.date && t.date.startsWith(pfx))).sort((x, y) => (y.date || '').localeCompare(x.date || ''));
                let rec = 0, des = 0, saldo = 0, prev = 0;
                allTx.forEach(t => { const e = finEffect(t, a.id); if (finSt(t) === 'pendente') prev += e.r - e.d; else saldo += e.r - e.d; });
                txs.forEach(t => { const e = finEffect(t, a.id); rec += e.r; des += e.d; });
                const k = (l, v, c) => `<div class="bg-slate-50 dark:bg-slate-700/40 rounded-2xl p-4"><p class="text-[11px] font-semibold text-slate-400 uppercase">${l}</p><p class="text-xl font-bold ${c} mt-1">R$ ${money(v)}</p></div>`;
                body = `
                <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 space-y-5">
                    <div class="flex flex-wrap items-start justify-between gap-3">
                        <div>

        // ---------- Agenda: repetição, dia todo e calendário ----------
        function agOcc(it, ds) {
            if (!it.date || ds < it.date) return false;
            if (it.until && ds > it.until) return false;
            const r = it.repeat;
            if (!r || !r.freq || r.freq === 'none') return ds === it.date;
            const a = new Date(it.date + 'T00:00:00'), b = new Date(ds + 'T00:00:00');
            const days = Math.round((b - a) / 864e5);
            let n = 1, unit = r.freq;
            if (r.freq === 'custom') { n = Math.max(1, Number(r.every) || 1); unit = r.unit || 'day'; }
            if (unit === 'daily' || unit === 'day') return days % n === 0;
            if (unit === 'weekly' || unit === 'week') {
                const wd = (r.days && r.days.length) ? r.days : [a.getDay()];
                return wd.includes(b.getDay()) && Math.floor((days + a.getDay()) / 7) % n === 0;

                        <div><div class="flex items-center justify-between mb-1"><label class="text-xs font-semibold text-slate-500 uppercase">Horário</label>
                            <label class="flex items-center gap-1 text-[11px] text-slate-500"><input type="checkbox" id="ag-allday" ${it.allDay ? 'checked' : ''} onchange="agAllDayChange()"> dia todo</label></div>
                            <input type="time" id="ag-time" value="${it.time || ''}" ${it.allDay ? 'disabled' : ''} class="${INP}"></div>
                    </div>
                    <div><label class="${LBL}">Repetição</label>
                        <select id="ag-freq" onchange="agRepChange()" class="${INP}">${fo('none', 'Não repete')}${fo('daily', 'Diária')}${fo('weekly', 'Semanal')}${fo('monthly', 'Mensal')}${fo('yearly', 'Anual')}${fo('custom', 'A cada...')}</select></div>
                    <div id="ag-wd-wrap" class="${r.freq === 'weekly' ? '' : 'hidden'}"><label class="${LBL}">Dias da semana</label><div class="flex gap-1.5">
                        ${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((l, i) => `<label class="flex flex-col items-center text-[11px] text-slate-500 gap-0.5"><input type="checkbox" class="ag-wd" value="${i}" ${(r.days || []).includes(i) ? 'checked' : ''}>${l}</label>`).join('')}</div>
                        <p class="text-[11px] text-slate-400 mt-1">Sem marcar nada, repete no dia da semana da data escolhida.</p></div>
                    <div id="ag-custom-wrap" class="${r.freq === 'custom' ? '' : 'hidden'} grid grid-cols-2 gap-4">
                        <div><label class="${LBL}">A cada</label><input type="number" min="1" id="ag-every" value="${r.every || 1}" class="${INP}"></div>
                        <div><label class="${LBL}">Unidade</label><select id="ag-unit" class="${INP}">${uo('day', 'dia(s)')}${uo('week', 'semana(s)')}${uo('month', 'mês(es)')}${uo('year', 'ano(s)')}</select></div></div>
                    <div id="ag-until-wrap" class="${r.freq === 'none' ? 'hidden' : ''}"><label class="${LBL}">Repetir até (opcional)</label><input type="date" id="ag-until" value="${it.until || ''}" class="${INP}"></div>
                    <div><label class="${LBL}">Local</label><input type="text" id="ag-address" value="${esc(it.address || '')}" class="${INP}"></div>
                    <div><label class="${LBL}">Descrição</label><textarea id="ag-desc" rows="2" class="${INP}">${esc(it.desc || '')}</textarea></div>
                    <button type="submit" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Salvar</button>
                </form>`);
        }
        function agAllDayChange() { document.getElementById('ag-time').disabled = document.getElementById('ag-allday').checked; }
        function agRepChange() {
            const f = document.getElementById('ag-freq').value;
            document.getElementById('ag-wd-wrap').classList.toggle('hidden', f !== 'weekly');
            document.getElementById('ag-custom-wrap').classList.toggle('hidden', f !== 'custom');
            document.getElementById('ag-until-wrap').classList.toggle('hidden', f === 'none');
        }
        function saveAgenda(e, id) {
            e.preventDefault();
            const g = k => document.getElementById(k).value;
            const allDay = document.getElementById('ag-allday').checked, freq = g('ag-freq');
            const data = {
                title: g('ag-title'), date: g('ag-date'), allDay, time: allDay ? '' : g('ag-time'),
                address: g('ag-address'), desc: g('ag-desc'),
                repeat: { freq, every: Math.max(1, Number(g('ag-every')) || 1), unit: g('ag-unit'), days: Array.from(document.querySelectorAll('.ag-wd:checked')).map(c => Number(c.value)) },
                until: freq === 'none' ? '' : g('ag-until')
            };
            if (id) { const ag = appData.agenda.find(x => x.id === id); if (ag) Object.assign(ag, data); }
            else appData.agenda.push(Object.assign({ id: Date.now().toString(), status: 'Ativo' }, data));
            if (data.date) { agSel = data.date; agMonth = data.date.slice(0, 7); }
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast('Salvo!', 'success');
        }

        // =====================================================
        // AJUSTES V3: OLHO, FUNDO/CARTÃO NA TELA INICIAL, LIBERAÇÕES, AUTOCUIDADO, CORES
        // =====================================================
        function mm(v) { return dashHide ? '••••' : money(v); }
        function toggleHide() { dashHide = !dashHide; localStorage.setItem('meusistema_hide', dashHide ? '1' : '0'); renderCurrentTabContent(); }
        function toggleColors() { colorsOpen = !colorsOpen; renderCurrentTabContent(); }

        // ---------- Tela inicial: Fundo de Obra por pessoa ----------
        // Uma única conta para o Fundo de Obra: a tela Habitação e a tela inicial usam exatamente a mesma
        function habSummary() {
            const H = appData.habitacao, balances = {}, spent = {}, aportado = {};
            (H.people || []).forEach(p => { balances[p.id] = Number(p.initialBalance) || 0; });
            let totalAportes = 0, totalRetiradas = 0, totalPrev = 0, totalGastoFin = 0;
            H.contributions.forEach(c => {
                const v = Number(c.amount) || 0;
                if (c.type === 'pendente') { totalPrev += v; return; }
                if (c.fin) { if (c.type === 'retirada') { spent[c.personId] = (spent[c.personId] || 0) + v; totalGastoFin += v; } return; }   // gasto lançado pelo Financeiro: só soma no GASTO, não mexe em saldo
                if (!balances[c.personId]) balances[c.personId] = 0;
                if (c.type === 'aporte') { balances[c.personId] += v; totalAportes += v; aportado[c.personId] = (aportado[c.personId] || 0) + v; }
                else { balances[c.personId] -= v; totalRetiradas += v; spent[c.personId] = (spent[c.personId] || 0) + v; }
            });
            return { balances, spent, aportado, totalAportes, totalRetiradas, totalGasto: totalRetiradas + totalGastoFin, totalPrev, saldoCaixaObra: totalAportes - totalRetiradas };
        }
        function dashFundSet(v) { dashFund = v; localStorage.setItem('meusistema_dash_fund', v); renderCurrentTabContent(); }
        function dashFundHtml() {
            const ppl = appData.habitacao.people || [];
            if (dashFund && !ppl.some(p => p.id === dashFund)) dashFund = '';
            const H = habSummary();
            const v = dashFund ? (H.balances[dashFund] || 0) : H.saldoCaixaObra;
            const ap = dashFund ? (H.aportado[dashFund] || 0) : H.totalAportes;
            const gs = dashFund ? (H.spent[dashFund] || 0) : H.totalGasto;
            const nm = dashFund ? ((ppl.find(p => p.id === dashFund) || {}).name || '') : 'Total';
            const S = 'px-1.5 py-0.5 rounded-md border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-[10px]';
            return `<div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase">Fundo de Obra</p>
                    <h3 class="text-xl font-bold ${v >= 0 ? 'text-slate-800 dark:text-white' : 'text-rose-600'} mt-1">R$ ${mm(v)}</h3>
                    <p class="text-[10px] text-amber-500 font-semibold mt-1">Valor guardado · ${esc(nm)}</p>
                    <p class="text-[10px] text-slate-400">Aportado R$ ${mm(ap)} · Gasto R$ ${mm(gs)}</p>
                    <select onchange="dashFundSet(this.value)" class="${S} mt-1.5"><option value="">Total</option>${ppl.map(p => `<option value="${p.id}" ${dashFund === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-950/60 text-amber-500 flex items-center justify-center text-xl"><i class="fa-solid fa-house-chimney-user"></i></div>
            </div>`;
        }

        // ---------- Tela inicial: saldo dos cartões (débito e poupança) ----------
        function contaSaldoDash(id) {
            let r = 0, d = 0;
            appData.financeiro.transactions.forEach(t => { if (finSt(t) === 'pendente') return; const e = finEffect(t, id); r += e.r; d += e.d; });
            return r - d;
        }
        function dashContaSet(v) { dashCardAcc = v; localStorage.setItem('meusistema_dash_card', v); renderCurrentTabContent(); }
        function dashContasHtml() {
            const cs = contasData();
            if (dashCardAcc && !cs.some(c => c.id === dashCardAcc)) dashCardAcc = '';
            const list = dashCardAcc ? cs.filter(c => c.id === dashCardAcc) : cs.filter(c => !c.noSum);
            const total = list.reduce((s, c) => s + contaSaldoDash(c.id), 0);
            const S = 'px-1.5 py-0.5 rounded-md border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-[10px] max-w-[150px]';
            const rows = !dashCardAcc ? list.slice(0, 4).map(c => `<p class="text-[10px] text-slate-500 flex justify-between gap-3"><span class="truncate">${esc(c.name)}</span><span class="font-semibold">R$ ${mm(contaSaldoDash(c.id))}</span></p>`).join('') + (list.length > 4 ? `<p class="text-[10px] text-slate-400">+${list.length - 4} cartões</p>` : '') : '';
            return `<div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-100 dark:border-slate-700">
                <div onclick="switchTab('contas')" class="cursor-pointer flex items-center justify-between gap-3">
                    <div class="min-w-0 flex-1">
                        <p class="text-xs font-medium text-slate-400 uppercase">Cartões (débito e poupança)</p>
                        ${cs.length ? `<h3 class="text-xl font-bold ${total >= 0 ? 'text-emerald-600' : 'text-rose-600'} mt-1">R$ ${mm(total)}</h3>
                        <div class="mt-1 space-y-0.5">${rows}</div>` : `<p class="text-xs text-slate-400 mt-2">Nenhum cartão cadastrado. Toque para cadastrar.</p>`}
                    </div>
                    <div class="w-12 h-12 shrink-0 rounded-2xl bg-sky-50 dark:bg-sky-950/60 text-sky-500 flex items-center justify-center text-xl"><i class="fa-solid fa-piggy-bank"></i></div>
                </div>
                ${cs.length ? `<div class="mt-2"><select onchange="dashContaSet(this.value)" class="${S}"><option value="">Todos os cartões</option>${cs.map(c => `<option value="${c.id}" ${dashCardAcc === c.id ? 'selected' : ''}>${esc(accLabel(c))}</option>`).join('')}</select></div>` : ''}
            </div>`;
        }

        // ---------- Habitação: LIBERAÇÕES (só controle; não movimenta nada) ----------
        function libData() { const H = appData.habitacao; if (!Array.isArray(H.liberacoes)) H.liberacoes = []; return H.liberacoes; }

        // ========== HABITAÇÃO › DESPESAS DA CASA (água, energia, telefone…) ==========
        const CASA_CAT = 'Despesa da casa';
        function casaData() { const H = appData.habitacao; if (!Array.isArray(H.casa)) H.casa = []; return H.casa; }
        function isCasaCat(c) { const s = String(c || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); return s === 'despesa da casa' || s === 'despesas da casa'; }
        function casaNextNum() { return String(casaData().reduce((m, r) => Math.max(m, parseInt(r.numero) || 0), 0) + 1); }
        function casaTxFields(r) {
            const pago = r.status === 'pago';
            const amount = pago ? (Number(r.valorPago) || Number(r.valorOriginal) || 0) : (Number(r.valorOriginal) || 0);
            const date = (pago && r.pagamento) ? r.pagamento : (r.vencimento || r.pagamento || localDateStr());
            return { type: 'despesa', category: CASA_CAT, desc: r.desc || 'Despesa da casa', amount, date, status: pago ? 'pago' : 'pendente', accId: r.accId || '', toAccId: '' };
        }
        // Casa → Financeiro (chamado ao salvar pela tela da casa)
        function casaApplyToTx(r) {
            const T = appData.financeiro.transactions; let t = r.finId ? T.find(x => x.id === r.finId) : null;
            const f = casaTxFields(r);
            if (!t) { t = { id: uid(), attachments: [] }; T.push(t); r.finId = t.id; }
            Object.assign(t, f); t.casaId = r.id; t.attachments = (r.attachments || []).slice();
            if (r.parcGroup) t.installment = { group: r.parcGroup, n: r.parcN, total: r.parcTotal }; else delete t.installment;
            return t;
        }
        // Financeiro → Casa
        function casaFromTx(r, t) {
            const pago = (t.status || 'pago') !== 'pendente';
            r.desc = t.desc || r.desc || '';
            r.status = pago ? 'pago' : 'pendente';
            if (pago) { r.valorPago = Number(t.amount) || 0; if (!r.valorOriginal) r.valorOriginal = r.valorPago; r.pagamento = t.date; if (!r.vencimento) r.vencimento = t.date; }
            else { r.valorOriginal = Number(t.amount) || 0; r.valorPago = ''; r.pagamento = ''; r.vencimento = t.date; }
            r.accId = t.accId || ''; r.attachments = (t.attachments || []).slice();
            if (!r.competencia) r.competencia = String(r.vencimento || t.date || '').slice(0, 7);
            if (t.installment) { r.parcGroup = t.installment.group; r.parcN = t.installment.n; r.parcTotal = t.installment.total; }
        }
        function casaSyncAll() {
            const H = appData.habitacao; if (!H || !appData.financeiro) return;
            const C = casaData();
            appData.financeiro.transactions.forEach(t => {
                const isCasa = isCasaCat(t.category) && t.type === 'despesa' && !t.cardInvoice;
                const rec = t.casaId ? C.find(r => r.id === t.casaId) : null;
                if (rec && !isCasa) { H.casa = casaData().filter(r => r.id !== rec.id); delete t.casaId; return; }   // categoria mudou: sai da tela da casa
                if (rec) {
                    const f = casaTxFields(rec);
                    const ids = a => (a || []).map(x => x.id).join(',');
                    if (f.desc !== (t.desc || '') || Number(f.amount) !== Number(t.amount) || f.date !== t.date || f.status !== (t.status || 'pago') || f.accId !== (t.accId || '') || ids(rec.attachments) !== ids(t.attachments)) casaFromTx(rec, t);
                    return;
                }
                if (isCasa) {
                    const r = { id: uid(), numero: casaNextNum(), desc: t.desc || '', fatura: '', competencia: '', vencimento: '', pagamento: '', status: 'pendente', valorOriginal: 0, valorPago: '', accId: '', pagador: '', attachments: [], finId: t.id };
                    casaFromTx(r, t); casaData().push(r); t.casaId = r.id;
                }
            });
        }
        // =====================================================================
        // PLANEJAMENTO: orçamento, fluxo projetado, recorrentes, vencimentos
        // =====================================================================
        let plTab = 'orcamento', plMonth = localDateStr().slice(0, 7), plDay = '', plAnoIR = String(new Date().getFullYear()), plCmpMode = 'mes';
        let plVista = (() => { try { return localStorage.getItem('isis_pl_vista') || 'todos'; } catch (e) { return 'todos'; } })();
        const PL_CARD = 'bg-white dark:bg-slate-800 rounded-3xl p-5 shadow-sm border border-slate-100 dark:border-slate-700';
        const PL_BTN = 'bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow';
        const PL_BTN2 = 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold';
        const R$ = v => 'R$ ' + money(Number(v) || 0);
        function plano() {
            const P = appData.plano || (appData.plano = {});
            if (!Array.isArray(P.people) || P.people.length < 2) P.people = [{ id: 'p1', name: 'Tayná', renda: '' }, { id: 'p2', name: 'Samuel', renda: '' }];
            ['budgets', 'recs', 'goals', 'assets', 'snaps', 'invests', 'debts', 'acertos'].forEach(k => { if (!Array.isArray(P[k])) P[k] = []; });
            if (!P.catClass || typeof P.catClass !== 'object') P.catClass = {};
            if (!P.split) P.split = 'meio';
            if (P.remindDays === undefined) P.remindDays = 3;
            return P;
        }
        function plPersonName(id) { const p = plano().people.find(x => x.id === id); return p ? p.name : (id === 'casa' || !id ? 'Casa' : id); }
        function plVisible(owner) { if (plVista === 'todos') return true; return (owner || 'casa') === plVista; }
        let plView = (() => { try { return localStorage.getItem('isis_pl_view') || 'cards'; } catch (e) { return 'cards'; } })();
        function plSetView(v) { plView = v; try { localStorage.setItem('isis_pl_view', v); } catch (e) {} renderCurrentTabContent(); }
        function plItemClick(ev) { if (ev.target.closest('button,a,input,select,textarea,label')) return; const it = ev.target.closest('.pl-item'); if (it) it.classList.toggle('open'); }
        function plMarkItems(root) {   // cartões dentro de grades viram "itens" (linha compacta ↔ cartão)
            root.querySelectorAll('#pl-body .grid > div[class*="rounded-2xl"], #pl-body .space-y-2 > div[class*="rounded-2xl"], #pl-body .space-y-3 > div[class*="rounded-2xl"]').forEach(el => { if (el.closest('table') || el.querySelector('.pl-item') || /(^|\s)flex(\s|$)/.test(el.className)) return; el.classList.add('pl-item'); el.parentElement.classList.add('pl-list'); });
        }
        function plSetVista(v) { plVista = v; try { localStorage.setItem('isis_pl_vista', v); } catch (e) {} renderCurrentTabContent(); }
        function plCurYM() { return localDateStr().slice(0, 7); }

        // linhas de movimentação "de caixa" (sem transferências, sem fatura duplicada, sem contas Habitacional)
        function plRows(ym, ignoreVista) {
            const rows = [];
            appData.financeiro.transactions.forEach(t => {
                if (t.type === 'transferencia' || t.cardInvoice || isHabId(t.accId)) return;
                if (ym && !(t.date || '').startsWith(ym)) return;
                rows.push({ id: t.id, type: t.type, amount: Number(t.amount) || 0, category: (t.category || 'Sem categoria').trim(), date: t.date || '', desc: t.desc || '', owner: t.owner || '', payer: t.payer || '', src: 'fin', st: finSt(t), tx: t });
            });
            appData.cartao.entries.forEach(e => {
                if (ym && !(e.date || '').startsWith(ym)) return;
                const c = cardById(e.cardId);
                rows.push({ id: e.id, type: 'despesa', amount: Number(e.amount) || 0, category: (e.category || 'Outros').trim(), date: e.date || '', desc: e.name || '', owner: e.owner ? e.owner : (c && c.shared ? 'casa' : ((c && c.owner) || '')), src: 'card', st: 'pago', entry: e, card: c });
            });
            return ignoreVista ? rows : rows.filter(r => plVisible(r.owner));
        }
        function plSpentMap(ym, ignoreVista) {
            const m = {};
            plRows(ym, ignoreVista).forEach(r => { if (r.type !== 'despesa') return; const k = normKey(r.category); m[k] = (m[k] || 0) + r.amount; });
            return m;
        }
        function plAllCats() {
            const s = new Set();
            appData.financeiro.transactions.forEach(t => { if (t.category && !t.cardInvoice) s.add(t.category.trim()); });
            appData.cartao.entries.forEach(e => { if (e.category) s.add(e.category.trim()); });
            (appData.cartao.categories || []).forEach(c => s.add(c));
            plano().budgets.forEach(b => s.add(b.category));
            return [...s].filter(Boolean).sort((a, b) => a.localeCompare(b, 'pt-BR'));
        }

        // ---------- casca da tela ----------
        const PL_TABS = [
            ['orcamento', 'Orçamento', 'fa-bullseye'], ['fluxo', 'Fluxo projetado', 'fa-chart-line'], ['calcinv', 'Cálculo Invest.', 'fa-chart-line'], ['recorrentes', 'Recorrentes', 'fa-repeat'], ['vencimentos', 'Vencimentos', 'fa-calendar-days'],
            ['metas', 'Metas', 'fa-flag-checkered'], ['patrimonio', 'Patrimônio', 'fa-landmark'], ['investimentos', 'Investimentos', 'fa-seedling'], ['dividas', 'Dívidas', 'fa-hand-holding-dollar'],
            ['casal', 'Cálculo', 'fa-calculator'], ['analise', 'Análise', 'fa-chart-pie'], ['ir', 'Imposto de Renda', 'fa-file-invoice']
        ];
        function plSetTab(t) { plTab = t; plDay = ''; renderCurrentTabContent(); window.scrollTo(0, 0); }
        function plNavMonth(d) { plMonth = ymAdd(plMonth, d); plDay = ''; renderCurrentTabContent(); }
        function renderPlanejamento(container) {
            plRecAuto();
            const P = plano();
            const vistas = [['todos', 'Todos'], ['p1', P.people[0].name], ['p2', P.people[1].name], ['casa', 'Casa']];
            const fns = { orcamento: plRenderOrcamento, fluxo: plRenderFluxo, calcinv: plRenderCalcInv, recorrentes: plRenderRecs, vencimentos: plRenderVenc, metas: plRenderMetas, patrimonio: plRenderPatrimonio, investimentos: plRenderInvest, dividas: plRenderDividas, casal: plRenderCasal, analise: plRenderAnalise, ir: plRenderIR };
            let body = '';
            try { body = (fns[plTab] || plRenderOrcamento)(); } catch (e) { console.error(e); body = '<p class="text-sm text-rose-600">Erro ao montar esta tela: ' + esc(e.message) + '</p>'; }
            container.innerHTML = `<div class="space-y-4 max-w-7xl mx-auto ${plView === 'rows' ? 'pl-v-rows' : ''}" onclick="plItemClick(event)">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1 max-w-full">${PL_TABS.map(([k, l, ic]) => `<button onclick="plSetTab('${k}')" class="shrink-0 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 ${plTab === k ? 'bg-teal-600 text-white shadow' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-100 dark:border-slate-700'}"><i class="fa-solid ${ic}"></i>${l}</button>`).join('')}</div>
                    <div class="flex rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 text-xs font-bold" title="Ver só os lançamentos de cada pessoa ou da casa">${vistas.map(([k, l]) => `<button onclick="plSetVista('${k}')" class="px-3 py-1.5 ${plVista === k ? 'bg-amber-500 text-teal-950' : 'bg-white dark:bg-slate-800 text-slate-500'}">${esc(l)}</button>`).join('')}</div>
                </div>
                <div class="flex justify-end"><div class="flex rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 text-xs font-bold" title="Como ver as listas desta área"><button onclick="plSetView('cards')" class="px-3 py-1.5 ${plView === 'cards' ? 'bg-teal-600 text-white' : 'bg-white dark:bg-slate-800 text-slate-500'}"><i class="fa-solid fa-table-cells-large mr-1"></i>Cartões</button><button onclick="plSetView('rows')" class="px-3 py-1.5 ${plView === 'rows' ? 'bg-teal-600 text-white' : 'bg-white dark:bg-slate-800 text-slate-500'}"><i class="fa-solid fa-list mr-1"></i>Linhas</button></div></div>
                <div id="pl-body">${body}</div></div>`;
            plMarkItems(container);
            if (plTab === 'calcinv') anCalc();
        }

                <div class="flex flex-wrap items-center justify-between gap-3 mb-4"><h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2"><i class="fa-solid fa-repeat text-teal-500"></i>Contas recorrentes e assinaturas</h3><button onclick="plOpen('recs')" class="${PL_BTN}"><i class="fa-solid fa-plus mr-1"></i>Nova</button></div>
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/40"><p class="text-[10px] uppercase font-bold text-slate-400">Por mês</p><p class="font-bold text-slate-800 dark:text-white">${R$(totMes)}</p></div>
                    <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/40"><p class="text-[10px] uppercase font-bold text-slate-400">Por ano</p><p class="font-bold text-rose-600">${R$(totAno)}</p></div>
                    <div class="p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-100 dark:border-amber-900"><p class="text-[10px] uppercase font-bold text-amber-700">Assinaturas/ano</p><p class="font-bold text-amber-700">${R$(subAno)}</p></div></div>
                ${subs.length ? `<p class="text-sm text-amber-800 dark:text-amber-300 mb-4"><i class="fa-solid fa-lightbulb mr-1"></i>Você gasta <b>${R$(subAno)} por ano</b> em ${subs.length} assinatura(s). Vale revisar quais ainda usam?</p>` : ''}
                ${recs.length ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${recs.map(row).join('')}</div>` : '<p class="text-sm text-slate-400 text-center py-8">Nada cadastrado. Inclua streaming, academia, seguros, aluguel, salário…</p>'}
                ${sug.length ? `<div class="mt-5"><p class="text-[11px] font-bold uppercase text-slate-400 mb-2">Parecem recorrentes (apareceram em 3+ meses)</p><div class="flex flex-wrap gap-2">${sug.map(s => `<button onclick="plOpen('recs',null,{name:'${esc(s.name).replace(/'/g, "\\'")}',amount:${Math.abs(Number(s.amount)) || 0},category:'${esc(s.cat || '').replace(/'/g, "\\'")}'})" class="px-3 py-1.5 rounded-lg text-xs bg-slate-100 dark:bg-slate-700"><b>${esc(s.name)}</b> ${R$(s.amount)} <i class="fa-solid fa-plus ml-1 text-teal-600"></i></button>`).join('')}</div></div>` : ''}
            </div>`;
        }

        // ---------- 2) Fluxo de caixa projetado ----------
        let plFluxoN = 6;
        function plFlow(n) {
            const cur = plCurYM(), today = localDateStr(), P = plano();
            let bal = 0; if (plVista === 'todos') contasData().forEach(a => { if (!a.noSum) bal += contaSaldoDash(a.id); });
            const months = []; for (let i = 0; i < n; i++) months.push(ymAdd(cur, i));
            const out = months.map(m => ({ ym: m, ent: 0, sai: 0, items: [] }));
            appData.financeiro.transactions.forEach(t => {
                if (finSt(t) !== 'pendente' || isHabId(t.accId) || !plVisible(t.owner || '')) return;
                const e = finEffect(t, null); if (!e.r && !e.d) return;
                let m = (t.date || cur).slice(0, 7); if (m < cur) m = cur;
                const o = out.find(x => x.ym === m); if (!o) return;
                o.ent += e.r; o.sai += e.d; o.items.push({ desc: t.desc || t.category, val: e.r - e.d, date: t.date, card: !!t.cardInvoice });
            });
            P.recs.forEach(rec => months.forEach(m => {
                const d = plRecDue(rec, m); if (!d || (m === cur && d < today) || plRecMaterialized(rec, m) || !plVisible(rec.owner || '')) return;
                const o = out.find(x => x.ym === m), v = plRecAmt(rec, m);

                o.items.push({ desc: rec.name + ' (recorrente)', val: rec.kind === 'receita' ? v : -v, date: d });
            }));
            let run = bal; out.forEach(o => { o.net = o.ent - o.sai; run += o.net; o.fim = run; });
            return { bal, out };
        }
        function plRenderFluxo() {
            const { bal, out } = plFlow(plFluxoN), tight = out.find(o => o.fim < 0) || out.reduce((a, b) => (b.fim < a.fim ? b : a), out[0]);
            const neg = out.some(o => o.fim < 0), maxAbs = Math.max(1, ...out.map(o => Math.abs(o.fim)));
            return `<div class="${PL_CARD}">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-3"><h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2"><i class="fa-solid fa-chart-line text-teal-500"></i>Fluxo de caixa projetado</h3>

            </div>`;
        }

        // ---------- 4) Calendário de vencimentos ----------
        function plDayItems(ds) {
            const items = [], cur = plCurYM();
            appData.financeiro.transactions.forEach(t => {
                if (t.type === 'transferencia' || t.date !== ds || isHabId(t.accId) || !plVisible(t.owner || '')) return;
                items.push({ desc: t.desc || t.category, val: Number(t.amount) || 0, kind: t.type, pend: finSt(t) === 'pendente', card: !!t.cardInvoice, id: t.id });
            });
            plano().recs.forEach(r => { const m = ds.slice(0, 7), d = plRecDue(r, m); if (d !== ds || plRecMaterialized(r, m) || !plVisible(r.owner || '')) return; items.push({ desc: r.name + ' (recorrente)', val: Number(r.amount) || 0, kind: r.kind === 'receita' ? 'receita' : 'despesa', pend: true, rec: r.id }); });
            plano().goals.forEach(g => { if (g.deadline === ds) items.push({ desc: 'Prazo da meta: ' + g.name, val: 0, kind: 'meta', pend: true }); });
            return items;
        }
        function plRenderVenc() {
            const P = plano(), today = localDateStr(), [y, m] = plMonth.split('-').map(Number), start = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate();
            let cells = ''; for (let i = 0; i < start; i++) cells += '<div></div>';
            for (let d = 1; d <= dim; d++) {
                const ds = `${plMonth}-${pad2(d)}`, it = plDayItems(ds), pend = it.filter(x => x.pend && x.kind !== 'meta'), rec = pend.some(x => x.kind === 'receita'), des = pend.some(x => x.kind === 'despesa');

                cells += `<button onclick="plDay='${ds}';renderCurrentTabContent()" class="aspect-square rounded-lg text-xs flex flex-col items-center justify-center ${plDay === ds ? 'ring-2 ring-teal-600' : ''} ${ds === today ? 'bg-teal-50 dark:bg-teal-950/40 font-bold' : 'bg-slate-50 dark:bg-slate-700/40'} ${late ? 'text-rose-600 font-bold' : 'text-slate-600 dark:text-slate-300'}">${d}<span class="flex gap-0.5 mt-0.5 h-1.5">${des ? '<i class="w-1.5 h-1.5 rounded-full bg-rose-500"></i>' : ''}${rec ? '<i class="w-1.5 h-1.5 rounded-full bg-emerald-500"></i>' : ''}${it.length && !pend.length ? '<i class="w-1.5 h-1.5 rounded-full bg-slate-300"></i>' : ''}</span></button>`;

            const line = x => `<div class="flex justify-between gap-3 text-sm py-1.5 border-b border-slate-100 dark:border-slate-700"><span class="truncate ${x.pend ? '' : 'line-through text-slate-400'}">${x.card ? '<i class="fa-solid fa-credit-card text-indigo-500 mr-1"></i>' : ''}${esc(x.desc)}</span><b class="whitespace-nowrap ${x.kind === 'receita' ? 'text-emerald-600' : x.kind === 'meta' ? 'text-slate-400' : 'text-rose-600'}">${x.kind === 'meta' ? '' : (x.kind === 'receita' ? '+ ' : '- ') + R$(x.val)}</b></div>`;
            return `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div class="${PL_CARD}"><div class="flex items-center justify-between mb-3"><h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2"><i class="fa-solid fa-calendar-days text-teal-500"></i>Vencimentos</h3>${plMonthNav()}</div>
                    <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-slate-400 font-bold mb-1">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(x => `<div>${x}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1">${cells}</div>
                    <p class="text-[11px] text-slate-400 mt-2"><i class="inline-block w-2 h-2 rounded-full bg-rose-500"></i> a pagar · <i class="inline-block w-2 h-2 rounded-full bg-emerald-500"></i> a receber · <i class="inline-block w-2 h-2 rounded-full bg-slate-300"></i> já quitado. Vermelho = em atraso.</p>
                    ${plDay ? `<div class="mt-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/40"><p class="text-xs font-bold text-slate-500 mb-1">${fmtBR(plDay)}</p>${dayList.length ? dayList.map(line).join('') : '<p class="text-xs text-slate-400">Nada neste dia.</p>'}</div>` : ''}</div>
                <div class="${PL_CARD}"><h3 class="font-bold text-lg text-slate-800 dark:text-white mb-3 flex items-center gap-2"><i class="fa-solid fa-hourglass-half text-amber-500"></i>Próximos 30 dias</h3>
                    ${up.length ? up.map(x => `<div class="flex justify-between gap-3 text-sm py-1.5 border-b border-slate-100 dark:border-slate-700"><span class="truncate"><span class="text-xs text-slate-400 mr-2">${fmtBR(x.date).slice(0, 5)}</span>${x.card ? '<i class="fa-solid fa-credit-card text-indigo-500 mr-1"></i>' : ''}${esc(x.desc)}</span><b class="text-rose-600 whitespace-nowrap">${R$(x.val)}</b></div>`).join('') + `<p class="text-xs text-slate-500 mt-3">Total a pagar: <b class="text-rose-600">${R$(up.reduce((s, x) => s + x.val, 0))}</b></p>` : '<p class="text-sm text-slate-400 py-6 text-center">Nada a vencer nos próximos 30 dias.</p>'}
                    <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700 text-xs text-slate-500 flex items-center gap-2 flex-wrap">Avisar com <input type="number" min="0" max="30" value="${P.remindDays}" onchange="plano().remindDays=Math.max(0,Math.min(30,parseInt(this.value)||0));saveAppData()" class="w-16 px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-center"> dia(s) de antecedência (aparece nos Avisos ao abrir o app).</div></div>
            </div>`;
        }

        // ---------- 5) Metas de economia ----------
        function plGoalSaved(g) { return (Number(g.initial) || 0) + (g.aportes || []).reduce((s, a) => s + (Number(a.amount) || 0), 0); }
        function plMonthsLeft(deadline) {
            if (!deadline) return 0;
            const t = localDateStr(), a = new Date(t + 'T00:00:00'), b = new Date(deadline + 'T00:00:00');
            return Math.max(0, (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + (b.getDate() >= a.getDate() ? 0 : -1) + 1);
        }
        function plAporteGoal(id) {

                <div class="grid grid-cols-2 gap-3"><div><label class="${LBL}">Valor (R$)</label><input id="pg-v" inputmode="decimal" required class="${INP}"></div><div><label class="${LBL}">Data</label><input id="pg-d" type="date" value="${localDateStr()}" class="${INP}"></div></div>
                <p class="text-[11px] text-slate-400">Use valor negativo para retirar.</p><button class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Salvar</button></form>`);
        }
        function plAporteSave(e, id) {
            e.preventDefault(); const g = plano().goals.find(x => x.id === id), v = recNum(document.getElementById('pg-v').value); if (!g || !v) return;

        function plAporteDel(gid, aid) { const g = plano().goals.find(x => x.id === gid); if (!g) return; g.aportes = g.aportes.filter(a => a.id !== aid); saveAppData(); renderCurrentTabContent(); }
        function plRenderMetas() {

                ${gs.length ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${gs.map(g => {
                    const saved = plGoalSaved(g), tgt = Number(g.target) || 0, pct = tgt > 0 ? saved / tgt * 100 : 0, ml = plMonthsLeft(g.deadline), falta = Math.max(0, tgt - saved), per = ml > 0 ? falta / ml : falta;
                    return `<div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-700">
                        <div class="flex justify-between items-start gap-2 mb-2"><div class="min-w-0"><p class="font-bold text-slate-800 dark:text-white truncate">${esc(g.name)}</p><p class="text-xs text-slate-500">${R$(saved)} de ${R$(tgt)} · prazo ${g.deadline ? fmtBR(g.deadline) : '—'}</p></div>${plEditBtns('goals', g.id)}</div>
                        <div class="h-3 rounded-full bg-slate-200 dark:bg-slate-600 overflow-hidden"><div class="h-full bg-teal-500" style="width:${Math.min(100, Math.max(2, pct))}%"></div></div>
                        <p class="text-[11px] text-slate-500 mt-1">${Math.round(pct)}% ${pct >= 100 ? '— meta batida! 🎉' : ''}</p>
                        ${pct < 100 ? `<p class="text-sm mt-2">${ml > 0 ? `Guardar <b class="text-teal-700 dark:text-teal-300">${R$(per)}</b> por mês durante ${ml} mês(es).` : '<span class="text-rose-600 font-bold">Prazo vencido — faltam ' + R$(falta) + '.</span>'}</p>` : ''}

                        ${(g.aportes || []).length ? `<div class="mt-2 max-h-24 overflow-y-auto text-[11px] text-slate-500 space-y-0.5">${g.aportes.slice().reverse().map(a => `<div class="flex justify-between"><span>${fmtBR(a.date)}</span><span>${R$(a.amount)} <button onclick="plAporteDel('${g.id}','${a.id}')" class="text-slate-300 hover:text-rose-600 ml-1"><i class="fa-solid fa-xmark"></i></button></span></div>`).join('')}</div>` : ''}
                    </div>`; }).join('')}</div>` : '<p class="text-sm text-slate-400 text-center py-8">Nenhuma meta. Crie uma reserva de emergência, uma viagem, a troca do carro…</p>'}</div>`;
        }

        // ---------- 7) Investimentos (% do CDI) ----------
        function plCdi() { try { const v = anLoad().cdi; const n = v ? parseFloat(String(v).replace('%', '').replace(',', '.')) : NaN; return isFinite(n) && n > 0 ? n : 14.9; } catch (e) { return 14.9; } }
        function plInvStats(iv) {
            const ap = (iv.aportes || []).filter(a => Number(a.amount) > 0), tot = ap.reduce((s, a) => s + Number(a.amount), 0), saldo = Number(iv.saldo) || 0;
            if (!tot) return { tot: 0, saldo, rend: 0, pct: null, cdiPct: null, days: 0 };
            const today = new Date(localDateStr() + 'T00:00:00').getTime(), avg = ap.reduce((s, a) => s + new Date(a.date + 'T00:00:00').getTime() * Number(a.amount), 0) / tot;
            const ref = iv.saldoDate ? new Date(iv.saldoDate + 'T00:00:00').getTime() : today;
            const days = Math.max(1, Math.round((ref - avg) / 86400000)), rent = saldo / tot - 1, cdiPer = Math.pow(1 + plCdi() / 100, days / 365) - 1;
            return { tot, saldo, rend: saldo - tot, pct: rent * 100, cdiPct: cdiPer > 0 && days >= 20 ? rent / cdiPer * 100 : null, days };
        }
        function plInvAporte(id) {
            const iv = plano().invests.find(x => x.id === id); if (!iv) return;
            showModal('Novo aporte · ' + esc(iv.name), `<form onsubmit="plInvAporteSave(event,'${id}')" class="space-y-3">

        function plRenderInvest() {
            const iv = plano().invests, tot = plInvTotal(), apl = iv.reduce((s, i) => s + plInvStats(i).tot, 0);
            return `<div class="${PL_CARD}"><div class="flex flex-wrap items-center justify-between gap-3 mb-3"><h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2"><i class="fa-solid fa-seedling text-teal-500"></i>Investimentos</h3><button onclick="plOpen('invests')" class="${PL_BTN}"><i class="fa-solid fa-plus mr-1"></i>Nova aplicação</button></div>
                <div class="grid grid-cols-3 gap-2 mb-4"><div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/40"><p class="text-[10px] uppercase font-bold text-slate-400">Saldo total</p><p class="font-bold text-slate-800 dark:text-white">${R$(tot + plPoupCards().reduce((x, p) => x + Math.max(0, p.saldo), 0))}</p></div>
                    <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/40"><p class="text-[10px] uppercase font-bold text-slate-400">Aplicado</p><p class="font-bold text-slate-800 dark:text-white">${R$(apl)}</p></div>
                    <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/40"><p class="text-[10px] uppercase font-bold text-slate-400">Rendimento</p><p class="font-bold ${tot - apl >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${R$(apl ? tot - apl : 0)}</p></div></div>
                ${plPoupCards().length ? `<div class="mb-4"><p class="text-[11px] font-bold uppercase text-slate-400 mb-2">Cartões poupança (saldo vem do menu Cartão)</p><div class="grid grid-cols-1 md:grid-cols-2 gap-3">${plPoupCards().map(p => `<div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/20 border border-emerald-100 dark:border-emerald-900"><p class="font-bold text-slate-800 dark:text-white truncate"><i class="fa-solid fa-piggy-bank text-emerald-600 mr-1"></i>${esc(p.a.name)}</p><p class="text-xs text-slate-500">Poupança · rende ~0,5% ao mês (estimativa)</p><p class="text-xl font-bold mt-1 text-slate-800 dark:text-white">${R$(p.saldo)}</p><p class="text-[11px] text-slate-500">≈ ${R$(Math.max(0, p.saldo) * 0.005)} por mês</p></div>`).join('')}</div><p class="text-[11px] text-slate-400 mt-1">Já contam no patrimônio em "Contas"; aqui somam só no total abaixo.</p></div>` : ''}
                ${iv.length ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${iv.map(i => { const s = plInvStats(i); return `<div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-700">
