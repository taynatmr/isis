                    <div id="nt-text-wrap" class="${kind === 'texto' ? '' : 'hidden'}"><label class="${LBL}">Texto</label><textarea id="nt-text" rows="8" class="${INP}">${esc(c.text || '')}</textarea></div>
                    <div id="nt-list-wrap" class="${kind === 'lista' ? '' : 'hidden'} space-y-2"><label class="${LBL}">Itens</label>
                        <div id="nt-items" class="space-y-2">${(c.items || []).map(noteItemRow).join('')}</div>
                        <button type="button" onclick="noteAddItem()" class="text-xs font-bold text-teal-600"><i class="fa-solid fa-plus mr-1"></i>Adicionar item</button></div>
                    <div><label class="${LBL}">Proteger com senha?</label><select id="nt-protect" onchange="notePwChange()" class="${INP}"><option value="nao" ${locked ? '' : 'selected'}>Não</option><option value="sim" ${locked ? 'selected' : ''}>Sim</option></select></div>
                    <div id="nt-pw-wrap" class="${locked ? '' : 'hidden'} space-y-3">
                        <div class="grid grid-cols-2 gap-3"><div><label class="${LBL}">${locked ? 'Nova senha' : 'Senha'}</label><input type="password" id="nt-pw" autocomplete="new-password" placeholder="${locked ? 'Em branco = manter' : 'Mín. 4 caracteres'}" class="${INP}"></div>
                        <div><label class="${LBL}">Repetir senha</label><input type="password" id="nt-pw2" autocomplete="new-password" class="${INP}"></div></div>
                        <p class="text-[11px] text-amber-600">Atenção: não há como recuperar a senha. Se esquecer, o conteúdo da nota não poderá ser aberto. O título continua visível na lista.</p></div>
                    <div class="flex gap-3"><button type="submit" class="flex-1 bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Salvar nota</button>
                    ${base ? `<button type="button" onclick="deleteNote('${id}')" class="px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-700 text-rose-600 text-sm font-bold"><i class="fa-solid fa-trash"></i></button>` : ''}</div>
                </form>`);
            if (!base) setTimeout(() => { const e = document.getElementById('nt-title'); if (e) e.focus(); }, 50);
        }
        async function saveNote(e) {
            e.preventDefault();
            const g = k => document.getElementById(k).value;
            const base = nEd.id ? notasData().find(n => n.id === nEd.id) : null;
            const kind = base ? base.kind : g('nt-kind');
            const payload = kind === 'lista'
                ? { text: '', items: Array.from(document.querySelectorAll('#nt-items .nt-row')).map(r => ({ t: r.querySelector('.nt-it').value.trim(), done: r.querySelector('.nt-done').checked })).filter(i => i.t) }
                : { text: g('nt-text'), items: [] };
            const protect = g('nt-protect') === 'sim';
            let pw = '';
            if (protect) {
                if (!nCryptoOk()) return;
                const np = g('nt-pw'), cp = g('nt-pw2');
                if (np) {
                    if (np.length < 4) { showToast('A senha precisa ter ao menos 4 caracteres.', 'warning'); return; }
                    if (np !== cp) { showToast('As senhas não conferem.', 'warning'); return; }
                    pw = np;
                } else pw = nEd.pw;
                if (!pw) { showToast('Defina uma senha para proteger a nota.', 'warning'); return; }
            }
            const n = base || { id: uid(), kind, created: Date.now() };
            n.title = g('nt-title').trim(); n.updated = Date.now();
            if (protect) { n.enc = await nEncrypt(payload, pw); n.locked = true; delete n.text; delete n.items; }
            else { n.locked = false; delete n.enc; n.text = payload.text; n.items = payload.items; }
            if (!base) notasData().push(n);
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast('Nota salva!', 'success');
        }
        function deleteNote(id) {
            if (!confirm('Excluir esta nota? Não dá para desfazer.')) return;
            appData.notas = notasData().filter(n => n.id !== id);
            saveAppData(); closeModal(); renderCurrentTabContent();
        }

        function contasData() {
            if (!appData.contas) appData.contas = { cards: [] };
            if (!Array.isArray(appData.contas.cards)) appData.contas.cards = [];
            return appData.contas.cards;
        }
        function isHabId(id) { return typeof id === 'string' && id.startsWith('hab:'); }
        function accById(id) {
            if (!id) return null;
            if (isHabId(id)) { const p = appData.habitacao.people.find(x => x.id === id.slice(4)); return p ? { id, name: 'Habitacional ' + p.name, type: 'hab' } : null; }
            return contasData().find(a => a.id === id);
        }
        function accLabel(a) { return a && a.type === 'hab' ? a.name : a ? `${a.name} (${a.type === 'poupanca' ? 'Poupança' : 'Débito'})` : ''; }
        function finCounted(id) { if (isHabId(id)) return false; const a = accById(id); return !(a && a.noSum); }

        // Efeito de um lançamento (receita / despesa) no total geral ou em uma conta específica
        function finEffect(t, acc) {
            const v = Number(t.amount) || 0, z = { r: 0, d: 0 };
            if (t.type === 'transferencia') {
                let out, inn;
                if (acc) { out = t.accId === acc; inn = t.toAccId === acc; }
                else { const co = finCounted(t.accId), ci = finCounted(t.toAccId); out = co && !ci; inn = ci && !co; }
                return { r: inn ? v : 0, d: out ? v : 0 };
            }
            if (acc ? t.accId !== acc : !finCounted(t.accId)) return z;
            return t.type === 'receita' ? { r: v, d: 0 } : { r: 0, d: v };
        }

        // ---------- Status ----------
        function finSt(t) { const s = t.status || 'pago'; if (s === 'pendente') return 'pendente'; return t.type === 'receita' ? 'recebido' : 'pago'; }
        function finStLabel(t) { const s = finSt(t); return s === 'pendente' ? 'Pendente' : s === 'recebido' ? 'Recebido' : (t.type === 'transferencia' ? 'Efetuada' : 'Pago'); }
        function finStCls(t) { const s = finSt(t); return s === 'pendente' ? 'bg-amber-100 text-amber-700' : s === 'recebido' ? 'bg-sky-100 text-sky-700' : 'bg-emerald-100 text-emerald-700'; }
        function finStatusOpts(type, st) {
            const done = type === 'receita' ? ['recebido', 'Recebido'] : ['pago', type === 'transferencia' ? 'Efetuada' : 'Pago'];
            const cur = st === 'pendente' ? 'pendente' : 'ok';
            return `<option value="${done[0]}" ${cur === 'ok' ? 'selected' : ''}>${done[1]}</option><option value="pendente" ${cur === 'pendente' ? 'selected' : ''}>Pendente</option>`;
        }
        function finAccHtml(t) {
            const cs = contasData();
            const isT = t.type === 'transferencia';
            const opt = v => finAccOpts(v, isT);
            return `<div class="grid grid-cols-2 gap-4">
                <div><label class="${LBL}" id="fin-acc-lbl">${isT ? 'Conta de origem' : 'Cartão / Conta'}</label><select id="fin-acc" class="${INP}">${opt(t.accId || '')}</select></div>
                <div id="fin-to-wrap" class="${isT ? '' : 'hidden'}"><label class="${LBL}">Conta de destino</label><select id="fin-to" class="${INP}">${opt(t.toAccId || '')}</select></div>
            </div>${cs.length ? '' : '<p class="text-[11px] text-amber-600 -mt-2">Nenhum cartão cadastrado ainda. Cadastre no menu "Cartão".</p>'}`;
        }
        function finAccOpts(v, isT) {
            const cs = contasData();
            let h = `<option value="">— Sem cartão/conta —</option>` + cs.map(a => `<option value="${a.id}" ${v === a.id ? 'selected' : ''}>${esc(accLabel(a))}</option>`).join('');
            if (isT) h += `<optgroup label="Habitacional (Fundo de Obra)">` + appData.habitacao.people.map(p => { const id = 'hab:' + p.id; return `<option value="${id}" ${v === id ? 'selected' : ''}>Habitacional ${esc(p.name)}</option>`; }).join('') + `</optgroup>`;
            return h;
        }
        function finTypeChange() {
            const ty = document.getElementById('fin-type').value;
            const sel = document.getElementById('fin-status');
            sel.innerHTML = finStatusOpts(ty, sel.value === 'pendente' ? 'pendente' : 'ok');
            ['fin-acc', 'fin-to'].forEach(i => { const el = document.getElementById(i); let v = el.value; if (ty !== 'transferencia' && isHabId(v)) v = ''; el.innerHTML = finAccOpts(v, ty === 'transferencia'); });
            document.getElementById('fin-to-wrap').classList.toggle('hidden', ty !== 'transferencia');
            document.getElementById('fin-acc-lbl').textContent = ty === 'transferencia' ? 'Conta de origem' : 'Cartão / Conta';
            const c = document.getElementById('fin-category');
            if (ty === 'transferencia' && !c.value.trim()) c.value = 'Transferência';
        }

        // ---------- Tela Financeiro (filtro geral) ----------
        function finSet(k, v) { finF[k] = v; renderCurrentTabContent(); }
        function finClear() { finF = { acc: '', cat: '', type: '', min: '', max: '', q: '' }; financeFilterDate = ''; financeFilterStatus = 'todos'; renderCurrentTabContent(); }
        function finFiltered() {
            const f = finF;
            return appData.financeiro.transactions.filter(t => {
                if (financeFilterDate && !(t.date && t.date.startsWith(financeFilterDate))) return false;
                if (financeFilterStatus !== 'todos' && finSt(t) !== financeFilterStatus) return false;
                if (f.acc && t.accId !== f.acc && t.toAccId !== f.acc) return false;
                if (f.cat && (t.category || '') !== f.cat) return false;
                if (f.type && t.type !== f.type) return false;
                const a = Number(t.amount) || 0;
                if (f.min !== '' && a < Number(f.min)) return false;
                if (f.max !== '' && a > Number(f.max)) return false;
                if (f.q && !normKey((t.desc || '') + ' ' + (t.category || '')).includes(normKey(f.q))) return false;
                return true;
            }).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        }
        function renderFinanceiro(container) {
            const list = finFiltered();
            let tr = 0, td = 0, tp = 0;
            list.forEach(t => {
                const e = finEffect(t, finF.acc);

                if (finSt(t) === 'pendente') tp += e.r + e.d;
            });
            const saldo = tr - td;
            const cats = [...new Set(appData.financeiro.transactions.map(t => t.category).filter(Boolean))].sort();
            const o = (v, l, cur) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(l)}</option>`;

            const card = (l, v, c) => `<div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700"><p class="text-xs font-semibold text-slate-400 uppercase">${l}</p><h3 class="text-2xl font-bold ${c} mt-1">R$ ${money(v)}</h3></div>`;
            container.innerHTML = `
                <div class="space-y-6 max-w-7xl mx-auto">
                    <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-3">
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            <span class="text-xs font-bold text-slate-500 uppercase"><i class="fa-solid fa-filter mr-1"></i> Filtro geral</span>
                            <div class="flex gap-2">
                                <button onclick="finClear()" class="text-xs text-teal-600 dark:text-teal-400 font-semibold underline">Ver movimentação geral (limpar filtros)</button>
                                <button onclick="openFinanceModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow flex items-center space-x-2"><i class="fa-solid fa-plus"></i><span>Inserir Transação</span></button>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <input type="month" value="${financeFilterDate}" onchange="changeFinanceFilter(this.value)" title="Mês" class="${S}">
                            <select onchange="finSet('acc',this.value)" class="${S}"><option value="">Todos os bancos/cartões</option>${contasData().map(a => o(a.id, accLabel(a), finF.acc)).join('')}</select>
                            <select onchange="finSet('cat',this.value)" class="${S}"><option value="">Todas as categorias</option>${cats.map(c => o(c, c, finF.cat)).join('')}</select>
                            <select onchange="finSet('type',this.value)" class="${S}">${o('', 'Receitas e despesas', finF.type)}${o('receita', 'Só receitas', finF.type)}${o('despesa', 'Só despesas', finF.type)}${o('transferencia', 'Só transferências', finF.type)}</select>
                            <select onchange="changeFinanceStatusFilter(this.value)" class="${S}">${o('todos', 'Todos os status', financeFilterStatus)}${o('pago', 'Pagos', financeFilterStatus)}${o('recebido', 'Recebidos', financeFilterStatus)}${o('pendente', 'Pendentes', financeFilterStatus)}</select>
                            <input type="number" step="0.01" min="0" placeholder="Valor mín." value="${finF.min}" onchange="finSet('min',this.value)" class="${S} w-28">
                            <input type="number" step="0.01" min="0" placeholder="Valor máx." value="${finF.max}" onchange="finSet('max',this.value)" class="${S} w-28">
                            <input type="text" placeholder="Buscar descrição..." value="${esc(finF.q)}" onchange="finSet('q',this.value)" class="${S} w-44">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        ${card('Receitas', tr, 'text-emerald-600')}${card('Despesas', td, 'text-rose-600')}${card('Saldo do Período', saldo, saldo >= 0 ? 'text-teal-600' : 'text-rose-600')}${card('Pendente', tp, 'text-amber-600')}
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
                        <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-4 flex items-center space-x-2"><i class="fa-solid fa-wallet text-teal-500"></i><span>Lançamentos Financeiros</span><span class="text-xs font-normal text-slate-400">(${list.length})</span></h3>
                        ${list.length === 0 ? `<div class="text-center py-12 text-slate-400"><i class="fa-solid fa-receipt text-4xl mb-2"></i><p class="text-sm">Nenhuma transação encontrada para este filtro.</p></div>` : `
                        <div class="overflow-x-auto"><table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 dark:bg-slate-700/50 text-slate-400 uppercase text-[11px]"><tr>
                                <th class="p-3.5 rounded-l-xl">Descrição</th><th class="p-3.5">Categoria</th><th class="p-3.5">Cartão/Conta</th><th class="p-3.5">Data</th><th class="p-3.5">Valor</th><th class="p-3.5">Status</th><th class="p-3.5">Anexos</th><th class="p-3.5 text-right rounded-r-xl">Ações</th>
                            </tr></thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                            ${list.map(t => {
                                const isT = t.type === 'transferencia', nAtt = (t.attachments || []).length;
                                const a1 = accById(t.accId), a2 = accById(t.toAccId);
                                const acc = isT ? `${a1 ? esc(a1.name) : '—'} <i class="fa-solid fa-arrow-right text-[9px] mx-0.5"></i> ${a2 ? esc(a2.name) : '—'}` : (a1 ? esc(a1.name) : '<span class="text-slate-300">—</span>');
                                const ef = isT ? finEffect(t, finF.acc) : null;
                                const tDir = isT ? (ef.d > 0 ? 'out' : ef.r > 0 ? 'in' : 'mid') : '';
                                const vc = tDir === 'mid' ? 'text-sky-600' : (tDir === 'in' || (!isT && t.type === 'receita')) ? 'text-emerald-600' : 'text-rose-600';
                                const sg = tDir === 'mid' ? '⇄' : (tDir === 'in' || (!isT && t.type === 'receita')) ? '+' : '-';
                                return `<tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/30">
                                    <td class="p-3.5 font-medium text-slate-800 dark:text-white">${esc(t.desc)}
                                        ${t.cardInvoice ? `<span class="ml-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700"><i class="fa-solid fa-credit-card mr-1"></i>fatura</span>` : ''}
                                        ${t.installment ? `<span class="ml-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700">${t.installment.n}/${t.installment.total}</span>` : ''}
                                        ${isT ? `<span class="ml-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded bg-sky-100 text-sky-700">transf.</span>` : ''}</td>

                                    <td class="p-3.5 text-xs text-slate-500 whitespace-nowrap">${acc}</td>
                                    <td class="p-3.5 text-slate-500 whitespace-nowrap">${fmtBR(t.date)}</td>

                                    <td class="p-3.5"><button onclick="toggleFinanceStatus('${t.id}')" title="Clique para alternar entre ${t.type === 'receita' ? 'Recebido' : 'Pago'} e Pendente" class="px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap ${finStCls(t)}"><i class="fa-solid ${finSt(t) === 'pendente' ? 'fa-clock' : 'fa-circle-check'} mr-1"></i>${finStLabel(t)}</button></td>
                                    <td class="p-3.5"><button onclick="openAttachmentsModal('${t.id}')" title="Anexos" class="px-2.5 py-1 rounded-lg text-xs font-semibold whitespace-nowrap ${nAtt ? 'bg-teal-100 dark:bg-teal-900 text-teal-700 dark:text-teal-300' : 'bg-slate-100 dark:bg-slate-700 text-slate-500'}"><i class="fa-solid fa-paperclip mr-1"></i>${nAtt || 'Anexar'}</button></td>
                                    <td class="p-3.5 text-right space-x-1 whitespace-nowrap">
                                        <button onclick="editFinance('${t.id}')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="deleteFinance('${t.id}')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-lg text-xs hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                                    </td></tr>`;
                            }).join('')}
                            </tbody></table></div>`}
                    </div>
                </div>`;
        }
        function toggleFinanceStatus(id) {
            const t = appData.financeiro.transactions.find(x => x.id === id);
            if (!t) return;
            t.status = finSt(t) === 'pendente' ? (t.type === 'receita' ? 'recebido' : 'pago') : 'pendente';
            saveAppData(); renderCurrentTabContent();
        }

        // ---------- Menu "Cartão" (débito e poupança) ----------
        function renderContas(container) {
            const cs = contasData();
            if (!cs.find(a => a.id === contaSel)) contaSel = cs[0] ? cs[0].id : null;
            const a = accById(contaSel);
            let body = '';
            if (!cs.length) {
                body = `<div class="text-center py-16 text-slate-400"><i class="fa-regular fa-credit-card text-5xl mb-3"></i><p class="text-sm">Nenhum cartão cadastrado. Cadastre um cartão de débito ou poupança para ligá-lo ao Financeiro.</p></div>`;
            } else {
                const txs = appData.financeiro.transactions.filter(t => t.accId === a.id || t.toAccId === a.id).sort((x, y) => (y.date || '').localeCompare(x.date || ''));
                let rec = 0, des = 0, saldo = 0, prev = 0;
                txs.forEach(t => {
                    const e = finEffect(t, a.id); rec += e.r; des += e.d;
                    if (finSt(t) === 'pendente') prev += e.r - e.d; else saldo += e.r - e.d;
                });
                const k = (l, v, c) => `<div class="bg-slate-50 dark:bg-slate-700/40 rounded-2xl p-4"><p class="text-[11px] font-semibold text-slate-400 uppercase">${l}</p><p class="text-xl font-bold ${c} mt-1">R$ ${money(v)}</p></div>`;
                body = `
                <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 space-y-5">

                            ${a.noSum ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-700 ml-1">fora da soma da tela inicial</span>' : ''}</h3>
                            <p class="text-xs text-slate-500 mt-1">Nº ${esc(a.number)} · Agência ${esc(a.agency)} · Conta ${esc(a.account)}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openFinanceModal(); setTimeout(()=>{const s=document.getElementById('fin-acc'); if(s) s.value='${a.id}';},30)" class="bg-teal-600 text-white px-3 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>Lançar no Financeiro</button>
                            <button onclick="openContaModal('${a.id}')" class="px-3 py-2 bg-slate-100 dark:bg-slate-700 rounded-xl text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteConta('${a.id}')" class="px-3 py-2 bg-slate-100 dark:bg-slate-700 rounded-xl text-xs hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${k('Saldo atual', saldo, saldo >= 0 ? 'text-teal-600' : 'text-rose-600')}${k('Previsto (pendentes)', prev, 'text-amber-600')}${k('Entradas', rec, 'text-emerald-600')}${k('Saídas', des, 'text-rose-600')}</div>
                    <p class="text-[11px] text-slate-400">Os lançamentos abaixo vêm da tela Financeiro (campo "Cartão / Conta"). Para alterar, edite lá.</p>
                    ${txs.length === 0 ? '<p class="text-sm text-slate-400 text-center py-6">Nenhum lançamento ligado a este cartão.</p>' : `
                    <div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="text-slate-400 uppercase text-[11px]"><tr><th class="p-2">Data</th><th class="p-2">Descrição</th><th class="p-2">Categoria</th><th class="p-2">Valor</th><th class="p-2">Status</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                    ${txs.map(t => { const e = finEffect(t, a.id), v = e.r - e.d; return `<tr><td class="p-2 text-slate-500 whitespace-nowrap">${fmtBR(t.date)}</td><td class="p-2 font-medium text-slate-800 dark:text-white">${esc(t.desc)}${t.type === 'transferencia' ? ' <span class="text-[10px] px-1.5 py-0.5 rounded bg-sky-100 text-sky-700 font-bold">transf.</span>' : ''}</td><td class="p-2">${esc(t.category)}</td><td class="p-2 font-bold whitespace-nowrap ${v >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${v >= 0 ? '+' : '-'} R$ ${money(Math.abs(v))}</td><td class="p-2"><span class="px-2 py-0.5 rounded-md text-xs font-bold ${finStCls(t)}">${finStLabel(t)}</span></td></tr>`; }).join('')}
                    </tbody></table></div>`}
                </div>`;
            }
            container.innerHTML = `<div class="space-y-6 max-w-7xl mx-auto">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-wrap items-center justify-between gap-3">
                    <div class="flex flex-wrap gap-2">${cs.map(c => `<button onclick="contaSel='${c.id}';renderCurrentTabContent()" class="px-3 py-1.5 rounded-xl text-xs font-bold ${c.id === contaSel ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}"><i class="fa-solid ${c.type === 'poupanca' ? 'fa-piggy-bank' : 'fa-credit-card'} mr-1"></i>${esc(c.name)}</button>`).join('')}</div>
                    <button onclick="openContaModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow flex items-center space-x-2"><i class="fa-solid fa-plus"></i><span>Novo cartão</span></button>
                </div>${body}</div>`;
        }
        function openContaModal(id = null) {
            const c = id ? accById(id) : { name: '', number: '', agency: '', account: '', type: 'debito', noSum: false };
            showModal(id ? 'Editar cartão' : 'Novo cartão (débito / poupança)', `
                <form onsubmit="saveConta(event,'${id || ''}')" class="space-y-4">
                    <div><label class="${LBL}">Nome *</label><input id="ct-name" required value="${esc(c.name)}" placeholder="Ex: Nubank, Caixa Poupança" class="${INP}"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="${LBL}">Tipo *</label><select id="ct-type" required class="${INP}"><option value="debito" ${c.type === 'debito' ? 'selected' : ''}>Débito</option><option value="poupanca" ${c.type === 'poupanca' ? 'selected' : ''}>Poupança</option></select></div>
                        <div><label class="${LBL}">Número *</label><input id="ct-number" required inputmode="numeric" value="${esc(c.number)}" class="${INP}"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="${LBL}">Agência *</label><input id="ct-agency" required value="${esc(c.agency)}" class="${INP}"></div>
                        <div><label class="${LBL}">Conta *</label><input id="ct-account" required value="${esc(c.account)}" class="${INP}"></div>
                    </div>
                    <label class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300"><input type="checkbox" id="ct-nosum" ${c.noSum ? 'checked' : ''}> Não contabilizar o valor na tela inicial</label>
                    <button type="submit" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Salvar cartão</button>
                </form>`);
        }
        function saveConta(e, id) {
            e.preventDefault();
            const v = k => document.getElementById(k).value.trim();
            const data = { name: v('ct-name'), type: v('ct-type'), number: v('ct-number'), agency: v('ct-agency'), account: v('ct-account'), noSum: document.getElementById('ct-nosum').checked };
            if (id) Object.assign(accById(id), data);
            else { const c = Object.assign({ id: uid() }, data); contasData().push(c); contaSel = c.id; }
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast('Cartão salvo!', 'success');
        }
        function deleteConta(id) {
            if (!confirm('Excluir este cartão? Os lançamentos do Financeiro continuam, apenas ficam sem cartão ligado.')) return;
            appData.financeiro.transactions.forEach(t => { if (t.accId === id) t.accId = ''; if (t.toAccId === id) t.toAccId = ''; });
            appData.contas.cards = contasData().filter(a => a.id !== id);
            if (dashAcc === id) dashAcc = '';
            if (finF.acc === id) finF.acc = '';
            saveAppData(); renderCurrentTabContent();
        }

        // ---------- Tela inicial: situação financeira com filtros + cartão de crédito ----------
        function finDash() {
            let r = 0, d = 0;
            appData.financeiro.transactions.forEach(t => { const e = finEffect(t, dashAcc); r += e.r; d += e.d; });
            return { r, d, value: dashMode === 'receita' ? r : dashMode === 'despesa' ? d : r - d };
        }
        function dashSet(k, v) { if (k === 'acc') dashAcc = v; else dashMode = v; renderCurrentTabContent(); }
        function finDashHtml() {
            const f = finDash();
            const lbl = { saldo: 'Saldo Financeiro', receita: 'Receitas', despesa: 'Despesas' }[dashMode];
            const col = dashMode === 'receita' ? 'text-emerald-600' : dashMode === 'despesa' ? 'text-rose-600' : (f.value >= 0 ? 'text-emerald-600' : 'text-rose-600');
            const S = 'px-1.5 py-0.5 rounded-md border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-[10px] max-w-[120px]';
            return `<p class="text-xs font-medium text-slate-400 uppercase">${lbl}</p>
                <h3 class="text-xl font-bold ${col} mt-1">R$ ${money(f.value)}</h3>
                <div class="mt-1.5 flex flex-wrap gap-1">
                    <select onchange="dashSet('acc',this.value)" class="${S}"><option value="">Total geral</option>${contasData().map(a => `<option value="${a.id}" ${dashAcc === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
                    <select onchange="dashSet('mode',this.value)" class="${S}"><option value="saldo" ${dashMode === 'saldo' ? 'selected' : ''}>Saldo final</option><option value="receita" ${dashMode === 'receita' ? 'selected' : ''}>Só receita</option><option value="despesa" ${dashMode === 'despesa' ? 'selected' : ''}>Só despesa</option></select>
                </div>`;
        }
        function dashCreditHtml() {
            const tx = appData.financeiro.transactions.filter(t => t.cardInvoice);
            const sum = a => a.reduce((s, t) => s + (Number(t.amount) || 0), 0);
            const open = sum(tx.filter(t => (t.status || 'pago') === 'pendente'));
            const mk = localDateStr().slice(0, 7);
            const month = sum(tx.filter(t => t.cardInvoice.inv === mk));
            return `<div onclick="switchTab('cartao')" class="cursor-pointer bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-between">
                <div><p class="text-xs font-medium text-slate-400 uppercase">Cartão de Crédito</p>
                <h3 class="text-xl font-bold text-rose-600 mt-1">R$ ${money(open)}</h3>
                <p class="text-[10px] text-slate-400 mt-1">Faturas em aberto · fatura do mês: R$ ${money(month)}</p></div>
                <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-500 flex items-center justify-center text-xl"><i class="fa-solid fa-credit-card"></i></div></div>`;
        }

        // ---------- Agenda: repetição, dia todo e calendário ----------
        function agOcc(it, ds) {
            if (!it.date || ds < it.date) return false;
            if (it.until && ds > it.until) return false;
            const r = it.repeat;
            if (!r || !r.freq || r.freq === 'none') return ds === it.date;
            const a = new Date(it.date + 'T00:00:00'), b = new Date(ds + 'T00:00:00');
            const days = Math.round((b - a) / 864e5);
            let n = 1, unit = r.freq;
            if (r.freq === 'custom') { n = Math.max(1, Number(r.every) || 1); unit = r.unit || 'day'; }
            if (unit === 'daily' || unit === 'day') return days % n === 0;
            if (unit === 'weekly' || unit === 'week') {
                const wd = (r.days && r.days.length) ? r.days : [a.getDay()];
                return wd.includes(b.getDay()) && Math.floor((days + a.getDay()) / 7) % n === 0;
            }
            if (unit === 'monthly' || unit === 'month') {
                const mo = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
                const lastB = new Date(b.getFullYear(), b.getMonth() + 1, 0).getDate();
                return mo % n === 0 && b.getDate() === Math.min(a.getDate(), lastB);
            }
            if (unit === 'yearly' || unit === 'year') {
                const yr = b.getFullYear() - a.getFullYear();
                return yr % n === 0 && b.getMonth() === a.getMonth() && b.getDate() === a.getDate();
            }
            return ds === it.date;
        }
        function agRepeatLabel(it) {
            const r = it.repeat; if (!r || !r.freq || r.freq === 'none') return '';
            const m = { daily: 'Diário', weekly: 'Semanal', monthly: 'Mensal', yearly: 'Anual' };
            const u = { day: 'dia(s)', week: 'semana(s)', month: 'mês(es)', year: 'ano(s)' };
            return ' · 🔁 ' + (r.freq === 'custom' ? `A cada ${r.every} ${u[r.unit] || ''}` : m[r.freq]);
        }
        function agDay(ds) {
            return appData.agenda.filter(a => a.status !== 'Finalizado' && agOcc(a, ds))
                .sort((x, y) => (x.allDay ? '' : (x.time || '')).localeCompare(y.allDay ? '' : (y.time || '')));
        }
        function agViewToggle() {
            const b = (v, i, l) => `<button onclick="agSetView('${v}')" class="px-3 py-1.5 text-xs font-bold ${agView === v ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}"><i class="fa-solid ${i} mr-1"></i>${l}</button>`;
            return `<div class="inline-flex rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700">${b('calendario', 'fa-calendar-days', 'Calendário')}${b('lista', 'fa-list', 'Lista')}</div>`;
        }
        function agSetView(v) { agView = v; renderCurrentTabContent(); }
        function agNav(d) { agMonth = ymAdd(agMonth, d); renderCurrentTabContent(); }
        function agPick(ds) { agSel = ds; renderCurrentTabContent(); }
        function agToday() { agMonth = localDateStr().slice(0, 7); agSel = localDateStr(); renderCurrentTabContent(); }
        function renderAgendaCal(container) {
            const [y, m] = agMonth.split('-').map(Number);
            const start = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate(), today = localDateStr();
            let cells = '';
            for (let i = 0; i < start; i++) cells += '<div></div>';
            for (let d = 1; d <= dim; d++) {
                const ds = `${agMonth}-${pad2(d)}`, ev = agDay(ds), isT = ds === today, isS = ds === agSel;
                cells += `<button onclick="agPick('${ds}')" class="min-h-[56px] sm:min-h-[92px] p-1 rounded-xl border text-left flex flex-col gap-0.5 bg-white dark:bg-slate-800 ${isS ? 'border-teal-500 ring-2 ring-teal-300' : 'border-slate-200 dark:border-slate-700'}">
                    <span class="text-[11px] font-bold ${isT ? 'bg-teal-600 text-white rounded-full w-5 h-5 flex items-center justify-center' : 'text-slate-500'}">${d}</span>
                    ${ev.slice(0, 3).map(a => `<span class="hidden sm:block truncate text-[10px] px-1 rounded ${a.allDay ? 'bg-amber-100 text-amber-800' : 'bg-teal-100 text-teal-800'}">${a.allDay ? '' : (a.time || '') + ' '}${esc(a.title)}</span>`).join('')}
                    ${ev.length ? '<span class="sm:hidden w-1.5 h-1.5 rounded-full bg-teal-500"></span>' : ''}
                    ${ev.length > 3 ? `<span class="hidden sm:block text-[10px] text-slate-400">+${ev.length - 3}</span>` : ''}</button>`;
            }
            const sel = agDay(agSel);
            container.innerHTML = `<div class="space-y-5 max-w-7xl mx-auto">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-wrap items-center justify-between gap-3">
                    ${agViewToggle()}
                    <div class="flex items-center gap-2">
                        <button onclick="agNav(-1)" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700"><i class="fa-solid fa-chevron-left"></i></button>
                        <span class="font-bold text-sm text-slate-800 dark:text-white min-w-[140px] text-center capitalize">${fmtYM(agMonth)}</span>
                        <button onclick="agNav(1)" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700"><i class="fa-solid fa-chevron-right"></i></button>
                        <button onclick="agToday()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-bold">Hoje</button>
                    </div>
                    <button onclick="openAgendaModal(null,'${agSel}')" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow flex items-center space-x-2"><i class="fa-solid fa-plus"></i><span>Inserir Compromisso</span></button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400 uppercase">${['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(x => `<div>${x}</div>`).join('')}</div>
                <div class="grid grid-cols-7 gap-1">${cells}</div>
                <div class="space-y-3"><h3 class="font-bold text-sm text-slate-500 uppercase tracking-wider">${fmtBR(agSel)}</h3>
                    ${sel.length ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${sel.map(i => renderAgendaCard(i, false)).join('')}</div>` : '<p class="text-sm text-slate-400">Nenhum compromisso neste dia.</p>'}</div>
            </div>`;
        }
        function openAgendaModal(id = null, dflt = '') {
            let it = { title: '', date: dflt || (agView === 'calendario' ? agSel : localDateStr()), time: '09:00', allDay: false, repeat: { freq: 'none', every: 1, unit: 'day', days: [] }, until: '', address: '', desc: '', status: 'Ativo' };
            if (id) it = Object.assign({}, it, appData.agenda.find(a => a.id === id) || {});
            const r = Object.assign({ freq: 'none', every: 1, unit: 'day', days: [] }, it.repeat || {});
            const fo = (v, l) => `<option value="${v}" ${r.freq === v ? 'selected' : ''}>${l}</option>`;
            const uo = (v, l) => `<option value="${v}" ${r.unit === v ? 'selected' : ''}>${l}</option>`;
            showModal(id ? 'Editar Compromisso' : 'Inserir Compromisso', `
                <form onsubmit="saveAgenda(event,'${id || ''}')" class="space-y-4">
                    <div><label class="${LBL}">Título</label><input type="text" id="ag-title" value="${esc(it.title)}" required class="${INP}"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="${LBL}">Data</label><input type="date" id="ag-date" value="${it.date}" required class="${INP}"></div>
                        <div><div class="flex items-center justify-between mb-1"><label class="text-xs font-semibold text-slate-500 uppercase">Horário</label>
                            <label class="flex items-center gap-1 text-[11px] text-slate-500"><input type="checkbox" id="ag-allday" ${it.allDay ? 'checked' : ''} onchange="agAllDayChange()"> dia todo</label></div>
                            <input type="time" id="ag-time" value="${it.time || ''}" ${it.allDay ? 'disabled' : ''} class="${INP}"></div>
                    </div>
                    <div><label class="${LBL}">Repetição</label>
                        <select id="ag-freq" onchange="agRepChange()" class="${INP}">${fo('none', 'Não repete')}${fo('daily', 'Diária')}${fo('weekly', 'Semanal')}${fo('monthly', 'Mensal')}${fo('yearly', 'Anual')}${fo('custom', 'A cada...')}</select></div>
                    <div id="ag-wd-wrap" class="${r.freq === 'weekly' ? '' : 'hidden'}"><label class="${LBL}">Dias da semana</label><div class="flex gap-1.5">
                        ${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((l, i) => `<label class="flex flex-col items-center text-[11px] text-slate-500 gap-0.5"><input type="checkbox" class="ag-wd" value="${i}" ${(r.days || []).includes(i) ? 'checked' : ''}>${l}</label>`).join('')}</div>
                        <p class="text-[11px] text-slate-400 mt-1">Sem marcar nada, repete no dia da semana da data escolhida.</p></div>
                    <div id="ag-custom-wrap" class="${r.freq === 'custom' ? '' : 'hidden'} grid grid-cols-2 gap-4">
                        <div><label class="${LBL}">A cada</label><input type="number" min="1" id="ag-every" value="${r.every || 1}" class="${INP}"></div>
                        <div><label class="${LBL}">Unidade</label><select id="ag-unit" class="${INP}">${uo('day', 'dia(s)')}${uo('week', 'semana(s)')}${uo('month', 'mês(es)')}${uo('year', 'ano(s)')}</select></div></div>
                    <div id="ag-until-wrap" class="${r.freq === 'none' ? 'hidden' : ''}"><label class="${LBL}">Repetir até (opcional)</label><input type="date" id="ag-until" value="${it.until || ''}" class="${INP}"></div>
                    <div><label class="${LBL}">Local</label><input type="text" id="ag-address" value="${esc(it.address || '')}" class="${INP}"></div>
                    <div><label class="${LBL}">Descrição</label><textarea id="ag-desc" rows="2" class="${INP}">${esc(it.desc || '')}</textarea></div>
                    <button type="submit" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Salvar</button>
                </form>`);
        }
        function agAllDayChange() { document.getElementById('ag-time').disabled = document.getElementById('ag-allday').checked; }
        function agRepChange() {
            const f = document.getElementById('ag-freq').value;
            document.getElementById('ag-wd-wrap').classList.toggle('hidden', f !== 'weekly');
            document.getElementById('ag-custom-wrap').classList.toggle('hidden', f !== 'custom');
            document.getElementById('ag-until-wrap').classList.toggle('hidden', f === 'none');
        }
        function saveAgenda(e, id) {
            e.preventDefault();
            const g = k => document.getElementById(k).value;
            const allDay = document.getElementById('ag-allday').checked, freq = g('ag-freq');
            const data = {
                title: g('ag-title'), date: g('ag-date'), allDay, time: allDay ? '' : g('ag-time'),
                address: g('ag-address'), desc: g('ag-desc'),
                repeat: { freq, every: Math.max(1, Number(g('ag-every')) || 1), unit: g('ag-unit'), days: Array.from(document.querySelectorAll('.ag-wd:checked')).map(c => Number(c.value)) },
                until: freq === 'none' ? '' : g('ag-until')
            };
            if (id) { const ag = appData.agenda.find(x => x.id === id); if (ag) Object.assign(ag, data); }
            else appData.agenda.push(Object.assign({ id: Date.now().toString(), status: 'Ativo' }, data));
            if (data.date) { agSel = data.date; agMonth = data.date.slice(0, 7); }
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast('Salvo!', 'success');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = "bg-emerald-600 text-white";
            if (type === 'error') bgClass = "bg-rose-600 text-white";
            if (type === 'warning') bgClass = "bg-amber-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl text-xs font-bold flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.onload = async function() {
            loadAppData();
            applyColors(getColors());
            if (appData.profile.theme === 'dark') document.documentElement.classList.add('dark');
            switchTab('dashboard');
            await initBackupFolder();
            initDrive();
        };
    </script>
<script>if(window.innerWidth<768){var _sb=document.getElementById('sidebar');if(_sb)_sb.classList.add('-translate-x-full');}</script>
