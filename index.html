            if (hobbyCat) filteredHobbies = filteredHobbies.filter(h => normKey(h.category) === normKey(hobbyCat));
            const fbtn = (k, l) => `<button onclick="setHobbyFilter('${k}')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${hobbyFilter === k ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">${l}</button>`;
            const S = 'px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs';

            container.innerHTML = `
                <div class="space-y-6 max-w-7xl mx-auto">
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
                        <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-xs font-bold text-slate-500 uppercase"><i class="fa-solid fa-filter mr-1"></i> Filtro:</span>
                                ${fbtn('todos', 'Todos')}${fbtn('ativos', 'Somente Ativos')}${fbtn('finalizados', 'Finalizados')}
                                <select onchange="setHobbyCat(this.value)" title="Filtrar por categoria" class="${S}">
                                    <option value="">Todas as categorias</option>
                                    ${cats.map(c => `<option value="${esc(c)}" ${normKey(c) === normKey(hobbyCat) ? 'selected' : ''}>${esc(c)}</option>`).join('')}
                                </select>
                            </div>
                            <div class="flex flex-wrap items-center gap-2">
                                <button onclick="openRec()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow flex items-center space-x-2"><i class="fa-solid fa-utensils"></i><span>Receitas</span></button>
                                <button onclick="openHobbyModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow flex items-center space-x-2">
                                <i class="fa-solid fa-plus"></i>
                                <span>Inserir Hobby / Projeto</span>
                            </button>
                            </div>
                        </div>

                        ${filteredHobbies.length === 0 ? `
                            <div class="text-center py-12 text-slate-400">
                                <i class="fa-solid fa-lightbulb text-4xl mb-2"></i>
                                <p class="text-sm">Nenhum hobby encontrado nesta visualização.</p>
                            </div>
                        ` : `
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                ${filteredHobbies.map(h => {
                                    const atts = h.attachments || [];
                                    const isImg = a => (a.type || '').startsWith('image/');
                                    const imgs = atts.filter(isImg), others = atts.filter(a => !isImg(a));
                                    return `
                                    <div class="p-5 rounded-2xl bg-slate-50 dark:bg-slate-700/50 border border-slate-100 dark:border-slate-700 flex flex-col justify-between">
                                        <div>
                                            <div class="flex justify-between items-start mb-2">
                                                <span class="text-xs font-bold px-2.5 py-1 rounded-lg ${h.status === 'Finalizado' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${esc(h.status)}</span>
                                                <div class="space-x-1">
                                                    <button onclick="editHobby('${h.id}')" class="p-1.5 bg-white dark:bg-slate-800 rounded-lg shadow-sm text-xs"><i class="fa-solid fa-pen"></i></button>
                                                    <button onclick="deleteHobby('${h.id}')" class="p-1.5 bg-white dark:bg-slate-800 rounded-lg shadow-sm text-xs hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                                                </div>
                                            </div>
                                            <h4 class="font-bold text-slate-800 dark:text-white text-base mb-1">${esc(h.title)}</h4>
                                            <p class="text-xs text-teal-600 dark:text-teal-400 font-semibold mb-1">${esc(h.category)}</p>
                                            ${Number(h.rating) > 0 ? `<div class="text-xs mb-2 flex items-center gap-0.5" title="Nota ${h.rating} de 5">${starsHtml(h.rating)}</div>` : ''}
                                            ${h.obs ? `<p class="text-xs text-slate-600 dark:text-slate-300">${esc(h.obs)}</p>` : ''}
                                            ${imgs.length ? `<div class="flex flex-wrap gap-2 mt-3">
                                                ${imgs.slice(0, 6).map(a => `<img data-att="${a.id}" alt="${esc(a.name)}" title="${esc(a.name)}" onclick="openStoredFile('${a.id}')" class="h-20 w-20 object-cover rounded-xl bg-slate-200 dark:bg-slate-600 cursor-pointer">`).join('')}
                                                ${imgs.length > 6 ? `<button onclick="editHobby('${h.id}')" class="h-20 w-20 rounded-xl bg-slate-200 dark:bg-slate-600 text-xs font-bold text-slate-600 dark:text-slate-200">+${imgs.length - 6}</button>` : ''}
                                            </div>` : ''}
                                            ${others.length ? `<div class="flex flex-wrap gap-1.5 mt-3">
                                                ${others.map(a => `<button onclick="openStoredFile('${a.id}')" title="${esc(a.name)}" class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-[11px] font-semibold max-w-[160px] truncate"><i class="fa-solid ${fileIcon(a)} mr-1"></i>${esc(a.name)}</button>`).join('')}
                                            </div>` : ''}
                                        </div>
                                    </div>`;
                                }).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
            hydrateThumbs();
        }

        // =====================================================
        // HOBBIES: RECEITAS (manual ou importadas) — ver, baixar, editar e excluir
        // =====================================================
        const REC_UNITS = ['g', 'kg', 'mg', 'ml', 'l', 'xícara', '1/2 xícara', 'colher de sopa', 'colher de chá', 'pitada', 'un', 'fatia', 'dente', 'maço', 'lata', 'caixa', 'pacote', 'a gosto'];
        const REC_TYPES = ['Doce', 'Salgado', 'Bebida', 'Massa', 'Carne', 'Sobremesa', 'Salada', 'Sopa', 'Lanche'];
        function recData() { if (!Array.isArray(appData.receitas)) appData.receitas = []; return appData.receitas; }
        function openRec() { recOpen = true; recViewId = null; renderCurrentTabContent(); }
        function closeRec() { recOpen = false; recViewId = null; renderCurrentTabContent(); }
        function recView(id) { recViewId = id; renderCurrentTabContent(); window.scrollTo(0, 0); }
        function recBack() { recViewId = null; renderCurrentTabContent(); }
        function setRecQuery(v) { recQuery = v; renderCurrentTabContent(); }
        function recIngLine(i) { return [i.qty, i.unit, i.name].map(x => String(x || '').trim()).filter(Boolean).join(' '); }

        function renderReceitas(container) {
            const r = recViewId ? recData().find(x => x.id === recViewId) : null;
            if (recViewId && !r) recViewId = null;
            if (r) { renderRecView(container, r); return; }
            const q = normKey(recQuery);
            const list = recData().filter(x => !q || normKey(x.name).includes(q) || normKey(x.type).includes(q) || (x.ingredients || []).some(i => normKey(i.name).includes(q)));
            container.innerHTML = `
                <div class="space-y-6 max-w-7xl mx-auto">
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
                        <div class="flex flex-wrap justify-between items-center gap-3">
                            <div class="flex items-center gap-3">
                                <button onclick="closeRec()" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-bold"><i class="fa-solid fa-arrow-left mr-1"></i> Hobbies</button>
                                <h2 class="text-xl font-bold text-slate-800 dark:text-white flex items-center space-x-2"><i class="fa-solid fa-utensils text-amber-500"></i><span>Receitas</span></h2>
                            </div>
                            <div class="flex flex-wrap items-center gap-2">
                                <input type="text" placeholder="Buscar receita, tipo ou ingrediente..." value="${esc(recQuery)}" onchange="setRecQuery(this.value)" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs w-60">
                                <button onclick="recSelAll()" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-bold"><i class="fa-regular fa-square-check mr-1"></i>Selecionar todas</button>
                                <button onclick="recDownloadSelected()" class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold shadow"><i class="fa-solid fa-download mr-1"></i>Baixar selecionadas (${recSel.size})</button>
                                <button onclick="openRecImport()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow flex items-center space-x-2"><i class="fa-solid fa-file-import"></i><span>Importar</span></button>
                                <button onclick="openRecModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow flex items-center space-x-2"><i class="fa-solid fa-plus"></i><span>Nova receita</span></button>
                            </div>
                        </div>
                    </div>
                    ${list.length === 0 ? `<div class="bg-white dark:bg-slate-800 rounded-3xl p-10 shadow-sm border border-slate-100 dark:border-slate-700 text-center text-slate-400">
                            <i class="fa-solid fa-book-open text-4xl mb-2"></i>
                            <p class="text-sm">${recData().length ? 'Nenhuma receita encontrada para esta busca.' : 'Nenhuma receita ainda. Use "Nova receita" ou "Importar".'}</p>
                        </div>` : `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${list.map(x => {
                            const img = (x.attachments || []).find(a => (a.type || '').startsWith('image/'));
                            return `<div class="relative bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden flex flex-col">
                                <label class="absolute top-3 left-3 z-10 w-7 h-7 rounded-lg bg-white/90 dark:bg-slate-900/80 shadow flex items-center justify-center cursor-pointer" title="Marcar para baixar"><input type="checkbox" ${recSel.has(x.id) ? 'checked' : ''} onchange="recToggleSel('${x.id}')"></label>
                                <button onclick="recView('${x.id}')" class="text-left flex-1">
                                    ${img ? `<img data-att="${img.id}" alt="" class="w-full h-40 object-cover bg-slate-200 dark:bg-slate-600">` : `<div class="w-full h-40 bg-amber-50 dark:bg-amber-950/30 text-amber-300 flex items-center justify-center text-5xl"><i class="fa-solid fa-utensils"></i></div>`}
                                    <div class="p-5">
                                        <h4 class="font-bold text-slate-800 dark:text-white text-base">${esc(x.name) || 'Receita sem nome'}</h4>
                                        <div class="flex flex-wrap gap-1.5 mt-2 text-[11px] font-semibold">
                                            ${x.type ? `<span class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-700">${esc(x.type)}</span>` : ''}
                                            ${x.level ? `<span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">${esc(x.level)}</span>` : ''}
                                            ${Number(x.servings) > 0 ? `<span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"><i class="fa-solid fa-user-group mr-1"></i>${esc(x.servings)}</span>` : ''}
                                            ${x.prep ? `<span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"><i class="fa-regular fa-clock mr-1"></i>${esc(x.prep)}</span>` : ''}
                                        </div>
                                        ${Number(x.rating) > 0 ? `<div class="text-xs mt-2 flex gap-0.5">${starsHtml(x.rating)}</div>` : ''}
                                    </div>
                                </button>
                                <div class="px-5 pb-4 pt-0 flex justify-end gap-1 text-xs">
                                    <button onclick="openRecCustos('${x.id}')" class="px-2.5 py-1.5 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 rounded-lg font-bold" title="Custos"><i class="fa-solid fa-coins mr-1"></i>CUSTOS</button>
                                    <button onclick="recDownload('${x.id}')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-lg" title="Baixar"><i class="fa-solid fa-download"></i></button>
                                    <button onclick="openRecModal('${x.id}')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-lg" title="Editar"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteRec('${x.id}')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-lg hover:text-rose-600" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>`}
                </div>`;
            hydrateThumbs();
        }

        function renderRecView(container, r) {
            const imgs = (r.attachments || []).filter(a => (a.type || '').startsWith('image/'));
            const others = (r.attachments || []).filter(a => !(a.type || '').startsWith('image/'));
            const ings = (r.ingredients || []).filter(i => recIngLine(i));
            container.innerHTML = `
                <div class="space-y-6 max-w-4xl mx-auto">
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100 dark:border-slate-700">
                        <div class="flex flex-wrap justify-between items-start gap-3 mb-4">
                            <button onclick="recBack()" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-bold"><i class="fa-solid fa-arrow-left mr-1"></i> Receitas</button>
                            <div class="flex gap-2 text-xs">
                                <button onclick="openRecCustos('${r.id}')" class="px-3 py-2 rounded-xl bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 font-bold"><i class="fa-solid fa-coins mr-1"></i>CUSTOS</button>
                                <button onclick="recDownload('${r.id}')" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 font-bold"><i class="fa-solid fa-download mr-1"></i>Baixar</button>
                                <button onclick="openRecModal('${r.id}')" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 font-bold"><i class="fa-solid fa-pen mr-1"></i>Editar</button>
                                <button onclick="deleteRec('${r.id}')" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 font-bold hover:text-rose-600"><i class="fa-solid fa-trash mr-1"></i>Excluir</button>
                            </div>
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 dark:text-white">${esc(r.name) || 'Receita sem nome'}</h2>
                        <div class="flex flex-wrap items-center gap-2 mt-3 text-xs font-semibold">
                            ${r.type ? `<span class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-700">${esc(r.type)}</span>` : ''}
                            ${r.level ? `<span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">Nível: ${esc(r.level)}</span>` : ''}
                            ${Number(r.servings) > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"><i class="fa-solid fa-user-group mr-1"></i>Serve ${esc(r.servings)} pessoa${Number(r.servings) === 1 ? '' : 's'}</span>` : ''}
                            ${r.prep ? `<span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"><i class="fa-regular fa-clock mr-1"></i>Preparo: ${esc(r.prep)}</span>` : ''}
                            ${Number(r.rating) > 0 ? `<span class="flex gap-0.5 text-sm">${starsHtml(r.rating)}</span>` : ''}
                            ${(r.custos || []).length ? `<button onclick="openRecCustos('${r.id}')" class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-700">Custo total R$ ${recMoney(recCustoTotal(r))}</button>` : ''}
                        </div>
                        ${imgs.length ? `<div class="flex flex-wrap gap-3 mt-5">${imgs.map(a => `<img data-att="${a.id}" alt="${esc(a.name)}" onclick="openStoredFile('${a.id}')" class="h-48 max-w-full rounded-2xl object-cover bg-slate-200 dark:bg-slate-600 cursor-pointer">`).join('')}</div>` : ''}
                        <div class="grid grid-cols-1 md:grid-cols-5 gap-8 mt-6">
                            <div class="md:col-span-2">
                                <h3 class="font-bold text-slate-800 dark:text-white mb-3"><i class="fa-solid fa-basket-shopping text-teal-500 mr-2"></i>Ingredientes</h3>
                                ${ings.length ? `<ul class="space-y-1.5 text-sm text-slate-700 dark:text-slate-200">${ings.map(i => `<li class="flex gap-2"><i class="fa-solid fa-circle text-[5px] text-teal-500 mt-2"></i><span>${i.qty || i.unit ? `<b>${esc([i.qty, i.unit].filter(Boolean).join(' '))}</b> ` : ''}${esc(i.name)}</span></li>`).join('')}</ul>` : '<p class="text-sm text-slate-400">Não informados.</p>'}
                            </div>
                            <div class="md:col-span-3">
                                <h3 class="font-bold text-slate-800 dark:text-white mb-3"><i class="fa-solid fa-kitchen-set text-amber-500 mr-2"></i>Modo de preparo</h3>
                                ${r.steps ? `<p class="text-sm text-slate-700 dark:text-slate-200 whitespace-pre-wrap leading-relaxed">${esc(r.steps)}</p>` : '<p class="text-sm text-slate-400">Não informado.</p>'}
                            </div>
                        </div>
                        ${r.obs ? `<div class="mt-6 p-4 rounded-2xl bg-slate-50 dark:bg-slate-700/50"><p class="text-xs font-bold text-slate-500 uppercase mb-1">Observações</p><p class="text-sm text-slate-700 dark:text-slate-200 whitespace-pre-wrap">${esc(r.obs)}</p></div>` : ''}
                        ${others.length ? `<div class="flex flex-wrap gap-2 mt-5">${others.map(a => `<button onclick="openStoredFile('${a.id}')" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-xs font-semibold"><i class="fa-solid ${fileIcon(a)} mr-1"></i>${esc(a.name)}</button>`).join('')}</div>` : ''}
                    </div>
                </div>`;
            hydrateThumbs();
        }

        // --- formulário (manual, edição ou rascunho vindo da importação) ---
        function recIngRow(i) {
            i = i || { qty: '', unit: '', name: '' };
            return `<div class="rec-ing grid grid-cols-12 gap-2 items-center">
                <input type="text" class="rec-qty col-span-3 ${INP}" value="${esc(i.qty)}" placeholder="Qtd" inputmode="text" autocapitalize="none" autocomplete="off">
                <input type="text" class="rec-unit col-span-3 ${INP}" list="rec-units" value="${esc(i.unit)}" placeholder="Unidade">
                <input type="text" class="rec-iname col-span-5 ${INP}" value="${esc(i.name)}" placeholder="Ingrediente">
                <button type="button" onclick="this.closest('.rec-ing').remove()" class="col-span-1 text-slate-400 hover:text-rose-600" title="Remover"><i class="fa-solid fa-xmark"></i></button>
            </div>`;
        }
        function recAddIng() { document.getElementById('rec-ings').insertAdjacentHTML('beforeend', recIngRow()); }
        function setRecStar(i) {
            const inp = document.getElementById('rec-rating');
            const next = Number(inp.value) === i ? 0 : i;
            inp.value = next;
            document.getElementById('rec-stars').innerHTML = starPickerHtml(next, 'setRecStar');
        }
        function openRecModal(id = null, draft = null) {
            let r = { name: '', type: '', level: '', servings: '', prep: '', ingredients: [], steps: '', rating: 0, obs: '', attachments: [] };
            if (id) r = recData().find(x => x.id === id) || r;
            else if (draft) r = Object.assign(r, draft);
            draftInit(r.attachments);
            const types = [...new Set([...REC_TYPES, ...recData().map(x => String(x.type || '').trim()).filter(Boolean)])];
            const ings = (r.ingredients && r.ingredients.length) ? r.ingredients : [{}, {}, {}];
            showModal(id ? 'Editar receita' : 'Nova receita', `
                <form onsubmit="saveRec(event, '${id || ''}')" class="space-y-4">
                    <p class="text-[11px] text-slate-400">Nenhum campo é obrigatório. Preencha o que tiver.</p>
                    <div><label class="${LBL}">Receita</label><input type="text" id="rec-name" value="${esc(r.name)}" placeholder="Ex.: Bolo de cenoura" class="${INP}"></div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div><label class="${LBL}">Tipo</label><input type="text" id="rec-type" list="rec-types" value="${esc(r.type)}" class="${INP}"><datalist id="rec-types">${types.map(t => `<option value="${esc(t)}"></option>`).join('')}</datalist></div>
                        <div><label class="${LBL}">Nível</label><select id="rec-level" class="${INP}"><option value=""></option>${['Fácil', 'Médio', 'Difícil'].map(l => `<option ${r.level === l ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
                        <div><label class="${LBL}">Serve (pessoas)</label><input type="number" id="rec-serves" min="1" step="1" value="${esc(r.servings)}" class="${INP}"></div>
                        <div><label class="${LBL}">Tempo de preparo</label><input type="text" id="rec-prep" value="${esc(r.prep || '')}" placeholder="Ex.: 45 min" class="${INP}"></div>
                    </div>
                    <div>
                        <label class="${LBL}">Ingredientes</label>
                        <datalist id="rec-units">${REC_UNITS.map(u => `<option value="${esc(u)}"></option>`).join('')}</datalist>
                        <div id="rec-ings" class="space-y-2">${ings.map(recIngRow).join('')}</div>
                        <button type="button" onclick="recAddIng()" class="mt-2 text-xs font-bold text-teal-600 dark:text-teal-400"><i class="fa-solid fa-plus mr-1"></i>Adicionar ingrediente</button>
                        <p class="text-[10px] text-slate-400 mt-1">Quantidade, unidade (escolha da lista ou digite a sua) e o ingrediente.</p>
                    </div>
                    <div><label class="${LBL}">Modo de preparo</label><textarea id="rec-steps" rows="6" placeholder="Escreva como a receita é feita" class="${INP}">${esc(r.steps || '')}</textarea></div>
                    <div>
                        <label class="${LBL}">Nota</label>
                        <div id="rec-stars" class="flex items-center text-2xl">${starPickerHtml(r.rating, 'setRecStar')}</div>
                        <input type="hidden" id="rec-rating" value="${Number(r.rating) || 0}">
                        <p class="text-[10px] text-slate-400 mt-1">Clique de novo na mesma estrela para limpar.</p>
                    </div>
                    <div><label class="${LBL}">Observação</label><textarea id="rec-obs" rows="2" class="${INP}">${esc(r.obs || '')}</textarea></div>
                    <div><label class="${LBL}">Foto</label>
                        <div id="draft-att-list">${draftListHtml()}</div>
                        <input type="file" id="rec-files" multiple accept="image/*" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs"></div>
                    <button type="submit" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Salvar receita</button>

        const REC_MEDIDAS = ['unidade', 'grama', 'quilo', 'litro', 'ml', 'xícara', 'colher de sopa', 'colher de chá', 'pacote', 'caixa', 'lata', 'dúzia'];

        // --- baixar (arquivo de texto) ---

        function recLoadPdf() {

                sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
                sc.onload = () => window.jspdf ? res(window.jspdf) : rej(new Error('jspdf')); sc.onerror = () => rej(new Error('offline'));
                document.head.appendChild(sc);

        async function recPdf(list, filename, withCost) {
            let J;
            try { J = await recLoadPdf(); } catch (e) { showToast('Não consegui carregar o gerador de PDF. Verifique a internet e tente de novo.', 'error'); return; }
            const clean = t => String(t == null ? '' : t).replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\u2026/g, '...').replace(/\u2022/g, '-').replace(/[^\u0009\u000a\u0020-\u00ff]/g, '');
            const doc = new J.jsPDF({ unit: 'mm', format: 'a4' });
            const W = 210, H = 297, M = 18, MW = W - 2 * M; let y = M;
            const write = (txt, size, style, color, gap) => {
                doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(color[0], color[1], color[2]);
                const lh = size * 0.3528 * 1.4;
                clean(txt).split('\n').forEach(par => {
                    doc.splitTextToSize(par || ' ', MW).forEach(l => { if (y + lh > H - M) { doc.addPage(); y = M; } doc.text(l, M, y + lh * 0.8); y += lh; });
                });
                y += gap || 0;
            };
            const head = t => { y += 3; write(t, 11, 'bold', [156, 112, 32], 1.5); };
            list.forEach((r, idx) => {
                if (idx > 0) { doc.addPage(); }
                doc.setFillColor(156, 112, 32); doc.rect(0, 0, W, 10, 'F');
                y = 20;
                write(r.name || 'Receita sem nome', 20, 'bold', [46, 31, 18], 2);
                const meta = [r.type, r.level ? 'Nível: ' + r.level : '', Number(r.servings) > 0 ? 'Serve ' + r.servings + ' pessoa' + (Number(r.servings) === 1 ? '' : 's') : '', r.prep ? 'Preparo: ' + r.prep : '', Number(r.rating) > 0 ? 'Nota: ' + r.rating + '/5' : ''].filter(Boolean).join('   |   ');
                if (meta) write(meta, 10, 'normal', [110, 110, 110], 2);
                doc.setDrawColor(220, 210, 190); doc.line(M, y, W - M, y); y += 2;
                const ings = (r.ingredients || []).map(recIngLine).filter(Boolean);
                if (ings.length) { head('INGREDIENTES'); ings.forEach(x => write('- ' + x, 11, 'normal', [40, 40, 40], 0.5)); }
                if (r.steps) { head('MODO DE PREPARO'); write(r.steps, 11, 'normal', [40, 40, 40], 1); }
                if (r.obs) { head('OBSERVAÇÕES'); write(r.obs, 10, 'normal', [90, 90, 90], 1); }
                if (withCost && (r.custos || []).length) { head('ORÇAMENTO / CUSTOS'); recCustoLines(r).forEach(x => write('- ' + x, 10, 'normal', [40, 40, 40], 0.5)); write(recCustoSummary(r), 11, 'bold', [46, 31, 18], 1); }
            });
            const n = doc.getNumberOfPages();
            for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(150, 150, 150); doc.text('ISIS  -  página ' + i + ' de ' + n, W / 2, H - 8, { align: 'center' }); }
            doc.save(filename.replace(/[\\/:*?"<>|]/g, '-') + '.pdf');
        }

        // --- importar (texto colado, TXT/MD ou PDF) — abre o formulário preenchido para você revisar ---
        const REC_UNIT_MAP = { g: 'g', gr: 'g', grama: 'g', gramas: 'g', kg: 'kg', quilo: 'kg', quilos: 'kg', mg: 'mg', ml: 'ml', l: 'l', litro: 'l', litros: 'l', xic: 'xícara', xicara: 'xícara', xicaras: 'xícara', 'xícara': 'xícara', 'xícaras': 'xícara', un: 'un', und: 'un', unidade: 'un', unidades: 'un', pitada: 'pitada', pitadas: 'pitada', dente: 'dente', dentes: 'dente', fatia: 'fatia', fatias: 'fatia', lata: 'lata', latas: 'lata', caixa: 'caixa', caixas: 'caixa', pacote: 'pacote', pacotes: 'pacote', 'maço': 'maço' };
        function recParseIng(line) {
            const t = line.replace(/^[-–•*·]\s*/, '').trim();
            let m = t.match(/^(\d+(?:[.,]\d+)?(?:\s+\d\/\d)?|\d+\/\d+)\s*(colheres?\s+de\s+sopa|colheres?\s+de\s+ch[áa]|colher\s+(?:de\s+)?(?:sopa|ch[áa])|c\.?\s?sopa|c\.?\s?ch[áa])\b\s*(?:de\s+)?(.*)$/i);
            if (m) { const u = /ch[áa]/i.test(m[2]) ? 'colher de chá' : 'colher de sopa'; return { qty: m[1], unit: u, name: m[3].trim() }; }
            m = t.match(/^(\d+(?:[.,]\d+)?(?:\s+\d\/\d)?|\d+\/\d+)\s*([A-Za-zÀ-ú]+)?\s*(?:de\s+)?(.*)$/);
            if (m) {
                const key = (m[2] || '').toLowerCase();
                if (key && REC_UNIT_MAP[key]) return { qty: m[1], unit: REC_UNIT_MAP[key], name: m[3].trim() };
                return { qty: m[1], unit: '', name: ((m[2] || '') + ' ' + m[3]).trim() };
            }
            return { qty: '', unit: '', name: t };
        }
        function recParseText(text) {
            const lines = String(text).replace(/\u00a0/g, ' ').split(/\r?\n/).map(l => l.trim());
            const hIng = /^(ingredientes?)\s*:?$/i, hPrep = /^(modo de preparo|modo de fazer|preparo|como fazer|instru[çc][õo]es)\s*:?$/i, hObs = /^(observa[çc][õo]es?|obs\.?|dicas?)\s*:?$/i;
            const r = { name: '', type: '', level: '', servings: '', ingredients: [], steps: '', obs: '' };
            let sec = '', steps = [], obs = [];
            lines.forEach(line => {
                if (!line) { if (sec === 'steps' && steps.length && steps[steps.length - 1] !== '') steps.push(''); return; }
                const hdr = line.replace(/^#+\s*/, '');
                if (hIng.test(hdr)) { sec = 'ing'; return; }
                if (hPrep.test(hdr)) { sec = 'steps'; return; }
                if (hObs.test(hdr)) { sec = 'obs'; return; }
                let m;
                if ((m = line.match(/^receita\s*:\s*(.+)/i))) { r.name = m[1]; return; }
                if ((m = line.match(/^(?:tipo|categoria)\s*:\s*(.+)/i))) { r.type = m[1]; return; }
                if ((m = line.match(/^(?:n[ií]vel|dificuldade)\s*:\s*(.+)/i))) { r.level = /f[áa]cil/i.test(m[1]) ? 'Fácil' : /m[ée]dio/i.test(m[1]) ? 'Médio' : /dif[ií]cil/i.test(m[1]) ? 'Difícil' : ''; return; }
                if ((m = line.match(/^(?:serve|rende|por[çc][õo]es|rendimento)\s*:?\s*(\d+)/i))) { r.servings = m[1]; return; }
                if (!r.name && !sec) { r.name = line.replace(/^#+\s*/, ''); return; }
                if (sec === 'ing') r.ingredients.push(recParseIng(line));
                else if (sec === 'obs') obs.push(line);
                else steps.push(line);
            });
            r.steps = steps.join('\n').trim(); r.obs = obs.join('\n').trim();
            return r;
        }

        async function recReadFile(file) {
            if (!file) return;
            const msg = document.getElementById('rec-imp-msg');
            try {
                msg.textContent = 'Lendo o arquivo...';
                const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
                document.getElementById('rec-imp-text').value = isPdf ? await vacPdfText(file) : await file.text();
                msg.textContent = 'Arquivo lido. Clique em "Revisar receita".';
            } catch (e) {
                console.error(e);
                msg.textContent = 'Não consegui ler este arquivo' + (e && e.message ? ' (' + e.message + ')' : '') + '. Tente colar o texto.';
            }
        }
        function recImportGo() {
            const t = document.getElementById('rec-imp-text').value;
            if (!t.trim()) { document.getElementById('rec-imp-msg').textContent = 'Cole um texto ou escolha um arquivo primeiro.'; return; }
            const draft = recParseText(t);
            closeModal();
            setTimeout(() => openRecModal(null, draft), 50);

        let budDrag = null;
        function budGrpDragStart(ev, id) {
            ev.preventDefault();

            const src = document.querySelector(`[data-gid="${id}"]`); if (src) src.style.opacity = '0.5';
            document.addEventListener('pointermove', budGrpDragMove);
            document.addEventListener('pointerup', budGrpDragEnd);
            document.addEventListener('pointercancel', budGrpDragEnd);
        }
        function budGrpDragMove(ev) {
            if (!budDrag) return;
            document.querySelectorAll('[data-gid]').forEach(e => { e.style.boxShadow = ''; });
            const y = ev.clientY;
            if (y < 70) window.scrollBy(0, -12); else if (y > window.innerHeight - 70) window.scrollBy(0, 12);
            const el = document.elementFromPoint(ev.clientX, y), t = el && el.closest ? el.closest('[data-gid]') : null;
            budDrag.over = null;
            if (t && t.dataset.gid !== budDrag.id) {
                const r = t.getBoundingClientRect();
                budDrag.over = t.dataset.gid; budDrag.after = y > r.top + r.height / 2;
                t.style.boxShadow = budDrag.after ? '0 4px 0 0 #f59e0b' : '0 -4px 0 0 #f59e0b';
            }
        }
        function budGrpDragEnd() {
            document.removeEventListener('pointermove', budGrpDragMove);
            document.removeEventListener('pointerup', budGrpDragEnd);
            document.removeEventListener('pointercancel', budGrpDragEnd);
            const d = budDrag; budDrag = null;
            document.querySelectorAll('[data-gid]').forEach(e => { e.style.boxShadow = ''; e.style.opacity = ''; });
            if (!d || !d.over) return;
            const arr = appData.habitacao.budgetGroups || [];
            const from = arr.findIndex(g => g.id === d.id); if (from < 0) return;
            const [item] = arr.splice(from, 1);
            let to = arr.findIndex(g => g.id === d.over); if (to < 0) { arr.splice(from, 0, item); return; }
            arr.splice(d.after ? to + 1 : to, 0, item);
            saveAppData(); renderCurrentTabContent();
        }
        function budSortBy(k) { if (budSort.k === k) budSort.dir *= -1; else budSort = { k, dir: k === 'amount' ? -1 : 1 }; renderCurrentTabContent(); }
        function budCmp(a, b) {
            const k = budSort.k; let r;
            if (k === 'pag') {
                // ordem de pagamento: pagos primeiro (pela data do pagamento), depois os em aberto (pela data do orçamento)
                const pa = a.status === 'Pago' || (Number(a.paidAmount) > 0 && Number(a.paidAmount) >= Number(a.amount));
                const pb = b.status === 'Pago' || (Number(b.paidAmount) > 0 && Number(b.paidAmount) >= Number(b.amount));
                if (pa !== pb) r = pa ? -1 : 1;
                else r = pa ? (a.paidDate || a.date || '').localeCompare(b.paidDate || b.date || '') : (a.date || '').localeCompare(b.date || '');

            else if (k === 'amount') r = (Number(a.amount) || 0) - (Number(b.amount) || 0);
            else if (k === 'date') r = (a.date || '').localeCompare(b.date || '');
            else r = normKey(a.title).localeCompare(normKey(b.title));

                const grp = r.group; const cells = grp ? [r.text] : r;
                doc.setFont('helvetica', grp ? 'bold' : 'normal'); doc.setFontSize(9);
                const lines = grp ? [doc.splitTextToSize(clean(r.text), MW - 3)] : cells.map((c, i) => doc.splitTextToSize(clean(c), cw[i] - 3));
                const n = Math.max(...lines.map(l => l.length)), h = n * 4.2 + 2.4;
                if (y + h > H - 14) { doc.addPage(); y = M; head(); }
                if (grp) { doc.setFillColor(253, 243, 215); doc.rect(M, y, MW, h, 'F'); doc.setTextColor(120, 80, 10); doc.text(lines[0], M + 1.5, y + 4.4); }
                else { let x = M; doc.setTextColor(40, 40, 40); lines.forEach((l, i) => { doc.text(l, x + 1.5, y + 4.4); x += cw[i]; }); }
                doc.setDrawColor(225, 220, 205); doc.line(M, y + h, M + MW, y + h); y += h;
            });
            const nP = doc.getNumberOfPages(); for (let i = 1; i <= nP; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(150, 150, 150); doc.text('ISIS  -  pagina ' + i + ' de ' + nP, W / 2, H - 6, { align: 'center' }); }
            doc.save(filename.replace(/[\\/:*?"<>|]/g, '-') + '.pdf');
        }

        function finRecUi() {
            const g = i => document.getElementById(i), on = g('fin-rec') && g('fin-rec').checked;
            g('fin-rec-box').classList.toggle('hidden', !on);
            const u = g('fin-rec-until').value; g('fin-rec-date-wrap').classList.toggle('hidden', u !== 'data'); g('fin-rec-n-wrap').classList.toggle('hidden', u !== 'meses');
            const ins = g('fin-installments'); if (ins) { if (on) ins.value = 1; ins.disabled = on; ins.classList.toggle('opacity-40', on); updateInstallmentPreview(); }
        }
        function finMakeRecurring(tx) {
            const g = i => document.getElementById(i), freq = g('fin-rec-freq').value, until = g('fin-rec-until').value;
            let end = ''; if (until === 'data') end = g('fin-rec-date').value;
            else if (until === 'meses') { const nm = Math.max(1, parseInt(g('fin-rec-n').value) || 1); end = addMonthsToDate(tx.date, freq === 'anual' ? 12 * (nm - 1) : nm - 1); }
            const rec = { id: uid(), name: tx.desc, amount: Number(tx.amount), kind: tx.type, tipo: normKey(tx.category).includes('assin') ? 'assinatura' : 'fixa', freq, day: Number(tx.date.slice(8, 10)), month: Number(tx.date.slice(5, 7)), category: tx.category, owner: tx.owner || '', accId: tx.accId || '', dedutivel: tx.dedutivel || '', start: tx.date, end, ahead: g('fin-rec-ahead').value, lancados: [tx.date.slice(0, 7)], created: plCurYM(), active: true };
            if (tx.habitacional) { rec.habitacional = true; rec.habPerson = tx.habPerson || ''; }
            tx.recId = rec.id; plano().recs.push(rec); plRecAhead(rec);
        }
        function updateInstallmentPreview() {
            const el = document.getElementById('fin-inst-preview');
            const nEl = document.getElementById('fin-installments');
            if (!el || !nEl) return;
            const n = Math.max(1, parseInt(nEl.value) || 1);
            const amount = Number(document.getElementById('fin-amount').value) || 0;
            const mw = document.getElementById('fin-instmode-wrap'); if (mw) mw.classList.toggle('hidden', n <= 1);
            if (n <= 1 || !amount) { el.classList.add('hidden'); return; }
            el.classList.remove('hidden');
            const igual = (document.getElementById('fin-instmode') || {}).value === 'igual';
            const sn = Math.max(1, Math.min(n, parseInt((document.getElementById('fin-startn') || {}).value) || 1)), rest = n - sn + 1;
            el.innerHTML = `<i class="fa-solid fa-layer-group mr-1"></i>${igual ? `${n}x de R$ ${money(amount)} (total R$ ${money(amount * n)})` : `${n}x de R$ ${money(Math.floor(amount * 100 / n) / 100)} (total R$ ${money(amount)})`}${sn > 1 ? ` · lançando ${rest} parcela(s): da ${sn}ª à ${n}ª` : ''} — uma por mês. A 1ª parcela recebe o status escolhido; as demais ficam como <b>Pendente</b>.`;
        }

        function finWhoUi() { const o = document.getElementById('fin-owner').value; document.getElementById('fin-payer-wrap').classList.toggle('hidden', o !== ''); }
        function finApplyExtra(o) {
            const ow = document.getElementById('fin-owner'), pa = document.getElementById('fin-payer'), de = document.getElementById('fin-ded'); if (!ow) return o;
            if (ow.value) o.owner = ow.value; else delete o.owner;
            if (!ow.value && pa && pa.value) o.payer = pa.value; else delete o.payer;
            if (de && de.value) o.dedutivel = de.value; else delete o.dedutivel;
            const db = document.getElementById('fin-debt'); if (db) { if (db.value && o.type === 'despesa') o.debtId = db.value; else delete o.debtId; }
            return o;
        }
        async function saveFinance(e, id) {
            e.preventDefault();
            const type = document.getElementById('fin-type').value;
            const status = document.getElementById('fin-status').value;
            const desc = document.getElementById('fin-desc').value;
            const amount = document.getElementById('fin-amount').value;
            const category = catResolveNew(document.getElementById('fin-category').value);
            const date = document.getElementById('fin-date').value;
            const accId = document.getElementById('fin-acc').value;
            const toAccId = type === 'transferencia' ? document.getElementById('fin-to').value : '';
            if (type === 'transferencia' && (!accId || !toAccId || accId === toAccId)) { showToast('Na transferência, escolha duas contas diferentes (origem e destino).', 'warning'); return; }
            const newAtts = await storeFiles(document.getElementById('fin-files').files);
            const hb = document.getElementById('fin-hab');
            const habAcc = isHabId(accId) && type !== 'transferencia';
            const habitacional = habAcc || !!(hb && hb.checked && type === 'despesa');
            const habPerson = habAcc ? accId.slice(4) : (habitacional ? (document.getElementById('fin-hab-person').value || '') : '');

            if (id) {
                const tr = appData.financeiro.transactions.find(x => x.id === id);
                if (tr) {
                    tr.type = type; tr.status = status; tr.desc = desc; tr.amount = amount; tr.category = category; tr.date = date; tr.accId = accId; tr.toAccId = toAccId;
                    if (!tr.cardInvoice) { if (habitacional) { tr.habitacional = true; tr.habPerson = habPerson; } else { delete tr.habitacional; delete tr.habPerson; } }
                    const toRemove = Array.from(document.querySelectorAll('.fin-remove-att:checked')).map(c => c.value);
                    toRemove.forEach(rid => deleteStoredFile(rid));
                    tr.attachments = (tr.attachments || []).filter(a => !toRemove.includes(a.id)).concat(newAtts);
                    finApplyExtra(tr);
                }
            } else {
                const n = Math.max(1, Math.min(60, parseInt(document.getElementById('fin-installments').value) || 1));
                if (n === 1) {
                    const recOn = !!(document.getElementById('fin-rec') && document.getElementById('fin-rec').checked) && type !== 'transferencia';
                    if (recOn) {
                        const u = document.getElementById('fin-rec-until').value, ed = document.getElementById('fin-rec-date').value;
                        if (u === 'data' && (!ed || ed < date)) { showToast('Informe a última data (igual ou depois da data do lançamento).', 'warning'); return; }
                    }
                    const tx = finApplyExtra(Object.assign({ id: uid(), type, status, desc, amount, category, date, accId, toAccId, attachments: newAtts }, habitacional ? { habitacional: true, habPerson } : {}));
                    appData.financeiro.transactions.push(tx);
                    if (recOn) finMakeRecurring(tx);
                } else {
                    const igual = (document.getElementById('fin-instmode') || {}).value === 'igual';
                    const totalCents = Math.round(Number(amount) * 100) * (igual ? n : 1);
                    const base = Math.floor(totalCents / n);
                    const group = uid(), sn = Math.max(1, Math.min(n, parseInt((document.getElementById('fin-startn') || {}).value) || 1));
                    for (let i = 0; i < n - sn + 1; i++) {
                        const pn = sn + i, cents = pn === n ? totalCents - base * (n - 1) : base;
                        appData.financeiro.transactions.push(finApplyExtra(Object.assign({
                            id: uid(), type, desc, category, accId, toAccId,
                            amount: (cents / 100).toFixed(2),
                            date: addMonthsToDate(date, i),
                            status: i === 0 ? status : 'pendente',
                            installment: { group, n: pn, total: n },
                            attachments: i === 0 ? newAtts : []
                        }, habitacional ? { habitacional: true, habPerson } : {})));
                    }
                }
            }
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast("Salvo!", "success");
        }
        function editFinance(id) {
            const t = appData.financeiro.transactions.find(x => x.id === id);
            openFinanceModal(id);
        }

        function deleteFinance(id) {
            const t = appData.financeiro.transactions.find(x => x.id === id);
            if (!t) return;
            if (t.cardInvoice) { showToast('Esta fatura é gerada pelo Cartão de Crédito. Exclua os lançamentos na tela do cartão.', 'warning'); return; }
            const siblings = t.installment ? appData.financeiro.transactions.filter(x => x.installment && x.installment.group === t.installment.group) : [];
            if (siblings.length > 1) {
                showModal('Excluir parcela', `
                    <p class="text-sm text-slate-600 dark:text-slate-300 mb-4">"${esc(t.desc)}" tem ${siblings.length} parcelas. O que deseja excluir?</p>
                    <div class="space-y-2">
                        <button onclick="removeFinance('${id}', false)" class="w-full bg-slate-100 dark:bg-slate-700 py-2.5 rounded-xl text-sm font-bold">Só esta parcela (${t.installment.n}/${t.installment.total})</button>
                        <button onclick="removeFinance('${id}', true)" class="w-full bg-rose-600 text-white py-2.5 rounded-xl text-sm font-bold">Todas as ${siblings.length} parcelas</button>
                    </div>
                `);
            } else {
                if (!confirm(`Excluir o lançamento "${t.desc || ''}"?`)) return;
                removeFinance(id, false);
            }
        }
        function removeFinance(id, wholeGroup) {
            const t = appData.financeiro.transactions.find(x => x.id === id);
            if (!t) return;
            const ids = (wholeGroup && t.installment)
                ? appData.financeiro.transactions.filter(x => x.installment && x.installment.group === t.installment.group).map(x => x.id)
                : [id];
            appData.financeiro.transactions.filter(x => ids.includes(x.id)).forEach(x => (x.attachments || []).forEach(a => deleteStoredFile(a.id)));
            appData.financeiro.transactions = appData.financeiro.transactions.filter(x => !ids.includes(x.id));
            appData.habitacao.casa = casaData().filter(r => !ids.includes(r.finId));
            saveAppData(); closeModal(); renderCurrentTabContent();
        }

        // --- ANEXOS DAS MOVIMENTAÇÕES ---
        function openAttachmentsModal(txId) {
            const t = appData.financeiro.transactions.find(x => x.id === txId);
            if (!t) return;
            const atts = t.attachments || [];
            showModal('Anexos — ' + esc(t.desc), `
                ${atts.length === 0 ? '<p class="text-sm text-slate-400 text-center py-4">Nenhum anexo nesta movimentação.</p>' : `
                    <div class="space-y-2 mb-4">
                        ${atts.map(a => `
                            <div class="flex items-center justify-between gap-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-700/50 text-xs">
                                <div class="min-w-0">
                                    <p class="font-semibold text-slate-800 dark:text-white truncate"><i class="fa-solid ${fileIcon(a)} mr-1"></i>${esc(a.name)}</p>
                                    <p class="text-slate-400">${fmtSize(a.size)} · ${fmtBR(a.date)}</p>
                                </div>
                                <div class="flex gap-1 flex-shrink-0">
                                    <button onclick="openStoredFile('${a.id}')" class="px-2.5 py-1.5 bg-teal-100 dark:bg-teal-900 text-teal-800 dark:text-teal-200 rounded-lg font-bold">Abrir</button>
                                    <button onclick="downloadMeta('${a.id}')" class="px-2.5 py-1.5 bg-slate-200 dark:bg-slate-600 rounded-lg" title="Baixar"><i class="fa-solid fa-download"></i></button>
                                    <button onclick="removeTxAttachment('${txId}', '${a.id}')" class="px-2.5 py-1.5 bg-slate-200 dark:bg-slate-600 rounded-lg hover:text-rose-600" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>`).join('')}
                    </div>`}
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Adicionar anexo</label>
                <input type="file" multiple onchange="addTxAttachments('${txId}', this.files)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
            `);
        }
        async function addTxAttachments(txId, files) {
            const t = appData.financeiro.transactions.find(x => x.id === txId);
            if (!t || !files.length) return;
            const metas = await storeFiles(files);
            t.attachments = (t.attachments || []).concat(metas);
            saveAppData();
            renderCurrentTabContent();
            openAttachmentsModal(txId);

        const LEM_WD = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        function lemRecLabel(l) {
            const r = l && l.rec; if (!r || !r.type || r.type === 'unico') return '';
            if (r.type === 'diario') return 'Diário';
            if (r.type === 'mensal') return 'Mensal';
            if (r.type === 'anual') return 'Anual';
            if (r.type === 'cada') return `A cada ${r.every || 1} dia(s)`;
            if (r.type === 'dias') return (r.weekdays || []).slice().sort((a, b) => a - b).map(d => LEM_WD[d]).join(', ') || 'Dias da semana';
            return '';
        }
        function lemFmt(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
        function lemStep(dateStr, r) {
            const [y, m, d] = dateStr.split('-').map(Number);
            if (r.type === 'diario') return lemFmt(new Date(y, m - 1, d + 1));
            if (r.type === 'cada') return lemFmt(new Date(y, m - 1, d + Math.max(1, Number(r.every) || 1)));
            if (r.type === 'dias') {
                const wd = (r.weekdays && r.weekdays.length) ? r.weekdays : [new Date(y, m - 1, d).getDay()];
                for (let i = 1; i <= 7; i++) { const x = new Date(y, m - 1, d + i); if (wd.includes(x.getDay())) return lemFmt(x); }
            }
            if (r.type === 'mensal') { const day = Number(r.day) || d, last = new Date(y, m + 1, 0).getDate(); return lemFmt(new Date(y, m, Math.min(day, last))); }
            if (r.type === 'anual') { const day = Number(r.day) || d, last = new Date(y + 1, m, 0).getDate(); return lemFmt(new Date(y + 1, m - 1, Math.min(day, last))); }
            return dateStr;
        }
        // Próxima ocorrência depois da data atual do lembrete e depois de hoje
        function nextLembreteDate(l) {
            const today = localDateStr();
            let n = lemStep(l.date, l.rec), guard = 0;
            while (n <= today && guard++ < 4000) n = lemStep(n, l.rec);
            return n;
        }

        const CARD_DEFAULT_CATS = ['Gasolina', 'Ração', 'Assinatura', 'Presente', 'Outros'];
        const pad2 = n => String(n).padStart(2, '0');
        function ymAdd(key, n) { const [y, m] = key.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; }
        function fmtYM(key) { const [y, m] = key.split('-').map(Number); const s = new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); }
        function cardById(id) { return appData.cartao.cards.find(c => c.id === id); }
        // Fatura identificada pelo mês de VENCIMENTO. Compra depois do dia de fechamento cai na fatura seguinte.
        function cardInvoiceKey(card, dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const close = Number(card.closingDay) || 31, due = Number(card.dueDay) || close;
            let cm = m - 1; if (d > close) cm++;
            const dm = cm + (due > close ? 0 : 1);
            const dt = new Date(y, dm, 1);
            return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}`;
        }
        function cardDueDate(card, key) {
            const [y, m] = key.split('-').map(Number);
            const last = new Date(y, m, 0).getDate();
            return `${key}-${pad2(Math.min(Number(card.dueDay) || last, last))}`;
        }
        function cardEntriesFor(cardId, key) { return appData.cartao.entries.filter(e => e.cardId === cardId && e.invoice === key); }
        function cardInvoiceTotal(cardId, key) { return cardEntriesFor(cardId, key).reduce((s, e) => s + (Number(e.amount) || 0), 0); }
        function cardInvoiceTx(cardId, key) { return appData.financeiro.transactions.find(t => t.cardInvoice && t.cardInvoice.cardId === cardId && t.cardInvoice.inv === key); }

        // Leva para Finanças somente "Cartão de Crédito" + valor final de cada fatura
        function syncCardInvoices() {
            const C = appData.cartao; if (!C) return;
            const sums = {};
            C.entries.forEach(e => {
                if (!e.invoice || !C.cards.some(c => c.id === e.cardId)) return;
                const k = e.cardId + '|' + e.invoice;
                sums[k] = (sums[k] || 0) + (Number(e.amount) || 0);
            });
            const seen = new Set(), keep = [];
            const upd = (t, cardId, inv) => {
                const card = cardById(cardId);
                t.type = 'despesa'; t.category = 'Cartão de Crédito';
                t.desc = 'Cartão de Crédito' + (C.cards.length > 1 ? ' — ' + card.name : '');
                t.amount = Math.max(0, sums[cardId + '|' + inv]).toFixed(2); // crédito maior que a fatura não gera despesa negativa
                t.date = cardDueDate(card, inv);
            };
            appData.financeiro.transactions.forEach(t => {
                if (!t.cardInvoice) { keep.push(t); return; }
                const k = t.cardInvoice.cardId + '|' + t.cardInvoice.inv;
                if (sums[k] !== undefined && !seen.has(k)) { upd(t, t.cardInvoice.cardId, t.cardInvoice.inv); seen.add(k); keep.push(t); }
                else (t.attachments || []).forEach(a => deleteStoredFile(a.id));
            });
            Object.keys(sums).forEach(k => {
                if (seen.has(k)) return;
                const [cardId, inv] = k.split('|');
                const t = { id: uid(), status: 'pendente', attachments: [], cardInvoice: { cardId, inv } };
                upd(t, cardId, inv); keep.push(t);
            });
            appData.financeiro.transactions = keep;
        }
        function cardCommit(msg) { syncCardInvoices(); saveAppData(); closeModal(); renderCurrentTabContent(); if (msg) showToast(msg, 'success'); }

        function parseOfx(txt) {
            const out = [], re = /<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|$)/gi; let m;
            const tag = (s, t) => { const x = s.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return x ? x[1].trim() : ''; };
            while ((m = re.exec(txt))) {
                const dt = tag(m[1], 'DTPOSTED').slice(0, 8), amt = parseFloat(tag(m[1], 'TRNAMT').replace(',', '.'));
                if (dt.length < 8 || isNaN(amt)) continue;
                out.push({ date: `${dt.slice(0, 4)}-${dt.slice(4, 6)}-${dt.slice(6, 8)}`, name: tag(m[1], 'MEMO') || tag(m[1], 'NAME') || 'Lançamento', signed: amt });

        function csvSplit(line, sep) {
            const out = []; let cur = '', q = false;
            for (let i = 0; i < line.length; i++) {

                if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }

        function parseCsvFatura(txt) {

            if (!lines.length) return [];
            const sep = (lines[0].split(';').length > lines[0].split(',').length) ? ';' : ',';
            const head = csvSplit(lines[0], sep).map(normKey);
            const find = (...al) => head.findIndex(h => al.includes(h));
            let iD = find('data', 'date', 'data da compra', 'data lancamento', 'data compra'), iN = find('descricao', 'description', 'title', 'titulo', 'estabelecimento', 'historico', 'lancamento', 'nome', 'name'), iV = find('valor', 'amount', 'valor (r$)', 'value', 'valor r$');
            let start = 1;

            if (iN < 0) iN = head.findIndex((h, i) => i !== iD && i !== iV);
            const out = [];
            for (let i = start; i < lines.length; i++) {
                const c = csvSplit(lines[i], sep), date = parseDateAny(c[iD]);
                if (!date) continue;
                const raw = String(c[iV] || '').trim(); if (!raw) continue;

            if (pdfWorkerReady) return;
            if (typeof pdfjsLib === 'undefined') throw new Error('Leitor de PDF indisponível (sem internet?). Use OFX ou CSV.');
            const url = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            try { const t = await (await fetch(url)).text(); pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' })); }
            catch (e) { pdfjsLib.GlobalWorkerOptions.workerSrc = url; }

        }
        async function parsePdfFatura(file) {
            await ensurePdfWorker();
            const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
            const MES = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };
            const today = new Date(), out = [];
            for (let p = 1; p <= pdf.numPages; p++) {
                const tc = await (await pdf.getPage(p)).getTextContent();
                const rows = {};
                tc.items.forEach(it => { if (!it.str.trim()) return; const y = Math.round(it.transform[5] / 3); (rows[y] = rows[y] || []).push(it); });
                Object.keys(rows).sort((a, b) => b - a).forEach(y => {
                    const line = rows[y].sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
                    const dm = line.match(/^(\d{1,2})[\/\s-]((?:\d{1,2})|(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez))(?:[\/\s-](\d{2,4}))?\b/i);
                    if (!dm) return;
                    const am = [...line.matchAll(/(-|−)?\s?(?:R\$\s?)?(\d{1,3}(?:\.\d{3})*,\d{2})(\s?CR)?/g)].pop();
                    if (!am) return;
                    const day = Number(dm[1]); let mon = /^\d+$/.test(dm[2]) ? Number(dm[2]) : MES[dm[2].toLowerCase()];
                    if (!mon || mon > 12 || day > 31) return;
                    let yr = dm[3] ? Number(dm[3].length === 2 ? '20' + dm[3] : dm[3]) : today.getFullYear();
                    if (!dm[3] && (mon - 1) > today.getMonth() + 1) yr--;

                });
            }
            return out;

        const MESES_PT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

        function renderMural() { const el = document.getElementById('mural-box'); if (el) el.innerHTML = muralInner(); }

        // =====================================================
        // RELATÓRIOS (XLSX) — exportar / importar
        // =====================================================
        // ===== categorias: última usada, semelhantes, unificar =====
        function descKey(s) { return normKey(s).replace(/\b(parc(ela)?\.?\s*)?\d{1,2}\s*\/\s*\d{1,2}\b/g, '').replace(/[0-9*#]+/g, ' ').replace(/\s+/g, ' ').trim(); }
        function catLastUsed(name) {
            const k = descKey(name); if (!k) return '';
            let best = '', bd = '';
            appData.cartao.entries.forEach(e => { if (e.category && descKey(e.name) === k && (e.date || '') >= bd) { bd = e.date || ''; best = e.category; } });
            appData.financeiro.transactions.forEach(t => { if (!t.cardInvoice && t.type !== 'transferencia' && t.category && descKey(t.desc) === k && (t.date || '') >= bd) { bd = t.date || ''; best = t.category; } });
            return best;
        }
        function catSortList(a) {   // A–Z, ou a ordem escolhida em Configurações › Editar categorias
            const reg = appData.cartao.categories || [], man = !!appData.cartao.catManual;
            return a.slice().sort((x, y) => { if (man) { const i = reg.indexOf(x), j = reg.indexOf(y); if (i >= 0 || j >= 0) return (i < 0 ? 1e6 : i) - (j < 0 ? 1e6 : j) || x.localeCompare(y, 'pt-BR'); } return x.localeCompare(y, 'pt-BR'); });
        }
        function catRegister(name) {
            name = String(name || '').trim(); if (!name) return '';
            const ex = (appData.cartao.categories || []).find(c => normKey(c) === normKey(name)); if (ex) return ex;
            appData.cartao.categories.push(name); if (!appData.cartao.catManual) appData.cartao.categories = catSortList(appData.cartao.categories); saveAppData(); return name;
        }
        // lista suspensa de categorias (ordem alfabética) + "Nova categoria…"; vale em qualquer tela
        function catSelect(id, selected, o) {
            o = o || {}; let cats = catAllNames().concat(o.extra || []);
            if (selected && !cats.some(c => c === selected)) cats.push(selected);
            cats = catSortList(cats.filter((c, i) => cats.indexOf(c) === i));
            return `<select id="${id}" data-prev="${esc(selected || '')}" ${o.req ? 'required' : ''} onchange="catPick(this)" class="${o.cls || INP}">${o.blank ? `<option value="">${esc(o.blank)}</option>` : (selected ? '' : '<option value="" disabled selected>Selecione…</option>')}${cats.map(c => `<option value="${esc(c)}" ${c === selected ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="__new__">➕ Nova categoria…</option></select>`;
        }
        function catSetVal(el, v) {
            if (!el) return; if (v && ![...el.options].some(o => o.value === v)) { const op = document.createElement('option'); op.value = v; op.textContent = v; el.insertBefore(op, el.querySelector('option[value="__new__"]')); }
            el.value = v; el.dataset.prev = v;
        }
        function catPick(el) {
            if (el.value !== '__new__') { el.dataset.prev = el.value; return; }
            const n = prompt('Nome da nova categoria:'); const prev = el.dataset.prev || '';
            if (!n || !n.trim()) { el.value = prev; return; }
            const r = catRegister(catResolveNew(n.trim())); if (!r) { el.value = prev; return; }
            catSetVal(el, r); el.dispatchEvent(new Event('input', { bubbles: true }));
        }
        function catAllNames() {
            const s = new Set(appData.cartao.categories || []);
            ((appData.plano && appData.plano.recs) || []).forEach(r => { if (r.category) s.add(r.category); });
            appData.financeiro.transactions.forEach(t => { if (t.category && !t.cardInvoice && t.type !== 'transferencia') s.add(t.category); });
            appData.cartao.entries.forEach(e => { if (e.category) s.add(e.category); });
            (appData.plano && appData.plano.budgets || []).forEach(b => { if (b.category) s.add(b.category); });
            return catSortList([...s].filter(Boolean));
        }
        function catCount(c) { return appData.financeiro.transactions.filter(t => t.category === c && !t.cardInvoice).length + appData.cartao.entries.filter(e => e.category === c).length; }
        function catLev(a, b) { const m = a.length, n = b.length; let p = Array.from({ length: n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
        function catSim(a, b) { const x = normKey(a), y = normKey(b); if (!x || !y) return false; if (x === y) return true; if (Math.min(x.length, y.length) < 5) return false; return catLev(x, y) <= 1; }
        function catFindSimilar(name, list) { return (list || catAllNames()).find(c => c !== name && catSim(c, name)); }
        // nome novo digitado: se já existir parecido, pergunta qual usar
        function catResolveNew(name, list) {
            name = String(name || '').trim(); if (!name) return name;
            const L = list || catAllNames(); if (L.includes(name)) return name;
            const sim = catFindSimilar(name, L); if (!sim) return name;
            return confirm(`Já existe a categoria "${sim}", parecida com "${name}".\n\nOK = usar "${sim}" no lugar\nCancelar = criar "${name}" mesmo assim`) ? sim : name;
        }
        function catRename(from, to) {
            appData.financeiro.transactions.forEach(t => { if (t.category === from) t.category = to; });
            appData.cartao.entries.forEach(e => { if (e.category === from) e.category = to; });
            const cc = appData.cartao.categories.map(c => c === from ? to : c); appData.cartao.categories = cc.filter((c, i) => cc.indexOf(c) === i);
            if (appData.plano) { (appData.plano.budgets || []).forEach(b => { if (b.category === from) b.category = to; }); (appData.plano.recs || []).forEach(b => { if (b.category === from) b.category = to; }); }
        }
        // ---- Configurações › Editar categorias: inserir, renomear, excluir e ordenar ----
        function openCatManager() {
            const C = appData.cartao; catSyncReg();
            const cats = C.categories.slice();
            showModal('Editar categorias', `<p class="text-xs text-slate-500 mb-3">Vale para Financeiro, Cartão e Planejamento. ${C.catManual ? 'Ordem <b>manual</b>.' : 'Ordem <b>A–Z</b> (ao usar as setas passa a ser manual).'}</p>
                <form onsubmit="catMgrAdd(event)" class="flex gap-2 mb-3"><input id="cm-new" required placeholder="Nova categoria" class="${INP}"><button class="bg-teal-600 text-white px-4 rounded-xl text-sm font-bold">Adicionar</button></form>
                <div class="space-y-1.5 max-h-[50vh] overflow-y-auto">${cats.map((c, i) => `<div class="flex items-center gap-1.5 p-2 rounded-xl bg-slate-50 dark:bg-slate-700/40"><span class="flex-1 min-w-0 truncate text-sm font-semibold">${esc(c)} <span class="text-[10px] font-normal text-slate-400">${catCount(c)}</span></span>
                    <button onclick="catMgrMove(${i},-1)" ${i === 0 ? 'disabled' : ''} class="px-2 py-1.5 bg-white dark:bg-slate-700 rounded-lg text-xs disabled:opacity-30"><i class="fa-solid fa-arrow-up"></i></button>
                    <button onclick="catMgrMove(${i},1)" ${i === cats.length - 1 ? 'disabled' : ''} class="px-2 py-1.5 bg-white dark:bg-slate-700 rounded-lg text-xs disabled:opacity-30"><i class="fa-solid fa-arrow-down"></i></button>
                    <button onclick="catMgrRename(${i})" class="px-2 py-1.5 bg-white dark:bg-slate-700 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="catMgrDel(${i})" class="px-2 py-1.5 bg-white dark:bg-slate-700 rounded-lg text-xs hover:text-rose-600"><i class="fa-solid fa-trash"></i></button></div>`).join('') || '<p class="text-sm text-slate-400 text-center py-4">Nenhuma categoria.</p>'}</div>
                <div class="flex gap-2 mt-3"><button onclick="catMgrAZ()" class="flex-1 bg-slate-100 dark:bg-slate-700 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-arrow-down-a-z mr-1"></i>Ordenar A–Z</button><button onclick="openCatMerge()" class="flex-1 bg-slate-100 dark:bg-slate-700 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-code-merge mr-1"></i>Unificar parecidas</button></div>`);
        }
        function catSyncReg() { const C = appData.cartao; catAllNames().forEach(c => { if (!C.categories.includes(c)) C.categories.push(c); }); if (!C.catManual) C.categories = catSortList(C.categories); }
        function catMgrDone() { saveAppData(); openCatManager(); renderCurrentTabContent(); }
        function catMgrAdd(e) { e.preventDefault(); const n = document.getElementById('cm-new').value.trim(); if (!n) return; const r = catResolveNew(n); catRegister(r); openCatManager(); }
        function catMgrMove(i, d) { const C = appData.cartao, a = C.categories, j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; C.catManual = true; catMgrDone(); }
        function catMgrAZ() { const C = appData.cartao; C.catManual = false; C.categories = catSortList(C.categories); catMgrDone(); }
        function catMgrRename(i) {
            const C = appData.cartao, old = C.categories[i], n = (prompt('Novo nome da categoria:', old) || '').trim(); if (!n || n === old) return;
            const ex = C.categories.find(c => c !== old && normKey(c) === normKey(n));
            if (ex) { if (!confirm(`"${ex}" já existe. Juntar "${old}" em "${ex}"?`)) return; catRename(old, ex); C.categories = C.categories.filter(c => c !== old); }
            else { catRename(old, n); }
            catMgrDone();
        }
        function catMgrDel(i) {
            const C = appData.cartao, old = C.categories[i], n = catCount(old);
            if (n) { if (!confirm(`"${old}" é usada em ${n} lançamento(s). Eles passarão para "Outros". Excluir mesmo assim?`)) return; catRegister('Outros'); catRename(old, 'Outros'); }
            else if (!confirm(`Excluir a categoria "${old}"?`)) return;
            C.categories = C.categories.filter(c => c !== old); catMgrDone();
        }
        function openCatMerge() {
            const acc = s => /[^\x00-\x7F]/.test(s) ? 1 : 0, all = catAllNames().sort((a, b) => (catCount(b) - catCount(a)) || (acc(b) - acc(a))), used = new Set(), groups = [];
            all.forEach(a => { if (used.has(a)) return; const g = all.filter(b => b === a || (!used.has(b) && catSim(a, b))); if (g.length > 1) { g.forEach(x => used.add(x)); groups.push(g); } });
            window._cmGroups = groups;
            showModal('Unificar categorias parecidas', groups.length ? `<p class="text-xs text-slate-500 mb-3">Escolha qual nome manter em cada grupo. Os lançamentos (Financeiro e Cartão) das outras grafias passam para o nome escolhido.</p>
                <div class="space-y-3 max-h-[55vh] overflow-y-auto">${groups.map((g, gi) => `<div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40 space-y-1.5"><p class="text-[11px] font-bold uppercase text-slate-400">Manter qual?</p>
                    ${g.map((c, i) => `<label class="flex items-center gap-2 text-sm"><input type="radio" name="cm${gi}" value="${i}" ${i === 0 ? 'checked' : ''}> <b>${esc(c)}</b> <span class="text-xs text-slate-400">(${catCount(c)} lançamento(s))</span></label>`).join('')}
                    <label class="flex items-center gap-2 text-xs text-slate-500"><input type="radio" name="cm${gi}" value="-1"> Não unificar</label></div>`).join('')}</div>
                <button onclick="applyCatMerge()" class="w-full mt-4 bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Unificar</button>` : '<p class="text-sm text-slate-500 py-4 text-center">Nenhuma categoria parecida encontrada. 👍</p>');
        }
        function applyCatMerge() {
            let n = 0;
            (window._cmGroups || []).forEach((g, gi) => { const r = document.querySelector(`input[name="cm${gi}"]:checked`), v = r ? Number(r.value) : -1; if (v < 0) return; g.forEach(c => { if (c !== g[v]) { catRename(c, g[v]); n++; } }); });
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast(n ? `${n} categoria(s) unificada(s).` : 'Nada alterado.', n ? 'success' : 'info');
        }
        function finDescSuggest() {
            const d = document.getElementById('fin-desc'), c = document.getElementById('fin-category'); if (!d || !c || c.dataset.manual === '1') return;
            const last = catLastUsed(d.value); if (last) { catSetVal(c, last); c.dataset.auto = '1'; }
        }
        function normKey(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
        function parseDateAny(v) {
