                    <div class="flex flex-wrap gap-1.5 mt-2"><button onclick="plInvAporte('${i.id}')" class="${PL_BTN2} !text-teal-700"><i class="fa-solid fa-plus mr-1"></i>Aporte / atualizar saldo</button></div>
                    ${(i.aportes || []).length ? `<div class="mt-2 max-h-20 overflow-y-auto text-[11px] text-slate-500 space-y-0.5">${i.aportes.slice().reverse().map(a => `<div class="flex justify-between"><span>${fmtBR(a.date)}</span><span>${R$(a.amount)} <button onclick="plInvAporteDel('${i.id}','${a.id}')" class="text-slate-300 hover:text-rose-600 ml-1"><i class="fa-solid fa-xmark"></i></button></span></div>`).join('')}</div>` : ''}
                </div>`; }).join('')}</div>` : '<p class="text-sm text-slate-400 text-center py-8">Nenhuma aplicação cadastrada.</p>'}
                <p class="text-[11px] text-slate-400 mt-4">O "% do CDI" é uma estimativa: compara o que a aplicação rendeu desde os aportes (data média ponderada) com o CDI de <b>${String(plCdi()).replace('.', ',')}% a.a.</b> (o mesmo da tela Análise do Financeiro; ajuste lá). Não considera IR nem taxas, e só aparece depois de 20 dias.</p></div>`;
        }

        // ---------- 8) Dívidas e financiamentos ----------
        // juros só entram nas contas quando você preenche "Juros ao mês"; vazio = sem juros
        function plDebtRate(d) { const t = Number(d.taxa); return t > 0 ? t / 100 : 0; }
        // k = daqui a quantos meses (0 = já), modo 'prazo' ou 'parcela'
        function plDebtSim(d, extra, k, modo) {
            const i = plDebtRate(d), pmt = Number(d.parcela) || 0, n = Math.round(Number(d.parcelas) || 0);
            let bal = Number(d.saldo) || 0, paid = 0, months = 0;
            const base = pmt * n;
            for (let m = 0; m < k && m < n; m++) { const jur = bal * i; bal = bal + jur - pmt; paid += pmt; months++; if (bal <= 0) break; }
            const ex = Math.min(extra, Math.max(0, bal)); bal = Math.max(0, bal - ex); paid += ex;
            const restN = n - months;
            let newN = restN, newP = pmt;
            if (bal <= 0.005) { newN = 0; newP = 0; }
            else if (modo === 'parcela') { newP = i > 0 ? bal * i / (1 - Math.pow(1 + i, -restN)) : bal / restN; paid += newP * restN; }
            else { let b = bal, c = 0; while (b > 0.005 && c < 1200) { b = b * (1 + i) - pmt; paid += pmt; c++; if (b < 0) { paid += b; } } newN = c; }
            return { rate: i, economia: Math.max(0, base - paid), pago: paid, novaParcela: newP, restantes: modo === 'parcela' ? restN : newN, orig: restN, base };
        }
        function plSimDebt(id) {
            const d = plano().debts.find(x => x.id === id); if (!d) return;
            showModal('Simular amortização · ' + esc(d.name), `<div class="space-y-3">
                <p class="text-xs text-slate-500">${Number(d.taxa) > 0 ? `Juros considerados: <b>${String(d.taxa).replace('.', ',')}% ao mês</b>.` : 'Sem juros informado: a simulação considera só o valor das parcelas (preencha o juros ao mês na dívida para incluir).'}</p>
                <div class="grid grid-cols-2 gap-3"><div><label class="${LBL}">Valor a amortizar (R$)</label><input id="ps-v" inputmode="decimal" oninput="plSimCalc('${id}')" class="${INP}" placeholder="10000"></div><div><label class="${LBL}">Daqui a quantos meses</label><input id="ps-k" inputmode="numeric" value="0" oninput="plSimCalc('${id}')" class="${INP}"></div></div>
                <div><label class="${LBL}">Depois de amortizar</label><select id="ps-m" onchange="plSimCalc('${id}')" class="${INP}"><option value="prazo">Reduzir o prazo (mantém a parcela)</option><option value="parcela">Reduzir a parcela (mantém o prazo)</option></select></div>
                <div id="ps-out" class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/40 text-sm text-slate-500">Informe um valor para ver a economia.</div></div>`);
        }
        function plSimCalc(id) {
            const d = plano().debts.find(x => x.id === id), out = document.getElementById('ps-out'); if (!d || !out) return;
            const v = recNum(document.getElementById('ps-v').value), k = Math.max(0, parseInt(document.getElementById('ps-k').value) || 0), m = document.getElementById('ps-m').value;
            if (v <= 0) { out.textContent = 'Informe um valor para ver a economia.'; return; }
            const s = plDebtSim(d, v, k, m);
            out.innerHTML = `<p>Sem amortizar, você pagaria ao todo <b>${R$(s.base)}</b> até o fim.</p><p class="mt-1">Amortizando ${R$(v)} ${k ? 'daqui a ' + k + ' mês(es)' : 'agora'}: pagaria <b>${R$(s.pago)}</b> (já contando o valor amortizado).</p>
                <p class="mt-2 text-base ${s.economia > 0 ? 'text-emerald-600' : 'text-slate-600'} font-bold">Economia de juros: ${R$(s.economia)}</p>
                <p class="text-xs mt-1">${m === 'prazo' ? `Prazo cai de ${s.orig} para ${s.restantes} parcela(s) restantes.` : `Parcela cai de ${R$(d.parcela)} para ${R$(s.novaParcela)}.`}</p>`;
        }
        // ---- baixa automática: lançamentos do Financeiro ligados a uma dívida ajustam saldo e parcelas ----
        function plDebtPaidCount(d) { const parc = Number(d.parcela) || 0; if (!(parc > 0)) return 0; return Math.floor(((d.pagos || []).reduce((s, p) => s + (Number(p.amount) || 0), 0) + 0.005) / parc + 1e-9); }
        function plDebtPaidSum(d) { return (d.pagos || []).reduce((s, p) => s + (Number(p.amount) || 0), 0); }
        // Saldo e parcelas são SEMPRE calculados a partir do que você cadastrou (saldoBase / parcelasBase) menos os pagamentos
        // vinculados e baixados no Financeiro. Assim nunca "derivam": apagar ou desfazer uma baixa volta tudo ao normal.
        function plDebtSetBase(d) { d.saldoBase = Math.round(((Number(d.saldo) || 0) + plDebtPaidSum(d)) * 100) / 100; d.parcelasBase = (Number(d.parcelas) || 0) + plDebtPaidCount(d); }
        function plDebtReconcile() {
            const P = appData.plano; if (!P || !Array.isArray(P.debts) || !P.debts.length) return;
            const txs = appData.financeiro.transactions, byId = {}; txs.forEach(t => { byId[t.id] = t; });
            P.debts.forEach(d => {
                if (!Array.isArray(d.pagos)) d.pagos = [];
                const before = d.pagos.length;
                const okTx = (p, t) => t && t.debtId === d.id && t.type === 'despesa' && finSt(t) !== 'pendente' && Math.abs((Number(t.amount) || 0) - p.amount) < 0.005;
                if (d.saldoBase === undefined) {
                    // migração: o que está na tela hoje vale; pagamentos antigos inválidos são desfeitos como antes
                    const valid = [];
                    d.pagos.forEach(p => { if (okTx(p, byId[p.txId])) valid.push({ v: 5, txId: p.txId, date: p.date, amount: p.amount }); else { d.saldo = Math.round(((Number(d.saldo) || 0) - (p.dSaldo || 0)) * 100) / 100; d.parcelas = (Number(d.parcelas) || 0) - (p.dParcelas || 0); } });
                    d.pagos = valid;
                    const parc = Number(d.parcela) || 0, saldo = Number(d.saldo) || 0;
                    if (valid.length && !(Number(d.taxa) > 0) && parc > 0 && saldo > 0.005) d.parcelas = Math.ceil(saldo / parc - 0.005);
                    plDebtSetBase(d);
                }
                d.pagos = d.pagos.filter(p => okTx(p, byId[p.txId]));
                txs.filter(t => t.debtId === d.id && t.type === 'despesa' && finSt(t) !== 'pendente' && !d.pagos.some(p => p.txId === t.id)).sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(t => d.pagos.push({ v: 5, txId: t.id, date: t.date, amount: Number(t.amount) || 0 }));
                const S = plDebtPaidSum(d), novoSaldo = Math.round(Math.max(0, (Number(d.saldoBase) || 0) - S) * 100) / 100;
                const changed = d.pagos.length !== before || novoSaldo !== d.saldo;
                d.saldo = novoSaldo;
                d.parcelas = novoSaldo <= 0.005 ? 0 : Math.max(0, (Number(d.parcelasBase) || 0) - plDebtPaidCount(d));
                if (changed && d.pagos.length > before) { try { showToast(`${d.name}: faltam ${d.parcelas} parcela(s) · falta pagar R$ ${money(d.saldo)}`, 'success'); } catch (e) { } }
            });
        }
        function plDebtTotal() { return plano().debts.reduce((s, d) => s + (Number(d.saldo) || 0), 0); }
        function plRenderDividas() {
            const ds = plano().debts, tot = plDebtTotal();
            return `<div class="${PL_CARD}"><div class="flex flex-wrap items-center justify-between gap-3 mb-3"><h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2"><i class="fa-solid fa-hand-holding-dollar text-teal-500"></i>Dívidas e financiamentos</h3><button onclick="plOpen('debts')" class="${PL_BTN}"><i class="fa-solid fa-plus mr-1"></i>Nova dívida</button></div>
                <p class="text-xs text-slate-500 mb-4">Saldo devedor total: <b class="text-rose-600">${R$(tot)}</b> · parcelas por mês: <b>${R$(ds.reduce((s, d) => s + (Number(d.parcela) || 0), 0))}</b></p>
                ${ds.length ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${ds.map(d => { const total = (Number(d.parcela) || 0) * (Number(d.parcelas) || 0), jur = Math.max(0, total - (Number(d.saldo) || 0)); return `<div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-700">
                    <div class="flex justify-between items-start gap-2"><div class="min-w-0"><p class="font-bold text-slate-800 dark:text-white truncate">${esc(d.name)}</p></div>${plEditBtns('debts', d.id)}</div>
                    ${(() => { const st = (l, v, c) => `<div class="p-2 rounded-xl bg-white dark:bg-slate-800/60 min-w-0"><p class="text-[10px] uppercase font-bold text-slate-400 truncate">${l}</p><p class="font-bold text-sm ${c || ''} break-words">${v}</p></div>`, orig = Number(d.original) || 0, tt = Number(d.parcelasTotal) || 0, rest = Number(d.parcelas) || 0;
                        return `<div class="grid grid-cols-2 gap-2 mt-3">${st('Valor original', orig ? R$(orig) : '—')}${st('Valor pago', orig ? R$(Math.max(0, orig - (Number(d.saldo) || 0))) : '—', 'text-emerald-600')}${st('Falta pagar', R$(d.saldo), Number(d.saldo) > 0 ? 'text-rose-600' : 'text-emerald-600')}${st('Valor da parcela', R$(d.parcela))}${st('Parcelas', tt ? `${Math.max(0, tt - rest)} pagas de ${tt} <span class="block text-[11px] font-semibold text-slate-500">faltam ${rest}</span>` : `faltam ${rest}`)}${st('Juros ao mês', Number(d.taxa) > 0 ? String(d.taxa).replace('.', ',') + '%' : '—')}</div>`; })()}
                    ${Number(d.original) > 0 ? (() => { const pg = Math.max(0, Number(d.original) - (Number(d.saldo) || 0)), pc = Math.min(100, pg / Number(d.original) * 100); return `<div class="mt-2"><div class="flex justify-between text-[11px] text-slate-500 mb-1"><span>Original ${R$(d.original)}</span><span><b>${pc.toFixed(0)}%</b> quitado · ${R$(pg)}</span></div><div class="h-2.5 rounded-full bg-slate-200 dark:bg-slate-600 overflow-hidden"><div class="h-full bg-emerald-500" style="width:${pc}%"></div></div></div>`; })() : '<p class="text-[11px] text-amber-600 mt-1">Informe o valor original (editar) para ver o quanto já foi quitado.</p>'}
                    ${Number(d.saldo) > 0 ? `<p class="text-xs text-slate-500 mt-1.5">${Number(d.taxa) > 0 ? `Falta pagar ${R$(total)} no total em parcelas, sendo ${R$(jur)} acima do saldo (juros).` : `Faltam ${d.parcelas} parcela(s) de ${R$(d.parcela)} = ${R$(total)}.`}</p>
                    ${!(Number(d.taxa) > 0) && Math.abs(total - (Number(d.saldo) || 0)) > Math.max(1, (Number(d.parcela) || 0) * 0.5) ? `<p class="text-[11px] text-amber-700 mt-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Não bate: ${d.parcelas} × ${R$(d.parcela)} = ${R$(total)}, mas faltam ${R$(d.saldo)}. Edite a dívida (parcelas que faltam) ou informe o juros ao mês.</p>` : ''}
                    ${!(Number(d.taxa) > 0) && Number(d.original) > 0 && Number(d.parcela) > 0 && Number(d.parcelasTotal) > 0 && Math.abs(Number(d.original) / Number(d.parcela) - Number(d.parcelasTotal)) > 0.6 ? `<p class="text-[11px] text-amber-700 mt-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Original ÷ parcela = ${(Number(d.original) / Number(d.parcela)).toFixed(1).replace('.', ',')} parcelas, mas o total cadastrado é ${d.parcelasTotal}. Confira.</p>` : ''}` : '<p class="text-xs text-emerald-600 font-bold mt-1.5"><i class="fa-solid fa-circle-check mr-1"></i>Dívida quitada!</p>'}
                    ${(d.pagos || []).length ? `<details class="mt-2"><summary class="text-[11px] font-bold text-teal-700 cursor-pointer">${d.pagos.length} pagamento(s) pelo Financeiro</summary><div class="mt-1 max-h-24 overflow-y-auto text-[11px] text-slate-500 space-y-0.5">${d.pagos.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(p => `<div class="flex justify-between"><span>${fmtBR(p.date)} · pagamento</span><b>${R$(p.amount)}</b></div>`).join('')}</div></details>` : ''}
                    <button onclick="plSimDebt('${d.id}')" class="${PL_BTN2} mt-2 !text-teal-700"><i class="fa-solid fa-calculator mr-1"></i>Simular amortização</button></div>`; }).join('')}</div>` : '<p class="text-sm text-slate-400 text-center py-8">Nenhuma dívida cadastrada.</p>'}</div>`;
        }

        // ---------- 6) Patrimônio líquido ----------
        function plNetNow() {
            let contas = 0; contasData().forEach(a => { contas += contaSaldoDash(a.id); });
            const inv = plInvTotal(), bens = plano().assets.reduce((s, a) => s + (Number(a.value) || 0), 0), dv = plDebtTotal();
            let fat = 0; appData.cartao.cards.forEach(c => { const keys = new Set(appData.cartao.entries.filter(e => e.cardId === c.id).map(e => e.invoice)); keys.forEach(k => { const t = cardInvoiceTx(c.id, k); if (!(t && t.status === 'pago')) fat += Math.max(0, cardInvoiceTotal(c.id, k)); }); });
            const ativos = contas + inv + bens, dividas = dv + fat;

        }
        function plSnap() {
            const P = plano(), ym = plCurYM(), n = plNetNow(), cur = P.snaps.find(s => s.ym === ym);
            if (cur && !cur.manual) { if (cur.net === n.net && cur.ativos === n.ativos && cur.dividas === n.dividas) return; Object.assign(cur, { ativos: n.ativos, dividas: n.dividas, net: n.net }); }
            else if (!cur) P.snaps.push({ id: ym, ym, ativos: n.ativos, dividas: n.dividas, net: n.net });
            else return;
            saveAppData();
        }
        function plSnapAdd() {
            showModal('Registrar mês anterior', `<form onsubmit="plSnapSave(event)" class="space-y-3"><p class="text-xs text-slate-500">Para o gráfico começar antes de hoje, informe o patrimônio de um mês passado.</p>
                <div class="grid grid-cols-3 gap-2"><div><label class="${LBL}">Mês</label><input id="sn-ym" type="month" required class="${INP}"></div><div><label class="${LBL}">Ativos</label><input id="sn-a" inputmode="decimal" required class="${INP}"></div><div><label class="${LBL}">Dívidas</label><input id="sn-d" inputmode="decimal" class="${INP}" placeholder="0"></div></div>
                <button class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Salvar</button></form>`);
        }
        function plSnapSave(e) {
            e.preventDefault(); const P = plano(), ym = document.getElementById('sn-ym').value, a = recNum(document.getElementById('sn-a').value), d = recNum(document.getElementById('sn-d').value); if (!ym) return;
            P.snaps = P.snaps.filter(s => s.ym !== ym); P.snaps.push({ id: ym, ym, ativos: a, dividas: d, net: a - d, manual: true });
            saveAppData(); closeModal(); renderCurrentTabContent();
        }
        function plSnapDel(ym) { const P = plano(); P.snaps = P.snaps.filter(s => s.ym !== ym); saveAppData(); renderCurrentTabContent(); }
        function plRenderPatrimonio() {
            plSnap();
            const P = plano(), n = plNetNow(), sn = P.snaps.slice().sort((a, b) => a.ym.localeCompare(b.ym));
            let chart = '';
            if (sn.length >= 2) {
                const W = 600, H = 190, pad = 28, vals = sn.map(s => s.net), mn = Math.min(0, ...vals), mx = Math.max(1, ...vals), x = i => pad + i * (W - 2 * pad) / (sn.length - 1), y = v => H - pad - (v - mn) / (mx - mn || 1) * (H - 2 * pad);
                chart = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-48"><line x1="${pad}" y1="${y(0)}" x2="${W - pad}" y2="${y(0)}" stroke="#cbd5e1" stroke-dasharray="4"/>
                    <polyline fill="none" stroke="#0d9488" stroke-width="3" points="${sn.map((s, i) => x(i) + ',' + y(s.net)).join(' ')}"/>
                    ${sn.map((s, i) => `<circle cx="${x(i)}" cy="${y(s.net)}" r="4" fill="#0d9488"/><text x="${x(i)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#94a3b8">${s.ym.slice(5)}/${s.ym.slice(2, 4)}</text>`).join('')}</svg>`;
            } else chart = '<p class="text-xs text-slate-400 py-6 text-center">O gráfico se forma mês a mês: o app guarda o patrimônio a cada mês em que você abre esta tela. Você também pode registrar meses anteriores.</p>';
            const first = sn[0], delta = first && sn.length > 1 ? n.net - first.net : null;
            const line = (l, v, c) => `<div class="flex justify-between text-sm py-1.5 border-b border-slate-100 dark:border-slate-700"><span>${l}</span><b class="${c || ''}">${R$(v)}</b></div>`;
            return `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div class="${PL_CARD}"><h3 class="font-bold text-lg text-slate-800 dark:text-white mb-1 flex items-center gap-2"><i class="fa-solid fa-landmark text-teal-500"></i>Patrimônio líquido</h3>

            plRows(ym).forEach(r => { if (r.type === 'receita') rec += r.amount; else { des += r.amount; cats[r.category] = (cats[r.category] || 0) + r.amount; } });
            return { rec, des, cats, sobra: rec - des, taxa: rec > 0 ? (rec - des) / rec * 100 : null };
        }
        function plRenderAnalise() {
            const cur = plMonth, prev = ymAdd(cur, -1), T = plMonthTotals(cur), tp = plMonthTotals(prev);
            // comparativo
            const hist = []; for (let i = 1; i <= 6; i++) hist.push(plMonthTotals(ymAdd(cur, -i)));
            const catsAll = new Set([...Object.keys(T.cats), ...Object.keys(tp.cats)]); hist.forEach(h => Object.keys(h.cats).forEach(c => catsAll.add(c)));
            const rowsC = [...catsAll].map(c => { const v = T.cats[c] || 0, p = tp.cats[c] || 0, avg = hist.reduce((s, h) => s + (h.cats[c] || 0), 0) / 6; return { c, v, p, avg }; }).filter(x => x.v || x.p || x.avg).sort((a, b) => b.v - a.v);
            const dl = (v, b) => { if (!b && !v) return '<span class="text-slate-300">—</span>'; if (!b) return '<span class="text-amber-600 text-xs">novo</span>'; const d = (v - b) / b * 100; return `<span class="${d > 5 ? 'text-rose-600' : d < -5 ? 'text-emerald-600' : 'text-slate-500'} font-bold text-xs">${d > 0 ? '▲' : d < 0 ? '▼' : ''} ${Math.abs(d).toFixed(0)}%</span>`; };
            // poupança 6 meses
            const meses = []; for (let i = 5; i >= 0; i--) { const m = ymAdd(cur, -i); meses.push(Object.assign({ ym: m }, plMonthTotals(m))); }
            // 50/30/20
            let nec = 0, des2 = 0, poup = 0; const catList = Object.entries(T.cats).sort((a, b) => b[1] - a[1]);
            catList.forEach(([c, v]) => { const k = plClassOf(c); if (k === 'necessidade') nec += v; else if (k === 'poupanca') poup += v; else des2 += v; });
            poup += Math.max(0, T.sobra); const rendaBase = T.rec || 0;
            const pc = v => rendaBase > 0 ? v / rendaBase * 100 : 0;
            const bar = (l, v, ideal, cor) => `<div class="mb-3"><div class="flex justify-between text-sm"><span class="font-semibold">${l}</span><span><b>${pc(v).toFixed(0)}%</b> <span class="text-slate-400 text-xs">(ideal ${ideal}%) · ${R$(v)}</span></span></div><div class="relative h-3 rounded-full bg-slate-100 dark:bg-slate-700 overflow-hidden"><div class="h-full ${cor}" style="width:${Math.min(100, pc(v))}%"></div><div class="absolute top-0 bottom-0 w-0.5 bg-slate-800/60" style="left:${ideal}%"></div></div></div>`;
            return `<div class="flex items-center justify-between gap-3"><h3 class="font-bold text-lg text-slate-800 dark:text-white">Análise de ${fmtYM(cur)}</h3>${plMonthNav()}</div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div class="${PL_CARD}"><h4 class="font-bold text-slate-800 dark:text-white mb-1 flex items-center gap-2"><i class="fa-solid fa-piggy-bank text-teal-500"></i>Taxa de poupança</h4>
                    <p class="text-4xl font-extrabold ${T.taxa === null ? 'text-slate-400' : T.taxa >= 20 ? 'text-emerald-600' : T.taxa >= 0 ? 'text-amber-600' : 'text-rose-600'}">${T.taxa === null ? '—' : T.taxa.toFixed(1).replace('.', ',') + '%'}</p>
                    <p class="text-xs text-slate-500 mb-3">Receitas ${R$(T.rec)} − despesas ${R$(T.des)} = <b>${R$(T.sobra)}</b> ${T.taxa === null ? '(sem receitas lançadas no mês)' : 'da renda que sobrou'}. Referência: 20% ou mais.</p>
                    <div class="flex items-end gap-1.5 h-24">${meses.map(m => `<div class="flex-1 flex flex-col items-center justify-end h-full"><span class="text-[9px] text-slate-500">${m.taxa === null ? '' : Math.round(m.taxa) + '%'}</span><div class="w-full rounded-t ${m.taxa === null ? 'bg-slate-200' : m.taxa < 0 ? 'bg-rose-400' : m.taxa >= 20 ? 'bg-emerald-500' : 'bg-amber-400'}" style="height:${m.taxa === null ? 4 : Math.max(4, Math.min(100, Math.abs(m.taxa)))}%"></div><span class="text-[9px] text-slate-400 mt-0.5">${fmtYM(m.ym).slice(0, 3)}</span></div>`).join('')}</div></div>
                <div class="${PL_CARD}"><h4 class="font-bold text-slate-800 dark:text-white mb-3 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-teal-500"></i>Regra 50/30/20</h4>
                    ${rendaBase > 0 ? bar('Necessidades', nec, 50, 'bg-sky-500') + bar('Desejos', des2, 30, 'bg-amber-500') + bar('Poupança / sobra', poup, 20, 'bg-emerald-500') : '<p class="text-sm text-slate-400">Lance as receitas do mês para comparar com o ideal.</p>'}
                    ${catList.length ? `<details class="mt-2"><summary class="text-xs font-bold text-teal-700 cursor-pointer">Classificar categorias</summary><div class="mt-2 space-y-1">${catList.map(([c, v]) => `<div class="flex items-center justify-between gap-2 text-xs"><span class="truncate">${esc(c)} <span class="text-slate-400">${R$(v)}</span></span><select onchange="plSetClass('${encodeURIComponent(c)}',this.value)" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900"><option value="necessidade" ${plClassOf(c) === 'necessidade' ? 'selected' : ''}>Necessidade</option><option value="desejo" ${plClassOf(c) === 'desejo' ? 'selected' : ''}>Desejo</option><option value="poupanca" ${plClassOf(c) === 'poupanca' ? 'selected' : ''}>Poupança</option></select></div>`).join('')}</div></details>` : ''}</div>
                <div class="${PL_CARD} lg:col-span-2"><h4 class="font-bold text-slate-800 dark:text-white mb-3 flex items-center gap-2"><i class="fa-solid fa-code-compare text-teal-500"></i>Comparativo por categoria</h4>
                    ${rowsC.length ? `<div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="text-[11px] uppercase text-slate-400"><tr><th class="py-1.5">Categoria</th><th class="text-right">${fmtYM(cur).split(' ')[0].slice(0, 3)}</th><th class="text-right">${fmtYM(prev).split(' ')[0].slice(0, 3)}</th><th class="text-right">vs mês ant.</th><th class="text-right">Média 6m</th><th class="text-right">vs média</th></tr></thead>
                    <tbody class="divide-y divide-slate-100 dark:divide-slate-700">${rowsC.map(x => `<tr><td class="py-1.5 font-medium">${esc(x.c)}</td><td class="text-right">${R$(x.v)}</td><td class="text-right text-slate-500">${R$(x.p)}</td><td class="text-right">${dl(x.v, x.p)}</td><td class="text-right text-slate-500">${R$(x.avg)}</td><td class="text-right">${dl(x.v, x.avg)}</td></tr>`).join('')}
                    <tr class="font-bold"><td class="py-1.5">Total de despesas</td><td class="text-right">${R$(T.des)}</td><td class="text-right">${R$(tp.des)}</td><td class="text-right">${dl(T.des, tp.des)}</td><td class="text-right">${R$(hist.reduce((s, h) => s + h.des, 0) / 6)}</td><td class="text-right">${dl(T.des, hist.reduce((s, h) => s + h.des, 0) / 6)}</td></tr></tbody></table></div>` : '<p class="text-sm text-slate-400 text-center py-6">Sem despesas para comparar.</p>'}
                    <p class="text-[11px] text-slate-400 mt-2">Vermelho = gastou mais (acima de 5%); verde = gastou menos. A média considera os 6 meses anteriores ao mês escolhido.</p></div></div>`;
        }

        // ---------- 11) Imposto de Renda: despesas dedutíveis ----------
        const PL_IR = { saude: 'Saúde', educacao: 'Educação', previdencia: 'Previdência (PGBL)', outros: 'Outras dedutíveis' };
        function plIRItems() {
            const out = appData.financeiro.transactions.filter(t => t.dedutivel && t.type === 'despesa');
            appData.cartao.entries.forEach(e => { if (e.dedutivel && Number(e.amount) > 0) { const c = cardById(e.cardId); out.push({ id: e.id, date: e.date, desc: e.name + ' (cartão)', amount: Number(e.amount), dedutivel: e.dedutivel, attachments: [], owner: e.owner ? e.owner : (c && c.shared ? 'casa' : ((c && c.owner) || '')) }); } });
            return out;
        }
        function plRenderIR() {
            const anos = new Set([plAnoIR]); plIRItems().forEach(t => { if (t.date) anos.add(t.date.slice(0, 4)); });
            const list = plIRItems().filter(t => (t.date || '').startsWith(plAnoIR) && plVisible(t.owner || '')).sort((a, b) => a.date.localeCompare(b.date));
            const by = {}; list.forEach(t => { by[t.dedutivel] = (by[t.dedutivel] || 0) + (Number(t.amount) || 0); });
            const tot = list.reduce((s, t) => s + (Number(t.amount) || 0), 0), semComp = list.filter(t => !(t.attachments || []).length).length;
            return `<div class="${PL_CARD}"><div class="flex flex-wrap items-center justify-between gap-3 mb-4"><h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2"><i class="fa-solid fa-file-invoice text-teal-500"></i>Despesas dedutíveis no Imposto de Renda</h3>
                <div class="flex items-center gap-2"><select onchange="plAnoIR=this.value;renderCurrentTabContent()" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm">${[...anos].sort().reverse().map(a => `<option ${a === plAnoIR ? 'selected' : ''}>${a}</option>`).join('')}</select><button onclick="plIRCsv()" class="${PL_BTN}"><i class="fa-solid fa-download mr-1"></i>Baixar resumo (CSV)</button></div></div>
                <p class="text-xs text-slate-500 mb-4">Marque o campo <b>"Dedutível no IR"</b> ao lançar a despesa no Financeiro (saúde, educação, previdência). Anexe o recibo no próprio lançamento. Total ${plAnoIR}: <b>${R$(tot)}</b>.</p>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">${Object.entries(PL_IR).map(([k, l]) => `<div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/40"><p class="text-[10px] uppercase font-bold text-slate-400">${l}</p><p class="font-bold">${R$(by[k] || 0)}</p></div>`).join('')}</div>
                ${semComp ? `<p class="text-xs text-amber-700 mb-3"><i class="fa-solid fa-paperclip mr-1"></i>${semComp} lançamento(s) sem comprovante anexado.</p>` : ''}
                ${list.length ? `<div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="text-[11px] uppercase text-slate-400"><tr><th class="py-1.5">Data</th><th>Descrição</th><th>Tipo</th><th class="text-right">Valor</th><th class="text-center">Comprov.</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-700">${list.map(t => `<tr><td class="py-1.5 whitespace-nowrap">${fmtBR(t.date)}</td><td>${esc(t.desc)}</td><td class="text-xs">${PL_IR[t.dedutivel] || ''}</td><td class="text-right whitespace-nowrap">${R$(t.amount)}</td><td class="text-center">${(t.attachments || []).length ? '<i class="fa-solid fa-paperclip text-teal-600"></i> ' + t.attachments.length : '<span class="text-slate-300">—</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="text-sm text-slate-400 text-center py-6">Nenhuma despesa marcada como dedutível em ' + plAnoIR + '.</p>'}</div>`;
        }
        function plIRCsv() {
            const list = plIRItems().filter(t => (t.date || '').startsWith(plAnoIR)).sort((a, b) => a.date.localeCompare(b.date));
            const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
            const lines = [['Data', 'Descrição', 'Tipo', 'Valor', 'Comprovantes'].map(q).join(';')].concat(list.map(t => [fmtBR(t.date), t.desc, PL_IR[t.dedutivel] || '', Number(t.amount).toFixed(2).replace('.', ','), (t.attachments || []).length].map(q).join(';')));
            const by = {}; list.forEach(t => { by[t.dedutivel] = (by[t.dedutivel] || 0) + (Number(t.amount) || 0); });
            lines.push('', ['Resumo', '', '', '', ''].map(q).join(';')); Object.entries(by).forEach(([k, v]) => lines.push([PL_IR[k] || k, '', '', v.toFixed(2).replace('.', ','), ''].map(q).join(';')));
            const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), url = URL.createObjectURL(blob), a = document.createElement('a');
            a.href = url; a.download = 'dedutiveis-IR-' + plAnoIR + '.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 4000);
        }

        // ---------- Importar extrato bancário (OFX / CSV) para o Financeiro ----------
        let extRows = [];
        function openExtratoImport() {
            const cs = contasData();
            showModal('Importar extrato bancário', `<p class="text-xs text-slate-500 mb-3">Envie o extrato em <b>OFX</b> ou <b>CSV</b>. Valores positivos viram receita e negativos viram despesa. Você revisa antes de importar.</p>
                <label class="${LBL}">Cartão / conta do extrato</label><select id="ex-acc" class="${INP} mb-3"><option value="">— sem conta —</option>${cs.map(a => `<option value="${a.id}">${esc(accLabel(a))}</option>`).join('')}</select>
                <input type="file" id="ex-file" accept=".ofx,.qfx,.csv,.txt" onchange="extratoRead(this)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs"><p id="ex-msg" class="text-xs text-slate-400 mt-3"></p><div id="ex-list"></div>`);
        }
        async function extratoRead(input) {
            const f = input.files[0]; if (!f) return; const msg = document.getElementById('ex-msg');
            try {
                const ext = f.name.split('.').pop().toLowerCase(), txt = await f.text();
                const raw = (ext === 'ofx' || ext === 'qfx') ? parseOfx(txt) : parseCsvFatura(txt);
                if (!raw.length) throw new Error('Não encontrei lançamentos neste arquivo.');
                const known = {}; appData.financeiro.transactions.forEach(t => { if (t.desc && t.category) known[normKey(t.desc)] = t.category; });
                const dup = new Set(appData.financeiro.transactions.map(t => t.date + '|' + (Number(t.amount) || 0).toFixed(2)));
                extRows = raw.map((r, i) => ({ i, date: r.date, name: r.name, amount: Math.abs(r.signed), type: r.signed >= 0 ? 'receita' : 'despesa', cat: known[normKey(r.name)] || (r.signed >= 0 ? 'Receita' : 'Outros'), dup: dup.has(r.date + '|' + Math.abs(r.signed).toFixed(2)) }));
                msg.textContent = extRows.length + ' lançamento(s) encontrado(s)' + (extRows.some(r => r.dup) ? ' — os que parecem repetidos vêm desmarcados.' : '.');
                document.getElementById('ex-list').innerHTML = `<div class="max-h-[45vh] overflow-y-auto mt-2 space-y-1">${extRows.map(r => `<label class="flex items-center gap-2 p-2 rounded-lg bg-slate-50 dark:bg-slate-700/40 text-xs"><input type="checkbox" class="ex-ck" data-i="${r.i}" ${r.dup ? '' : 'checked'}><span class="w-14 text-slate-400">${fmtBR(r.date).slice(0, 5)}</span><span class="flex-1 truncate">${esc(r.name)}${r.dup ? ' <b class="text-amber-600">(repetido?)</b>' : ''}</span><b class="${r.type === 'receita' ? 'text-emerald-600' : 'text-rose-600'}">${r.type === 'receita' ? '+' : '-'}${money(r.amount)}</b></label>`).join('')}</div>
                    <button onclick="extratoCommit()" class="w-full mt-3 bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Importar selecionados</button>`;
            } catch (e) { msg.className = 'text-xs text-rose-500 mt-3'; msg.textContent = e.message || 'Erro ao ler o arquivo.'; }
        }
        function extratoCommit() {
            const acc = document.getElementById('ex-acc').value; let n = 0;
            document.querySelectorAll('.ex-ck:checked').forEach(ck => {
                const r = extRows[Number(ck.dataset.i)]; if (!r) return;
                appData.financeiro.transactions.push({ id: uid(), type: r.type, status: r.type === 'receita' ? 'recebido' : 'pago', desc: r.name, amount: r.amount.toFixed(2), category: r.cat, date: r.date, accId: acc, toAccId: '', attachments: [] }); n++;
            });
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast(n + ' lançamento(s) importado(s).', 'success');
        }

        // ========== HABITAÇÃO › EVOLUÇÃO (fotos e vídeos agrupados por data) ==========
        function evoData() { const H = appData.habitacao; if (!Array.isArray(H.evolucao)) H.evolucao = []; return H.evolucao; }
        const _evoUrls = {};
        function openEvoView() { habEvoOpen = true; renderCurrentTabContent(); window.scrollTo(0, 0); }
        function closeEvoView() { habEvoOpen = false; renderCurrentTabContent(); }
        function evoIsVideo(f) { return (f.type || '').startsWith('video/') || /\.(mp4|mov|webm|m4v|3gp)$/i.test(f.name || ''); }
        function renderHabEvo(container) {
            const list = evoData().slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || String(b.id).localeCompare(String(a.id)));
            const nF = list.reduce((s, g) => s + (g.files || []).length, 0);
            const thumb = (g, f) => evoIsVideo(f)
                ? `<div class="relative aspect-square rounded-xl bg-slate-800 overflow-hidden cursor-pointer" onclick="openStoredFile('${f.id}')"><video data-evo="${f.id}" class="w-full h-full object-cover" muted playsinline preload="metadata"></video><span class="absolute inset-0 flex items-center justify-center text-white text-2xl drop-shadow"><i class="fa-solid fa-circle-play"></i></span>
                    <button onclick="event.stopPropagation();evoRemoveFile('${g.id}','${f.id}')" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/60 text-white text-[10px]"><i class="fa-solid fa-xmark"></i></button></div>`
                : `<div class="relative aspect-square rounded-xl bg-slate-100 dark:bg-slate-700 overflow-hidden cursor-pointer" onclick="openStoredFile('${f.id}')"><img data-evo="${f.id}" class="w-full h-full object-cover" alt="">
                    <button onclick="event.stopPropagation();evoRemoveFile('${g.id}','${f.id}')" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/60 text-white text-[10px]"><i class="fa-solid fa-xmark"></i></button></div>`;
            container.innerHTML = `<div class="space-y-6 max-w-7xl mx-auto">
                <div class="bg-gradient-to-r from-teal-700 to-teal-600 rounded-3xl p-5 text-white flex flex-wrap items-center justify-between gap-3">
                    <div><button onclick="closeEvoView()" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/20 hover:bg-white/30 mb-2"><i class="fa-solid fa-arrow-left mr-1"></i>Voltar para Habitação</button>
                    <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-camera-retro"></i>Evolução da obra</h2>
                    <p class="text-xs opacity-80">${list.length} registro(s) · ${nF} arquivo(s)</p></div>
                    <button onclick="openEvoModal()" class="bg-amber-400 hover:bg-amber-500 text-teal-950 font-bold px-4 py-2.5 rounded-xl shadow-lg text-sm"><i class="fa-solid fa-plus mr-1"></i>Novo registro</button>
                </div>
                ${list.length ? list.map(g => `
                <div class="bg-white dark:bg-slate-800 rounded-3xl p-5 shadow-sm border border-slate-100 dark:border-slate-700">
                    <div class="flex items-start justify-between gap-2 mb-3">
                        <div class="min-w-0"><h3 class="font-bold text-slate-800 dark:text-white"><i class="fa-regular fa-calendar mr-1.5 text-teal-600"></i>${g.date ? fmtBR(g.date) : 'Sem data'}${g.title ? ' · ' + esc(g.title) : ''}</h3>
                        ${g.obs ? `<p class="text-xs text-slate-500 mt-1 whitespace-pre-line">${esc(g.obs)}</p>` : ''}</div>
                        <div class="flex gap-1 shrink-0">
                            <button onclick="evoAddFiles('${g.id}')" class="px-2.5 py-1.5 bg-teal-50 dark:bg-slate-700 text-teal-700 dark:text-teal-300 rounded-lg text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>Fotos/vídeos</button>
                            <button onclick="openEvoModal('${g.id}')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteEvo('${g.id}')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 rounded-lg text-xs hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    ${(g.files || []).length ? `<div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">${g.files.map(f => thumb(g, f)).join('')}</div>` : '<p class="text-xs text-slate-400">Nenhuma foto ou vídeo neste registro.</p>'}
                </div>`).join('') : '<div class="bg-white dark:bg-slate-800 rounded-3xl p-10 text-center text-slate-400 text-sm">Nenhum registro ainda. Toque em "Novo registro" para guardar fotos e vídeos da evolução, agrupados por data.</div>'}
            </div>`;
            container.querySelectorAll('[data-evo]').forEach(async el => {
                const id = el.dataset.evo;
                try {
                    if (!_evoUrls[id]) { const b = await getFile(id); if (!b) return; _evoUrls[id] = URL.createObjectURL(b); }
                    el.src = _evoUrls[id];
                } catch (e) {}
            });
        }
        function openEvoModal(id = null) {
            const g = id ? evoData().find(x => x.id === id) : null;
            const v = g || { date: localDateStr(), title: '', obs: '' };
            showModal(g ? 'Editar registro' : 'Novo registro de evolução', `
                <form onsubmit="saveEvo(event, ${id ? `'${id}'` : 'null'})" class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="${LBL}">Data</label><input id="ev-date" type="date" required value="${esc(v.date)}" class="${INP}"></div>
                        <div><label class="${LBL}">Título (opcional)</label><input id="ev-title" value="${esc(v.title || '')}" class="${INP}" placeholder="Ex.: Reboco da sala"></div>
                    </div>
                    <div><label class="${LBL}">Observação</label><textarea id="ev-obs" rows="3" class="${INP}">${esc(v.obs || '')}</textarea></div>
                    <div><label class="${LBL}">Fotos e vídeos</label><input id="ev-files" type="file" multiple accept="image/*,video/*" class="text-sm w-full"></div>
                    <div class="flex justify-end space-x-2 pt-1"><button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">Cancelar</button><button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-teal-600 text-white shadow">Salvar</button></div>

                                        <div class="mt-1 flex flex-wrap gap-1.5 text-[11px]">${i.tipo ? `<span class="px-2 py-0.5 rounded-md bg-teal-100 dark:bg-teal-900 text-teal-700 font-bold">${esc(i.tipo)}</span>` : ''}<span class="px-2 py-0.5 rounded-md bg-slate-200 dark:bg-slate-600 text-slate-600 dark:text-slate-200">${careFreqLabel(i)}</span></div>
                                        ${i.obs ? `<p class="text-xs text-slate-500 mt-1.5 whitespace-pre-line">${esc(i.obs)}</p>` : ''}</div>
                                    <div class="flex items-center gap-1 shrink-0"><button onclick="openCareModal('${i.id}')" class="px-2.5 py-1.5 bg-white dark:bg-slate-700 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button><button onclick="careDelete('${i.id}')" class="px-2.5 py-1.5 bg-white dark:bg-slate-700 rounded-lg text-xs hover:text-rose-600"><i class="fa-solid fa-trash"></i></button></div>
                                </div></div>`).join('')}</div>`}
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                            <h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center space-x-2"><i class="fa-solid fa-circle-check text-teal-500"></i><span>Checklist do dia</span></h3>
                            <div class="flex items-center gap-1.5"><button onclick="careShift(-1)" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-xs"><i class="fa-solid fa-chevron-left"></i></button><span class="text-xs font-bold min-w-[84px] text-center">${isToday ? 'Hoje' : fmtBR(careDate)}</span><button onclick="careShift(1)" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-xs"><i class="fa-solid fa-chevron-right"></i></button>${isToday ? '' : `<button onclick="careDate=localDateStr();renderCurrentTabContent()" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-[11px] font-bold">Hoje</button>`}</div>
                        </div>
                        ${due.length ? `<div class="mb-4"><div class="flex justify-between text-[11px] text-slate-500 mb-1"><span>${done} de ${due.length} feitos</span><span>${pct}%</span></div><div class="h-2 rounded-full bg-slate-100 dark:bg-slate-700 overflow-hidden"><div class="h-2 bg-teal-500 rounded-full" style="width:${pct}%"></div></div></div>` : ''}
                        ${due.length === 0 ? '<p class="text-sm text-slate-400 text-center py-8">Nada previsto para este dia.</p>' : Object.keys(CARE_TURNOS).map(tk => {
                            const its = due.filter(i => (i.turno || 'qualquer') === tk); if (!its.length) return '';
                            return `<div class="mb-4"><p class="text-[11px] font-bold text-slate-400 uppercase mb-1.5">${CARE_TURNOS[tk]}</p><div class="space-y-1.5">${its.map(i => {
                                const ck = careChecked(i.id, careDate);
                                return `<label class="flex items-center gap-3 p-3 rounded-xl cursor-pointer ${ck ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-slate-50 dark:bg-slate-700/40'}"><input type="checkbox" ${ck ? 'checked' : ''} onchange="careToggle('${i.id}','${careDate}')" class="w-4 h-4"><span class="text-sm flex-1 ${ck ? 'line-through opacity-60' : 'text-slate-800 dark:text-white'}">${esc(i.desc)}</span>${i.tipo ? `<span class="text-[10px] text-slate-400">${esc(i.tipo)}</span>` : ''}</label>`;
                            }).join('')}</div></div>`;
                        }).join('')}
                    </div></div>`;
            } else if (careTab === 'metas') {
                const today = localDateStr();
                const pz = i => carePrazoDate(i.prazo);
                const dj = C.items.filter(i => i.modo === 'desejo').sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || (pz(a) || '9999').localeCompare(pz(b) || '9999'));
                const tot = dj.filter(i => !i.done).reduce((s, i) => s + (Number(i.orc) || 0), 0);
                const late = i => !i.done && pz(i) && pz(i) < today;
                const vb = (k, l, ic) => `<button onclick="careSetMetaView('${k}')" class="px-3 py-1.5 text-xs font-bold ${careMetaView === k ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}"><i class="fa-solid ${ic} mr-1"></i>${l}</button>`;
                const acts = i => `<button onclick="openCareModal('${i.id}')" class="px-2.5 py-1.5 bg-white dark:bg-slate-700 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button> <button onclick="careDelete('${i.id}')" class="px-2.5 py-1.5 bg-white dark:bg-slate-700 rounded-lg text-xs hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>`;
                const cards = `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${dj.map(i => `
                    <div class="p-4 rounded-2xl border ${i.done ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-200 dark:border-emerald-900' : 'bg-slate-50 dark:bg-slate-700/40 border-slate-100 dark:border-slate-700'}">
                        <div class="flex items-start justify-between gap-2"><h4 class="font-bold text-sm break-words ${i.done ? 'line-through opacity-60' : 'text-slate-800 dark:text-white'}">${esc(i.desc)}</h4><div class="flex items-center gap-1 shrink-0">${acts(i)}</div></div>
                        <div class="mt-2 flex flex-wrap gap-1.5 text-[11px]">${i.tipo ? `<span class="px-2 py-0.5 rounded-md bg-teal-100 dark:bg-teal-900 text-teal-700 font-bold">${esc(i.tipo)}</span>` : ''}
                            ${i.mper ? `<span class="px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700 font-bold">${CARE_MPER[i.mper] || ''}</span>` : ''}
                            ${i.orc !== '' && i.orc != null ? `<span class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-700 font-bold">R$ ${money(i.orc)}</span>` : ''}
                            ${i.prazo ? `<span class="px-2 py-0.5 rounded-md ${late(i) ? 'bg-rose-100 text-rose-700' : 'bg-slate-200 dark:bg-slate-600 text-slate-600 dark:text-slate-200'} font-bold"><i class="fa-regular fa-calendar mr-1"></i>${carePrazoLabel(i.prazo)}</span>` : ''}</div>
                        ${i.obs ? `<p class="text-xs text-slate-500 mt-2 whitespace-pre-line">${esc(i.obs)}</p>` : ''}
                        <div class="mt-3 flex flex-wrap gap-2"><button onclick="careToggleDone('${i.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold ${i.done ? 'bg-slate-200 dark:bg-slate-600' : 'bg-emerald-600 text-white'}">${i.done ? 'Reabrir' : '<i class="fa-solid fa-check mr-1"></i>Realizada'}</button>
                            ${i.done ? '' : `<button onclick="careActivate('${i.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600">Virar rotina</button>`}</div>
                    </div>`).join('')}</div>`;
                const table = `<div class="overflow-x-auto"><table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 dark:bg-slate-700/50 text-slate-400 uppercase text-[11px]"><tr><th class="p-3 rounded-l-xl">Meta</th><th class="p-3">Tipo</th><th class="p-3">Período</th><th class="p-3">Orçamento</th><th class="p-3">Prazo</th><th class="p-3">Situação</th><th class="p-3 text-right rounded-r-xl">Ações</th></tr></thead>
                    <tbody class="divide-y divide-slate-100 dark:divide-slate-700">${dj.map(i => `<tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/30 align-top">
                        <td class="p-3 font-medium ${i.done ? 'line-through opacity-60' : 'text-slate-800 dark:text-white'}">${esc(i.desc)}${i.obs ? `<p class="text-[11px] font-normal text-slate-400 whitespace-pre-line">${esc(i.obs)}</p>` : ''}</td>
                        <td class="p-3 text-xs">${esc(i.tipo || '') || '—'}</td><td class="p-3 text-xs">${CARE_MPER[i.mper] || '—'}</td>
                        <td class="p-3 whitespace-nowrap">${i.orc !== '' && i.orc != null ? 'R$ ' + money(i.orc) : '—'}</td><td class="p-3 text-xs ${late(i) ? 'text-rose-600 font-bold' : ''}">${i.prazo ? carePrazoLabel(i.prazo) : '—'}</td>
                        <td class="p-3"><button onclick="careToggleDone('${i.id}')" class="px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap ${i.done ? 'bg-emerald-100 text-emerald-700' : late(i) ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}">${i.done ? 'Realizada' : late(i) ? 'Atrasada' : 'Em aberto'}</button></td>
                        <td class="p-3 text-right whitespace-nowrap">${i.done ? '' : `<button onclick="careActivate('${i.id}')" title="Virar rotina" class="px-2.5 py-1.5 bg-white dark:bg-slate-700 rounded-lg text-xs"><i class="fa-solid fa-repeat"></i></button> `}${acts(i)}</td></tr>`).join('')}</tbody>
                    <tfoot><tr class="font-bold"><td class="p-3" colspan="3">Orçamento em aberto</td><td class="p-3 whitespace-nowrap">R$ ${money(tot)}</td><td colspan="3"></td></tr></tfoot></table></div>`;
                body = `<div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-3"><h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center space-x-2"><i class="fa-solid fa-bullseye text-teal-500"></i><span>Metas e desejos</span></h3>
                        <div class="flex flex-wrap items-center gap-2">${tot > 0 ? `<span class="text-xs font-bold px-3 py-1.5 rounded-lg bg-amber-100 text-amber-700">Orçamento em aberto: R$ ${money(tot)}</span>` : ''}
                        <div class="inline-flex rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700">${vb('cards', 'Cartões', 'fa-table-cells-large')}${vb('lista', 'Lista', 'fa-list')}</div></div></div>
                    ${dj.length === 0 ? '<p class="text-sm text-slate-400 text-center py-10">Nenhuma meta ainda. Toque em "Nova meta".</p>' : (careMetaView === 'lista' ? table : cards)}
                </div>`;
            } else {
                const all = careAllTips();
                const seed = careTipIdx != null ? careTipIdx : Math.floor(new Date(localDateStr() + 'T00:00:00').getTime() / 864e5);
                const tip = all[seed % all.length];
                body = `<div class="space-y-6">
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 text-center">
                        <p class="text-xs font-bold text-slate-400 uppercase mb-2">${careTipIdx != null ? 'Frase sorteada' : 'Frase do dia'} · ${CARE_CATS[tip.cat] || 'Minhas frases'}</p>
                        <p class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-white leading-snug">${esc(tip.text)}</p>
                        <button onclick="careNewTip()" class="mt-4 px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold shadow"><i class="fa-solid fa-shuffle mr-1.5"></i>Outra frase</button>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">${Object.keys(CARE_TIPS).map(k => `
                        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
                            <h3 class="font-bold text-slate-800 dark:text-white mb-3">${CARE_CATS[k]}</h3>
                            <ul class="space-y-2 text-sm text-slate-600 dark:text-slate-300">${CARE_TIPS[k].concat(C.frases.filter(f => f.cat === k).map(f => f.text)).map(t => `<li class="flex gap-2"><i class="fa-solid fa-heart text-[10px] text-teal-500 mt-1.5"></i><span>${esc(t)}</span></li>`).join('')}</ul>
                        </div>`).join('')}</div>
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
                        <h3 class="font-bold text-slate-800 dark:text-white mb-3">Minhas frases</h3>
                        <div class="flex flex-wrap gap-2 mb-4"><input type="text" id="care-phrase" placeholder="Escreva uma frase só sua..." class="${INP} flex-1 min-w-[200px]"><select id="care-phrase-cat" class="${INP} w-auto">${Object.keys(CARE_CATS).map(k => `<option value="${k}">${CARE_CATS[k]}</option>`).join('')}</select><button onclick="careAddPhrase()" class="px-4 py-2 rounded-xl bg-teal-600 text-white text-xs font-bold">Adicionar</button></div>
                        ${C.frases.length ? `<ul class="space-y-2">${C.frases.map(f => `<li class="flex items-center justify-between gap-2 text-sm p-2.5 rounded-xl bg-slate-50 dark:bg-slate-700/40"><span><b class="text-[10px] uppercase text-slate-400 mr-2">${CARE_CATS[f.cat] || ''}</b>${esc(f.text)}</span><button onclick="careDelPhrase('${f.id}')" class="text-slate-400 hover:text-rose-600 px-1"><i class="fa-solid fa-trash"></i></button></li>`).join('')}</ul>` : '<p class="text-xs text-slate-400">Você ainda não adicionou frases.</p>'}
                    </div></div>`;
            }
            container.innerHTML = `<div class="space-y-6 max-w-7xl mx-auto">
                <div class="bg-gradient-to-r from-teal-800 to-teal-600 rounded-3xl p-6 sm:p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-5">
                    <div><button onclick="closeCare()" class="text-teal-100 hover:text-white text-xs font-semibold mb-2 flex items-center space-x-1"><i class="fa-solid fa-arrow-left"></i><span>Voltar para Saúde</span></button>
                        <h2 class="text-2xl sm:text-3xl font-bold"><i class="fa-solid fa-spa mr-2"></i> Autocuidado</h2>
                        <p class="text-teal-100 mt-1 text-sm">Rotinas, metas e palavras que fazem bem.</p></div>
                    ${careTab === 'dicas' ? '' : `<button onclick="openCareModal(null,'${careTab === 'metas' ? 'desejo' : 'ativo'}')" class="bg-white text-teal-900 font-bold px-4 py-2.5 rounded-xl shadow-lg flex items-center space-x-2 text-sm"><i class="fa-solid fa-plus"></i><span>${careTab === 'metas' ? 'NOVA META' : 'NOVA ROTINA'}</span></button>`}
                </div>
                <div class="flex flex-wrap gap-2">${tabBtn('rotinas', 'Rotinas', 'fa-list-check')}${tabBtn('metas', 'Metas', 'fa-bullseye')}${tabBtn('dicas', 'Dicas e afirmações', 'fa-heart')}</div>
                ${body}</div>`;
        }
        const CARE_MPER = { semestral: 'Semestral', anual: 'Anual', unico: 'Único' };
        function careSetMetaView(v) { careMetaView = v; renderCurrentTabContent(); }
        // Prazo livre (ex.: "3 meses"). Se for uma data (AAAA-MM-DD ou DD/MM/AAAA), também dá para marcar atraso.
        function carePrazoDate(p) {
            p = String(p || '').trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(p)) return p;
            const m = p.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
        }
        function carePrazoLabel(p) { const d = /^\d{4}-\d{2}-\d{2}$/.test(String(p || '').trim()) ? fmtBR(p) : p; return esc(d); }
        function openCareModal(id = null, modoDef = 'ativo') {
            const it = id ? (careData().items.find(x => x.id === id) || {}) : {};
            const modo = it.modo || modoDef, freq = it.freq || 'diario', turno = it.turno || 'qualquer';
            const o = (v, l, cur) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`;
            const prazoTxt = /^\d{4}-\d{2}-\d{2}$/.test(String(it.prazo || '')) ? fmtBR(it.prazo) : (it.prazo || '');
            showModal(id ? 'Editar' : (modo === 'desejo' ? 'Nova meta' : 'Nova rotina'), `
                <form onsubmit="saveCare(event,'${id || ''}')" class="space-y-4">
                    <div><label class="${LBL}">Descrição *</label><input type="text" id="care-desc" required value="${esc(it.desc || '')}" placeholder="Ex.: Passar creme" class="${INP}"></div>
                    <div><label class="${LBL}">Tipo</label><input type="text" id="care-tipo" list="care-tipos" value="${esc(it.tipo || '')}" placeholder="Ex.: Cuidados com a pele" class="${INP}"><datalist id="care-tipos"><option value="Cuidados com a pele"><option value="Cabelo"><option value="Corpo"><option value="Unhas"><option value="Mente e emoções"><option value="Descanso"><option value="Exercício"><option value="Alimentação"><option value="Beleza"><option value="Lazer"></datalist></div>
                    <div id="care-routine-wrap" class="${modo === 'desejo' ? 'hidden' : ''} space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="${LBL}">Período</label><select id="care-freq" onchange="careFreqChange()" class="${INP}">${o('diario', 'Todos os dias', freq)}${o('dias', 'Dias da semana', freq)}${o('mensal', 'Uma vez por mês', freq)}</select></div>
                            <div><label class="${LBL}">Horário</label><select id="care-turno" class="${INP}">${Object.keys(CARE_TURNOS).map(k => o(k, CARE_TURNOS[k], turno)).join('')}</select></div>
                        </div>
                        <div id="care-days-wrap" class="${freq === 'dias' ? '' : 'hidden'} flex flex-wrap gap-3">${CARE_DIAS.map((d, i) => `<label class="flex flex-col items-center text-[11px] text-slate-500 gap-0.5"><input type="checkbox" class="care-day" value="${i}" ${(it.days || []).includes(i) ? 'checked' : ''}>${d}</label>`).join('')}</div>
                        <div id="care-month-wrap" class="${freq === 'mensal' ? '' : 'hidden'}"><label class="${LBL}">Dia do mês</label><input type="number" min="1" max="31" id="care-mday" value="${it.monthDay || ''}" class="${INP}"></div>
                    </div>
                    <div><label class="${LBL}">Observação</label><input type="text" id="care-obs" value="${esc(it.obs || '')}" placeholder="Ex.: Natura" class="${INP}"></div>
                    <div><label class="${LBL}">Modo</label><select id="care-modo" onchange="careModoChange()" class="${INP}">${o('ativo', 'Ativo: já posso realizar', modo)}${o('desejo', 'Desejo: quero realizar um dia', modo)}</select></div>
                    <div id="care-desejo-wrap" class="${modo === 'desejo' ? '' : 'hidden'} space-y-4">
                        <div><label class="${LBL}">Período (opcional)</label><select id="care-mper" class="${INP}">${o('', 'Sem período', it.mper || '')}${o('semestral', 'Semestral', it.mper || '')}${o('anual', 'Anual', it.mper || '')}${o('unico', 'Único', it.mper || '')}</select></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="${LBL}">Orçamento (opcional)</label><input type="number" step="0.01" min="0" id="care-orc" value="${it.orc != null ? it.orc : ''}" class="${INP}"></div>
                            <div><label class="${LBL}">Prazo (opcional)</label><input type="text" id="care-prazo" value="${esc(prazoTxt)}" placeholder="Ex.: 3 meses" class="${INP}"></div>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Salvar</button>
                </form>`);
        }
        function careFreqChange() {
            const f = document.getElementById('care-freq').value;
            document.getElementById('care-days-wrap').classList.toggle('hidden', f !== 'dias');
            document.getElementById('care-month-wrap').classList.toggle('hidden', f !== 'mensal');
        }
        function careModoChange() {
            const d = document.getElementById('care-modo').value === 'desejo';
            document.getElementById('care-desejo-wrap').classList.toggle('hidden', !d);
            document.getElementById('care-routine-wrap').classList.toggle('hidden', d);
        }
        function saveCare(e, id) {
            e.preventDefault();
            const g = k => document.getElementById(k).value;
            const modo = g('care-modo');
            const data = { desc: g('care-desc').trim(), tipo: g('care-tipo').trim(), freq: g('care-freq'), turno: g('care-turno'), obs: g('care-obs').trim(), modo,
                days: Array.from(document.querySelectorAll('.care-day:checked')).map(c => Number(c.value)), monthDay: g('care-mday'),
                mper: modo === 'desejo' ? g('care-mper') : '', orc: modo === 'desejo' ? g('care-orc') : '', prazo: modo === 'desejo' ? g('care-prazo').trim() : '' };
            const C = careData();
            if (id) Object.assign(C.items.find(x => x.id === id), data); else C.items.push(Object.assign({ id: uid(), done: false }, data));
            careTab = modo === 'desejo' ? 'metas' : 'rotinas';
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast('Salvo!', 'success');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = "bg-emerald-600 text-white";
            if (type === 'error') bgClass = "bg-rose-600 text-white";
            if (type === 'warning') bgClass = "bg-amber-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl text-xs font-bold flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.onload = async function() {
            applyColors(getColors());
            await cloudInit();
        };
    </script>
<script>if(window.innerWidth<768){var _sb=document.getElementById('sidebar');if(_sb)_sb.classList.add('-translate-x-full');}
try{sbApplyPin();}catch(e){}</script>
<script>(function(){var c=window.closeModal;if(typeof c==='function'){window.closeModal=function(){nEd={};return c.apply(this,arguments);};}})();</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
